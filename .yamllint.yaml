---
extends: default

ignore:
  # Helm templates use Go templating syntax which yamllint doesn't understand
  - "platform/*/templates/*.yaml"
  - "platform/*/config/templates/*.yaml"
  - "platform/*/crd/templates/*.yaml"
  - "platform/storage/*/templates/*.yaml"
  - "platform/volsync/templates/*.yaml"
  - "platform/argocd/self/templates/*.yaml"  # two levels deep, missed by platform/*/templates
  - "services/*/app/templates/*.yaml"
  # Upstream chart unpacked by `helm dependency build` (gitignored, not ours)
  - "platform/argocd/self/charts/"
  # ansible-lint's project-local collection cache (third-party, gitignored)
  - "**/.ansible/"
  - "bootstrap/ansible/roles/secret_zero/defaults/main.yml"
  - "infrastructure/tofu/*.yaml"

rules:
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
  document-start:
    present: true
  empty-lines:
    max: 1

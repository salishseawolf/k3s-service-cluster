monorepo_root = true

[monorepo]
config_roots = [
    "infrastructure/*",
    "bootstrap/ansible",
    "bootstrap/node-tooling",
    "services/*",
]

[env]
_.file = [".secrets.env", "/tmp/.secrets.env.agent"]
KUBECONFIG = "{{ config_root }}/kubeconfig"
TF_VAR_cloudflare_zone_id = "op://K3s Service Cluster/Cloudflare DNS Challenge/zone_id"
TF_VAR_domain = "op://K3s Service Cluster/Cloudflare DNS Challenge/domain"
TF_VAR_server_type = "cx33"
DOMAIN = "{{ env.TF_VAR_domain }}"
ANSIBLE_FORCE_COLOR = "1"
OP_ACCOUNT = "U2NWAVMUCZHATMVL7WHEOJIDNY"
RESTIC_REPOSITORY="op://K3s Service Cluster/VolSync B2 paperless-media/RESTIC_REPOSITORY"
AWS_ACCESS_KEY_ID="op://K3s Service Cluster/VolSync B2 paperless-media/AWS_ACCESS_KEY_ID"
AWS_SECRET_ACCESS_KEY="op://K3s Service Cluster/VolSync B2 paperless-media/AWS_SECRET_ACCESS_KEY"
RESTIC_PASSWORD="op://K3s Service Cluster/VolSync B2 paperless-media/RESTIC_PASSWORD"

[tools]
"opentofu" = "latest"
"pre-commit" = "3.8.0"
"pipx" = "latest"
"uv" = "latest"
"pipx:ansible-core" = { version = "latest", uvx_args = "--with requests --with hcloud --with kubernetes" }
"pipx:ansible-lint" = "latest"
"pipx:b2" = "latest"
"kubectl" = "latest"
"yamllint" = "latest"
"hcloud" = "latest"
"helm" = "3.14.4"
"helm-diff" = "latest"
"kubeconform" = "0.8.0"
"kube-linter" = "0.8.3"
"yq" = "latest"
"mc" = "latest"
"restic" = "latest"

# ── There is no `deploy` task anymore. Deploying is a property of `main`:
#    merged == deployed (Argo reconciles continuously). The only imperative
#    verbs left are bootstrap (once per cluster life) and destroy.

[tasks.setup]
description = "Setup project dependencies and initialize"
run = [
  "mise install",
  "mise run //infrastructure/tofu:init",
  "mise run //bootstrap/ansible:init",
]

[tasks.check]
description = "Validate everything: lint sources (YAML/tofu/ansible), then validate rendered charts"
run = [
  # 1. Non-template sources (Helm templates are ignored in .yamllint.yaml)
  "yamllint -c .yamllint.yaml infrastructure/ bootstrap/ platform/ services/",
  "mise run //infrastructure/tofu:check",
  "mise run //bootstrap/ansible:lint",
  # 2. What Argo actually applies
  "mise run check:rendered-charts",
]

[tasks."check:rendered-charts"]
description = "helm template every chart, then kubeconform + kube-linter the output"
# Also used by CI (.github/workflows/validate-*.yaml). Extra args pass through:
#   mise run check:rendered-charts -- services/
#   mise run check:rendered-charts -- --changed-since origin/main
run = "bash scripts/check-rendered-charts.sh"

[tasks."check:renovate"]
description = "Validate renovate.json5 as a repo config (stricter than global)"
# keep-id maps your uid to the image's ubuntu user (12021) so it can read the
# checkout; :z is the shared SELinux label (:Z would lock out other containers).
run = """
podman run --rm \
  --userns=keep-id:uid=12021,gid=12021 \
  -v "{{config_root}}:/repo:ro,z" -w /repo \
  ghcr.io/renovatebot/renovate:latest renovate-config-validator
"""

[tasks.bootstrap]
description = "Bootstrap a cluster: tofu + K3s + secret zero + Argo CD. Argo does the rest."
run = """
op run -- bash -c '
  set -e
  rm -rf /tmp/ansible_facts
  echo "==> Infrastructure (OpenTofu)..."
  mise run //infrastructure/tofu:apply -auto-approve
  echo "==> K3s + 1Password Connect + secret zero + Argo CD..."
  mise run //bootstrap/ansible:deploy
  echo ""
  echo "Bootstrap complete. Argo CD now owns the cluster:"
  echo "  kubectl -n argocd get applications -w"
'
"""

[tasks.destroy]
description = "Tear down all cloud resources"
run = "mise run //infrastructure/tofu:destroy"

[tasks."step-ca:init"]
description = "Initialize step-ca PKI using step CLI, store in 1Password"
run = '''
#!/bin/bash
set -e
TEMP_DIR="$(mktemp -d)"
trap 'rm -rf "$TEMP_DIR"' EXIT

CA_PASS="$(op read "op://K3s Service Cluster/StepCA Secrets/ca_password")"
PROV_PASS="$(op read "op://K3s Service Cluster/StepCA Secrets/provisioner_password")"

echo -n "$CA_PASS" > "$TEMP_DIR/ca_pass"
echo -n "$PROV_PASS" > "$TEMP_DIR/prov_pass"

echo "==> Generating step-ca PKI (X.509 + SSH)..."
mise x step -- step ca init --helm \
  --name="Salish Sea Wolf LLC Internal CA" \
  --dns="step-ca.step-ca.svc.cluster.local" \
  --address=":443" \
  --provisioner="admin@salishseawolf.com" \
  --password-file="$TEMP_DIR/ca_pass" \
  --provisioner-password-file="$TEMP_DIR/prov_pass" \
  --ssh \
  > "$TEMP_DIR/values.yaml"

echo "==> Extracting PKI components..."
cd "$TEMP_DIR"
yq -r '.inject.certificates.root_ca' values.yaml > root_ca.crt
yq -r '.inject.certificates.intermediate_ca' values.yaml > intermediate_ca.crt
yq -r '.inject.secrets.x509.intermediate_ca_key' values.yaml > intermediate_ca.key
yq '.inject.config.files."ca.json"' values.yaml | yq -o=json > ca.json
yq '.inject.config.files."defaults.json"' values.yaml | yq -o=json > defaults.json
yq -r '.inject.secrets.ssh.host_ca_key' values.yaml > ssh_host_ca.key 2>/dev/null || echo "no ssh host key"
yq -r '.inject.secrets.ssh.user_ca_key' values.yaml > ssh_user_ca.key 2>/dev/null || echo "no ssh user key"

echo "==> Storing PKI in 1Password..."
op item edit "StepCA Secrets" --vault "K3s Service Cluster" \
  "root_ca_crt=$(cat root_ca.crt)" \
  "intermediate_ca_crt=$(cat intermediate_ca.crt)" \
  "intermediate_ca_key=$(cat intermediate_ca.key)" \
  "ca_json=$(cat ca.json)" \
  "defaults_json=$(cat defaults.json)" \
  "ssh_host_ca_key=$(cat ssh_host_ca.key)" \
  "ssh_user_ca_key=$(cat ssh_user_ca.key)"

echo "==> step-ca PKI initialized and stored in 1Password!"
'''

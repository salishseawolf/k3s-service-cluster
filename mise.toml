experimental_monorepo_root = true

[monorepo]
config_roots = [
    "infrastructure/*",
    "bootstrap/ansible",
    "bootstrap/node-tooling",
]

[env]
MISE_EXPERIMENTAL = 1
_.file = [".secrets.env", "/tmp/.secrets.env.agent"]
KUBECONFIG = "{{ config_root }}/kubeconfig"
TF_VAR_cloudflare_zone_id = "op://K3s Service Cluster/Cloudflare DNS Challenge/zone_id"
TF_VAR_domain = "op://K3s Service Cluster/Cloudflare DNS Challenge/domain"
# Single test node covering prod's cumulative 3x cx23 (6 vCPU / 12 GB);
# JSON list — node count = list length (see tools/test-cluster/tofu/variables.tf)
TF_VAR_server_types = '["cx43"]'
DOMAIN = "{{ env.TF_VAR_domain }}"
ANSIBLE_FORCE_COLOR = "1"
OP_ACCOUNT = "U2NWAVMUCZHATMVL7WHEOJIDNY"

# Test cluster variables (resolved by op run during test-cluster:drill)
TF_VAR_hcloud_token = "{{ env.HCLOUD_TOKEN }}"
TF_VAR_ssh_key_name = "op://K3s Service Cluster/K3s Service Cluster SSH Key/hetzner_key_name"
TF_VAR_allowed_admin_cidr = "op://K3s Service Cluster/Admin Allow List/IPV4"
K3S_TOKEN = "op://K3s Service Cluster/K3s Service Cluster/credential"
K3S_ETCD_SECRET = "op://K3s Service Cluster/K3s Service Cluster/etcd_secret"

[tools]
"opentofu" = "latest"
"pre-commit" = "3.8.0"
"pipx" = "latest"
"uv" = "latest"
"pipx:ansible-core" = { version = "latest", uvx_args = "--with requests --with hcloud --with kubernetes" }
"pipx:ansible-lint" = "latest"
"pipx:b2" = "latest"
"kubectl" = "latest"
"yamllint" = "latest"
"hcloud" = "latest"
"helm" = "3.14.4"
"helm-diff" = "latest"
"kubeconform" = "latest"
"kube-linter" = "latest"
"yq" = "latest"
"mc" = "latest"

# ── There is no `deploy` task anymore. Deploying is a property of `main`:
#    merged == deployed (Argo reconciles continuously). The only imperative
#    verbs left are bootstrap (once per cluster life) and destroy.

[tasks.setup]
description = "Setup project dependencies and initialize"
run = [
  "mise install",
  "mise run //infrastructure/tofu:init",
  "mise run //bootstrap/ansible:init",
]

[tasks.check]
description = "Validate everything: lint YAML/ansible, template every chart"
run = [
  "yamllint -c .yamllint.yaml infrastructure/ bootstrap/ platform/ services/",
  "mise run //infrastructure/tofu:check",
  "mise run //bootstrap/ansible:lint",
  "bash -c 'set -e; for c in services/*/app platform/storage/seaweedfs platform/storage/seaweedfs-csi platform/cert-manager/config platform/cert-manager/crd platform/step-ca/config platform/step-ca/crd platform/velero platform/argocd/self; do [ -f \"$c/Chart.yaml\" ] || continue; echo \"==> helm template $c\"; helm template test \"$c\" --set domain=example.test >/dev/null; done'",
]

[tasks.bootstrap]
description = "Bootstrap a cluster: tofu + K3s + secret zero + Argo CD. Argo does the rest."
run = """
op run -- bash -c '
  set -e
  rm -rf /tmp/ansible_facts
  echo "==> Infrastructure (OpenTofu)..."
  mise run //infrastructure/tofu:apply -auto-approve
  echo "==> K3s + 1Password Connect + secret zero + Argo CD..."
  mise run //bootstrap/ansible:deploy
  echo ""
  echo "Bootstrap complete. Argo CD now owns the cluster:"
  echo "  kubectl -n argocd get applications -w"
'
"""

[tasks.destroy]
description = "Tear down all cloud resources"
run = "mise run //infrastructure/tofu:destroy"

# Test cluster drill moved to tools/backup-restore-drill/mise.toml
# Run with: mise -p tools/backup-restore-drill run drill
# Run with: mise -p tools/backup-restore-drill run destroy

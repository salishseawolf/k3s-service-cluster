[env]
# Tofu variables
TF_VAR_test_domain = "op://K3s Service Cluster/Cloudflare DNS Challenge/test_domain"
TF_VAR_location = "fsn1"
TF_VAR_cloudflare_api_token = "op://Hermes Agent/K3s Service Cluster Cloudflare DNS Challenge/token"

# CNPG B2 backup credentials (resolved by op run — NOT the 1Password Operator)
CNPG_B2_KEY_ID = "op://K3s Service Cluster/BackBlaze CNPG B2 Bucket/s3_key_id"
CNPG_B2_APP_KEY = "op://K3s Service Cluster/BackBlaze CNPG B2 Bucket/s3_application_key"
VELERO_B2_KEY_ID = "op://K3s Service Cluster/BackBlaze Velero B2 Bucket/s3_key_id"
VELERO_B2_APP_KEY = "op://K3s Service Cluster/BackBlaze Velero B2 Bucket/s3_application_key"

[tools]
"velero" = "latest"

[tasks.drill]
description = "Provision test cluster, restore CNPG and Velero backups, validate data integrity"
run = """
op run -- ./drill.sh
"""

[tasks.destroy]
description = "Tear down the test cluster"
run = """
op run -- bash -c '
cd "$MISE_PROJECT_ROOT"/../test-cluster/tofu
tofu destroy -auto-approve
'
"""

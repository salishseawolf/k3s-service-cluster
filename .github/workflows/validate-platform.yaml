---
name: validate-platform
on:
  pull_request:
    paths:
      - "platform/**"
      - "bootstrap/**"
      - ".github/workflows/validate-platform.yaml"
      - ".kube-linter.yaml"
      - "scripts/check-rendered-charts.sh"
      - "mise.toml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "bootstrap/**"
      - ".github/workflows/validate-platform.yaml"
      - ".kube-linter.yaml"
      - "scripts/check-rendered-charts.sh"
      - "mise.toml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -c .yamllint.yaml platform/ bootstrap/

      - name: ansible-lint
        # Run from the project dir so bootstrap/ansible/.ansible-lint (skip_list,
        # exclude_paths) applies, same as `mise run //bootstrap/ansible:lint`.
        working-directory: bootstrap/ansible
        run: |
          pipx install --include-deps ansible-lint
          ansible-lint

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # --changed-since diffs against earlier commits

      # Same tool pins as local runs (mise.toml); only what the check needs.
      - uses: jdx/mise-action@v5
        with:
          install_args: helm kubeconform kube-linter yq

      # Same task `mise run check` uses locally: helm template from a temp
      # copy (locked deps) -> kubeconform -> kube-linter (.kube-linter.yaml).
      - name: Rendered platform charts
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Only charts this change touches. Push to main: since the previous
          # main. Branches (incl. renovate/**) and PRs: since their fork
          # point from main. Lint config/script/tool changes check them all.
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          mise run check:rendered-charts -- --changed-since "$base" platform/

---
# CI = validation only. CD belongs to Argo, so CI never
# holds cluster credentials: these jobs run on GitHub-hosted runners with a
# read-only token and nothing that can reach the cluster.
name: validate-services
on:
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/validate-services.yaml"
      - ".kube-linter.yaml"
      - "scripts/check-rendered-charts.sh"
      - "mise.toml"
      - "bootstrap/ansible/inventory/group_vars/all.yml"  # k3s version for kubeconform
  push:
    # renovate/** so Renovate's branches get checked before it opens a PR
    # (renovate.json5 prCreation: status-success). No branch protection on
    # this account, so that is the only pre-merge gate for bot updates.
    branches: [main, "renovate/**"]
    paths:
      - "services/**"
      - ".github/workflows/validate-services.yaml"
      - ".kube-linter.yaml"
      - "scripts/check-rendered-charts.sh"
      - "mise.toml"
      - "bootstrap/ansible/inventory/group_vars/all.yml"  # k3s version for kubeconform

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -c .yamllint.yaml services/

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # --changed-since diffs against earlier commits

      # Same tool pins as local runs (mise.toml); only what the check needs.
      - uses: jdx/mise-action@v5
        with:
          install_args: helm kubeconform kube-linter yq

      # Same task `mise run check` uses locally: helm template from a temp
      # copy (locked deps) -> kubeconform -> kube-linter (.kube-linter.yaml).
      - name: Rendered service charts
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Only charts this change touches. Push to main: since the previous
          # main. Branches (incl. renovate/**) and PRs: since their fork
          # point from main. Lint config/script/tool changes check them all.
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          mise run check:rendered-charts -- --changed-since "$base" services/

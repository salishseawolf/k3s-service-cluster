---
- name: Add VMware Tanzu Helm Repo
  kubernetes.core.helm_repository:
    name: vmware-tanzu
    repo_url: "https://vmware-tanzu.github.io/helm-charts"

- name: Create Velero Namespace
  kubernetes.core.k8s:
    name: "{{ velero_namespace }}"
    api_version: v1
    kind: Namespace
    state: present
    definition:
      metadata:
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/audit-version: latest
          pod-security.kubernetes.io/warn: privileged
          pod-security.kubernetes.io/warn-version: latest

- name: Create OnePasswordItem for Velero B2 credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: "{{ velero_b2_secret_name }}"
        namespace: "{{ velero_namespace }}"
      spec:
        itemPath: "vaults/K3s Service Cluster/items/BackBlaze Velero B2 Bucket"

- name: Wait for Velero B2 secret to sync
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ velero_b2_secret_name }}"
    namespace: "{{ velero_namespace }}"
  register: b2_sync
  retries: 30
  delay: 2
  until: b2_sync.resources | length > 0

- name: Read B2 credentials from synced secret
  set_fact:
    velero_b2_key_id: "{{ b2_sync.resources[0].data.s3_key_id | b64decode }}"
    velero_b2_app_key: "{{ b2_sync.resources[0].data.s3_application_key | b64decode }}"

- name: Create formatted Velero credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ velero_credentials_secret_name }}"
        namespace: "{{ velero_namespace }}"
      type: Opaque
      stringData:
        cloud: |
          [default]
          aws_access_key_id = {{ velero_b2_key_id }}
          aws_secret_access_key = {{ velero_b2_app_key }}

- name: Install Velero
  kubernetes.core.helm:
    name: velero
    chart_ref: vmware-tanzu/velero
    chart_version: "{{ velero_chart_version }}"
    release_namespace: "{{ velero_namespace }}"
    create_namespace: false
    wait: true
    update_repo_cache: true
    skip_crds: true
    values:
      upgradeCRDs: false
      configuration:
        volumeSnapshotLocation: []
        backupStorageLocation:
          - name: default
            provider: aws
            bucket: "{{ velero_b2_bucket }}"
            prefix: "{{ velero_b2_prefix }}"
            config:
              region: "{{ velero_b2_region }}"
              s3ForcePathStyle: true
              s3Url: "{{ velero_b2_endpoint }}"
        uploaderType: kopia
      credentials:
        existingSecret: "{{ velero_credentials_secret_name }}"
      kubectl:
        image:
          tag: latest
      initContainers:
        - name: velero-plugin-for-aws
          image: velero/velero-plugin-for-aws:v1.10.0
          volumeMounts:
            - mountPath: /target
              name: plugins

      schedules:
        default-backup:
          schedule: "{{ velero_schedule_cron }}"
          useOwnerReferencesInBackup: true
          template:
            ttl: "{{ velero_schedule_ttl }}"
            snapshotVolumes: false
            defaultVolumesToFsBackup: true
            excludedNamespaces:
              - database
              - cnpg-system
            includedNamespaces:
              - '*'
      deployNodeAgent: true

      nodeAgent:
        resources:
          requests:
            cpu: "{{ velero_node_agent_requests_cpu }}"
            memory: "{{ velero_node_agent_requests_memory }}"
          limits:
            cpu: "{{ velero_node_agent_limits_cpu }}"
            memory: "{{ velero_node_agent_limits_memory }}"

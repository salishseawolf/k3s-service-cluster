---
velero_namespace: "velero"
velero_chart_version: "8.5.0"
velero_b2_secret_name: "velero-b2-raw"
velero_credentials_secret_name: "velero-b2-credentials"
velero_b2_bucket: "blackviolet"
velero_b2_region: "eu-central-003"
velero_b2_endpoint: "https://s3.eu-central-003.backblazeb2.com"

# Node-agent resource limits
velero_node_agent_requests_cpu: "100m"
velero_node_agent_requests_memory: "128Mi"
velero_node_agent_limits_cpu: "300m"
velero_node_agent_limits_memory: "256Mi"
velero_b2_prefix: "velero/"

velero_schedule_enabled: true
velero_schedule_name: "default-backup"
velero_schedule_cron: "0 0 * * *"
velero_schedule_ttl: "720h"
velero_snapshot_volumes: false

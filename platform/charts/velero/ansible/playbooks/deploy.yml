---
- hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    kubernetes.core.helm:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"
    kubernetes.core.k8s:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"
    kubernetes.core.helm_repository:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"

  roles:
    - role: velero

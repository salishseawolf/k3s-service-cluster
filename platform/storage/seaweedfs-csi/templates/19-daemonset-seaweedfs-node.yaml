apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seaweedfs-node
  namespace: 'seaweedfs-csi'
  labels:
    app.kubernetes.io/name: seaweedfs-node
  annotations:
    # Deliberate exceptions: a CSI node plugin must mount filesystems on the host.
    ignore-check.kube-linter.io/privileged-container: >-
      CSI node plugin: FUSE/bind mounts into the host's kubelet dirs need privileged.
    ignore-check.kube-linter.io/privilege-escalation-container: >-
      Implied by privileged; required for host mount propagation.
    ignore-check.kube-linter.io/drop-net-raw-capability: >-
      Moot for a privileged container, which has every capability.
    ignore-check.kube-linter.io/host-pid: >-
      CSI node plugin shares the host PID namespace to manage host-side mounts.
    ignore-check.kube-linter.io/sensitive-host-mounts: >-
      Needs /dev from the host for FUSE devices.
    ignore-check.kube-linter.io/run-as-non-root: >-
      Root is required to mount on the host and to write the kubelet
      plugin-registration socket (root-owned hostPath).
    ignore-check.kube-linter.io/no-read-only-root-fs: >-
      Upstream seaweedfs-csi images are not built for a read-only root;
      revisit for the sidecars if upstream supports it.
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-node
    spec:
      serviceAccountName: seaweedfs-node-sa
      hostPID: true
      priorityClassName: system-node-critical
      containers:
      - name: seaweedfs-csi-driver
        image: 'chrislusf/seaweedfs-csi-driver:v1.4.5'
        args:
        - --endpoint=$(CSI_ENDPOINT)
        - --filer=$(SEAWEEDFS_FILER)
        - --nodeid=$(NODE_ID)
        - --driverName=$(DRIVER_NAME)
        - --mountEndpoint=$(MOUNT_ENDPOINT)
        - --cacheDir=/var/cache/seaweedfs
        - --components=node
        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
        env:
        - name: SEAWEEDFS_FILER
          value: 'seaweedfs-internal.seaweedfs.svc.cluster.local:8888'
        - name: CSI_ENDPOINT
          value: unix:///var/lib/csi/sockets/seaweedfs.sock
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DRIVER_NAME
          value: seaweedfs-csi-driver
        - name: MOUNT_ENDPOINT
          value: unix:///var/lib/seaweedfs-mount/seaweedfs-mount.sock
        volumeMounts:
        # Staging dirs live under plugins/kubernetes.io/csi/; seaweedfs-mount
        # creates the FUSE mounts there, so this needs Bidirectional to see
        # them (as upstream). A non-propagating /var/lib/kubelet mount made
        # NodePublish bind the empty dir underneath: every PVC was node-local
        # disk until 2026-10 (see docs, SeaweedFS RCA).
        - name: kubelet-plugins-dir
          mountPath: /var/lib/kubelet/plugins
          mountPropagation: Bidirectional
        - name: plugins-dir
          mountPath: /var/lib/csi/sockets
          mountPropagation: Bidirectional
        - name: pods-mount-dir
          mountPath: /var/lib/kubelet/pods
          mountPropagation: Bidirectional
        - name: mount-dir
          mountPath: /var/lib/seaweedfs-mount
        - name: device-dir
          mountPath: /dev
        - name: cache-dir
          mountPath: /var/cache/seaweedfs
      - name: driver-registrar
        image: 'registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.8.0'
        args:
        - --csi-address=$(ADDRESS)
        - --kubelet-registration-path=/var/lib/kubelet/plugins/seaweedfs-csi-driver/seaweedfs.sock
        - --http-endpoint=:9809
        env:
        - name: ADDRESS
          value: unix:///var/lib/csi/sockets/seaweedfs.sock
        volumeMounts:
        - name: plugins-dir
          mountPath: /var/lib/csi/sockets
        - name: registration-dir
          mountPath: /registration
      - name: livenessprobe
        image: 'registry.k8s.io/sig-storage/livenessprobe:v2.10.0'
        args:
        - --csi-address=$(ADDRESS)
        - --http-endpoint=:9812
        env:
        - name: ADDRESS
          value: unix:///var/lib/csi/sockets/seaweedfs.sock
        volumeMounts:
        - name: plugins-dir
          mountPath: /var/lib/csi/sockets
      volumes:
      - name: kubelet-plugins-dir
        hostPath:
          path: '/var/lib/kubelet/plugins'
          type: Directory
      - name: plugins-dir
        hostPath:
          path: '/var/lib/kubelet/plugins/seaweedfs-csi-driver'
          type: DirectoryOrCreate
      - name: registration-dir
        hostPath:
          path: '/var/lib/kubelet/plugins_registry'
          type: DirectoryOrCreate
      - name: pods-mount-dir
        hostPath:
          path: '/var/lib/kubelet/pods'
          type: DirectoryOrCreate
      - name: mount-dir
        hostPath:
          path: /var/lib/seaweedfs-mount
          type: DirectoryOrCreate
      - name: device-dir
        hostPath:
          path: /dev
          type: Directory
      - name: cache-dir
        emptyDir: {}

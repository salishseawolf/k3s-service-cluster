# Health gate: the CSI app is not Healthy until a real PVC binds and mounts.
# Converts the runbook's manual "confirm a PVC binds" check into a permanent,
# automatic gate on every deploy — wave 40 consumers never start against
# broken storage.
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-csi-pvc-canary
  namespace: seaweedfs-csi
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: >-
      Argo's hook-delete-policy owns this Job's lifecycle; a TTL would race it.
    ignore-check.kube-linter.io/run-as-non-root: >-
      Non-root writes to a fresh seaweedfs PVC depend on CSI fsGroup support,
      and a failing canary blocks every wave-40 service.
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: canary
          image: busybox:1.36
          command: ["sh", "-c", "echo ok > /probe/canary && cat /probe/canary"]
          # Writes only to the PVC under test. Still root on purpose: whether
          # non-root can write to a fresh seaweedfs PVC depends on CSI fsGroup
          # support, and a failing canary blocks every wave-40 service.
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: probe
              mountPath: /probe
      volumes:
        - name: probe
          persistentVolumeClaim:
            claimName: csi-canary
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: csi-canary
  namespace: seaweedfs-csi
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: seaweedfs-storage
  resources:
    requests:
      storage: 1Gi

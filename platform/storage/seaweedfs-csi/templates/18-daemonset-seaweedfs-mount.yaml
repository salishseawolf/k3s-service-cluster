apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seaweedfs-mount
  namespace: 'seaweedfs-csi'
  labels:
    app.kubernetes.io/name: seaweedfs-mount
spec:
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-mount
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-mount
    spec:
      serviceAccountName: seaweedfs-mount-sa
      hostPID: true
      priorityClassName: system-node-critical
      containers:
      - name: seaweedfs-mount
        image: 'chrislusf/seaweedfs-mount:v1.4.5'
        args:
        - --endpoint=unix:///var/lib/seaweedfs-mount/seaweedfs-mount.sock
        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
        volumeMounts:
        - name: plugins-dir
          mountPath: '/var/lib/kubelet/plugins'
          mountPropagation: Bidirectional
        - name: pods-mount-dir
          mountPath: '/var/lib/kubelet/pods'
          mountPropagation: Bidirectional
        - name: mount-dir
          mountPath: /var/lib/seaweedfs-mount
          mountPropagation: Bidirectional
        - name: device-dir
          mountPath: /dev
        - name: cache-dir
          mountPath: /var/cache/seaweedfs
      volumes:
      - name: plugins-dir
        hostPath:
          path: '/var/lib/kubelet/plugins'
          type: Directory
      - name: pods-mount-dir
        hostPath:
          path: '/var/lib/kubelet/pods'
          type: Directory
      - name: mount-dir
        hostPath:
          path: /var/lib/seaweedfs-mount
          type: DirectoryOrCreate
      - name: device-dir
        hostPath:
          path: /dev
          type: Directory
      - name: cache-dir
        emptyDir: {}

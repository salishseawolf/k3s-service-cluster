apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seaweedfs-mount
  namespace: 'seaweedfs-csi'
  labels:
    app.kubernetes.io/name: seaweedfs-mount
  annotations:
    # Deliberate exceptions: a CSI mount service must mount filesystems on the host.
    ignore-check.kube-linter.io/privileged-container: >-
      CSI mount service: FUSE/bind mounts into the host's kubelet dirs need privileged.
    ignore-check.kube-linter.io/privilege-escalation-container: >-
      Implied by privileged; required for host mount propagation.
    ignore-check.kube-linter.io/drop-net-raw-capability: >-
      Moot for a privileged container, which has every capability.
    ignore-check.kube-linter.io/host-pid: >-
      CSI mount service shares the host PID namespace to manage host-side mounts.
    ignore-check.kube-linter.io/sensitive-host-mounts: >-
      Needs /dev from the host for FUSE devices.
    ignore-check.kube-linter.io/run-as-non-root: >-
      Root is required to mount on the host and to write the kubelet
      plugin-registration socket (root-owned hostPath).
    ignore-check.kube-linter.io/no-read-only-root-fs: >-
      Upstream seaweedfs-csi images are not built for a read-only root;
      revisit for the sidecars if upstream supports it.
spec:
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-mount
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-mount
    spec:
      serviceAccountName: seaweedfs-mount-sa
      hostPID: true
      priorityClassName: system-node-critical
      containers:
      - name: seaweedfs-mount
        image: 'chrislusf/seaweedfs-mount:v1.4.5'
        args:
        - --endpoint=unix:///var/lib/seaweedfs-mount/seaweedfs-mount.sock
        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
        volumeMounts:
        - name: plugins-dir
          mountPath: '/var/lib/kubelet/plugins'
          mountPropagation: Bidirectional
        - name: pods-mount-dir
          mountPath: '/var/lib/kubelet/pods'
          mountPropagation: Bidirectional
        - name: mount-dir
          mountPath: /var/lib/seaweedfs-mount
          mountPropagation: Bidirectional
        - name: device-dir
          mountPath: /dev
        - name: cache-dir
          mountPath: /var/cache/seaweedfs
      volumes:
      - name: plugins-dir
        hostPath:
          path: '/var/lib/kubelet/plugins'
          type: Directory
      - name: pods-mount-dir
        hostPath:
          path: '/var/lib/kubelet/pods'
          type: Directory
      - name: mount-dir
        hostPath:
          path: /var/lib/seaweedfs-mount
          type: DirectoryOrCreate
      - name: device-dir
        hostPath:
          path: /dev
          type: Directory
      - name: cache-dir
        emptyDir: {}

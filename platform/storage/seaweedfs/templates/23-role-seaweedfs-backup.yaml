apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seaweedfs-backup
  namespace: 'seaweedfs'
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - create

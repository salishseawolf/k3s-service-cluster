apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-backup-check
  namespace: 'seaweedfs'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-backup-check
  template:
    metadata:
      labels:
        app: seaweedfs-backup-check
    spec:
      serviceAccountName: seaweedfs-backup-check
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: server
        image: python:3.11-slim
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 60
        command:
        - sh
        - -c
        - |
          python3 -c "
          import http.server, json, time, urllib.request, os, ssl
          from datetime import datetime, timezone

          NAMESPACE = os.environ.get('NAMESPACE', 'seaweedfs')
          K8S_HOST = 'https://kubernetes.default.svc'
          TOKEN_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/token'
          CA_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
          MAX_HOURS = 36

          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != '/health':
                      self.send_response(404)
                      self.end_headers()
                      return
                  try:
                      token = open(TOKEN_PATH).read()
                      req = urllib.request.Request(
                          f'{K8S_HOST}/apis/batch/v1/namespaces/{NAMESPACE}/cronjobs/seaweedfs-backup',
                          headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'}
                      )
                      ctx = ssl.create_default_context(cafile=CA_PATH)
                      resp = urllib.request.urlopen(req, context=ctx, timeout=10)
                      data = json.loads(resp.read())
                      t = data.get('status', {}).get('lastSuccessfulTime')
                      if not t:
                          self.send_response(200)
                          self.send_header('Content-Type', 'application/json')
                          self.end_headers()
                          self.wfile.write(json.dumps({'status': 'no_backup_found'}).encode())
                          return
                      last_dt = datetime.fromisoformat(t.replace('Z', '+00:00'))
                      age = (datetime.now(timezone.utc) - last_dt).total_seconds()
                      ok = age < MAX_HOURS * 3600
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({
                          'status': 'ok' if ok else 'stale',
                          'last_backup': t,
                          'age_hours': round(age / 3600, 1)
                      }).encode())
                  except Exception as e:
                      self.send_response(500)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({'status': 'error', 'message': str(e)}).encode())
          http.server.HTTPServer(('0.0.0.0', 8080), H).serve_forever()
          "
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 256Mi

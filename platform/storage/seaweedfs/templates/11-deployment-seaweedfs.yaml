apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: 'seaweedfs'
  labels:
    app.kubernetes.io/name: seaweedfs
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: >-
      TODO(lint), see docs/todo.md "Fix linting issues": map seaweedfs write paths outside /data,
      then mount emptyDirs.
    ignore-check.kube-linter.io/run-as-non-root: >-
      TODO(lint), see docs/todo.md "Fix linting issues": storage backend runs as root over
      root-owned data; migrate ownership first.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      initContainers:
      - name: config-builder
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          ROOT_USER=$(cat /secrets/root-creds/username)
          ROOT_PASS=$(cat /secrets/root-creds/password)
          DB_PASS=$(cat /secrets/db-password/db_password)
          cat > /shared/s3.json << EOF
          {
            "identities": [
              {
                "name": "$ROOT_USER",
                "credentials": [
                  {
                    "accessKey": "$ROOT_USER",
                    "secretKey": "$ROOT_PASS"
                  }
                ],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              }
            ]
          }
          EOF
          cat /etc/filer-config/filer.toml > /shared/filer.toml
          cat >> /shared/filer.toml << EOF
          [postgres2]
          enabled = true
          hostname = "main-db-rw.database.svc.cluster.local"
          port = 5432
          username = "seaweedfs_user"
          password = "$DB_PASS"
          database = "seaweedfs_filer"
          sslmode = "disable"
          connection_max_idle = 5
          connection_max_open = 10
          connection_max_lifetime_seconds = 0
          createTable = 'CREATE TABLE IF NOT EXISTS "%s" (dirhash BIGINT NOT NULL, name VARCHAR(65535) NOT NULL, directory TEXT NOT NULL, meta BYTEA, PRIMARY KEY (dirhash, name))'
          EOF
        # Only reads secret files (default mode 0644) and writes to the
        # /shared emptyDir, so it needs neither root nor a writable root fs.
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config-builder-tmp
          mountPath: /tmp
        - name: root-creds
          mountPath: /secrets/root-creds
          readOnly: true
        - name: db-password
          mountPath: /secrets/db-password
        - name: filer-config
          mountPath: /etc/filer-config
          readOnly: true
        - name: config-data
          mountPath: /shared
      containers:
      - name: seaweedfs
        image: 'chrislusf/seaweedfs:4.32_full'
        command:
        - weed
        # Before the subcommand (glog flags are global): log to stderr, which
        # Alloy ships to Loki, instead of growing /tmp/weed.* in the container
        # layer (226 MB in 3 days before the 2026-10 fixes).
        - -logtostderr
        - server
        - -filer
        - -s3
        - -master.port=9333
        - -volume.port=8080
        - -filer.port=8888
        - -s3.port=8333
        - -dir=/data
        - -volume.max=100
        # 1 GiB volumes (default 30 GiB): the CSI driver gives every PVC its
        # own collection, so volume slots, not bytes, run out first.
        - -master.volumeSizeLimitMB=1024
        - -s3.config=/etc/seaweedfs/s3.json
        ports:
        - containerPort: 9333
          name: master
        - containerPort: 8080
          name: volume
        - containerPort: 8888
          name: filer
        - containerPort: 8333
          name: s3
        - containerPort: 18888
          name: filer-grpc
        env:
        # Never set a bare WEED_MASTER (or WEED_FILER, ...): weed reads config
        # through viper with WEED_* env vars, and a parent-key var shadows every
        # nested key under it. WEED_MASTER zeroed master.volume_growth.copy_1,
        # so no volume was ever created (2026-10-09 RCA). Full-key vars are fine.
        # Grow one volume per collection at a time (default 7 per PVC collection).
        - name: WEED_MASTER_VOLUME_GROWTH_COPY_1
          value: "1"
        - name: S3_CONFIG_FILE
          value: /etc/seaweedfs/s3.json
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config-data
          mountPath: /etc/seaweedfs/filer.toml
          subPath: filer.toml
        - name: config-data
          mountPath: /etc/seaweedfs/s3.json
          subPath: s3.json
        livenessProbe:
          httpGet:
            path: /cluster/status
            port: 9333
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /cluster/status
            port: 9333
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 4Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-data
      - name: config-data
        emptyDir: {}
      - name: config-builder-tmp
        emptyDir:
          sizeLimit: 16Mi
      - name: filer-config
        configMap:
          name: seaweedfs-filer-config
      - name: root-creds
        secret:
          secretName: seaweedfs-root-creds
      - name: db-password
        secret:
          secretName: seaweedfs-db-password

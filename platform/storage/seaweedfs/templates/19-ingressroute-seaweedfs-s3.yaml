apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seaweedfs-s3
  namespace: 'seaweedfs'
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`s3.{{ .Values.domain }}`)
    middlewares:
    - name: s3-add-trailing-slash
    services:
    - name: seaweedfs-s3
      port: '8333'
  tls:
    secretName: wildcard-{{ .Values.domain | replace "." "-" }}-tls

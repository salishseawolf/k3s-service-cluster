apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-internal
  namespace: 'seaweedfs'
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  type: ClusterIP
  ports:
  - port: 9333
    targetPort: 9333
    name: master
  - port: 8080
    targetPort: 8080
    name: volume
  - port: 8888
    targetPort: 8888
    name: filer
  - port: 18888
    targetPort: 18888
    name: filer-grpc
  selector:
    app.kubernetes.io/name: seaweedfs

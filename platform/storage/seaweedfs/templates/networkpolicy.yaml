# NetworkPolicies for the seaweedfs namespace.
#
# Model: default-deny ingress per namespace, then explicit
# allows. Traefik runs as a hostNetwork DaemonSet, so ingress from Traefik
# arrives with a NODE ip as source — matched via ipBlock on the private net
# (192.168.0.0/16), not a podSelector. Kubelet probe traffic on some CNIs is
# sourced from the cni0 bridge IP (pod CIDR); K3s' embedded policy controller
# permits host-local probe traffic, but VERIFY on a canary namespace first
# before rolling this out cluster-wide.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: "seaweedfs"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: "seaweedfs"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# nodes: Traefik (filer UI) + CSI FUSE mounts from host network; gatus: health checks.
# TODO: 10.42.0.0/16 admits every pod; narrow to seaweedfs-csi + nodes (docs/todo.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-seaweedfs-clients
  namespace: "seaweedfs"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 192.168.0.0/16
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs-csi

# NetworkPolicies for the seaweedfs namespace.
#
# Model: default-deny ingress per namespace, then explicit
# allows. Traefik runs as a hostNetwork DaemonSet, so ingress from Traefik
# arrives with a NODE ip as source — matched via ipBlock on the private net
# (192.168.0.0/16), not a podSelector. Kubelet probe traffic on some CNIs is
# sourced from the cni0 bridge IP (pod CIDR); K3s' embedded policy controller
# permits host-local probe traffic, but VERIFY on a canary namespace first
# before rolling this out cluster-wide.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: "seaweedfs"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: "seaweedfs"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Clients of weed server, by namespace and port (measured 2026-10-10 from the
# pod's connection table plus config): the CSI driver (mount pods, node plugin,
# controller) needs master/filer/volume; Gatus TCP-checks four ports;
# Prometheus scrapes metrics. Same-namespace traffic (the Authentik outpost in
# front of the filer UI) is allowed above. Kubelet probes are host-local and
# admitted by K3s' policy controller. Anything else in the pod network could
# previously read every app's data through the filer; it no longer can.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-seaweedfs-clients
  namespace: "seaweedfs"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs-csi
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
      ports:
        - {protocol: TCP, port: 8333}
        - {protocol: TCP, port: 9333}
        - {protocol: TCP, port: 8888}
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 9327}
---
# Traefik (hostNetwork) needs two things here: the Authentik outpost (the
# forward-auth check for filer-s3) and then the filer itself, because the
# seaweedfs-filer IngressRoute proxies straight to seaweedfs-internal:8888
# after auth passes. Sources are node addresses only (values.traefikSources):
# admitting the whole pod range would reopen the filer to every pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-outpost
  namespace: "seaweedfs"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.traefikSources }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 9443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-filer
  namespace: "seaweedfs"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.traefikSources }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 8888}

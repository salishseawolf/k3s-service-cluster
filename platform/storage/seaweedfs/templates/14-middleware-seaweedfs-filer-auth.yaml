apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: seaweedfs-filer-auth
  namespace: 'seaweedfs'
spec:
  forwardAuth:
    address: http://seaweedfs-filer-outpost.seaweedfs.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
    - X-authentik-username
    - Authorization
    - X-authentik-groups
    - X-authentik-email
    - X-authentik-name
    - X-authentik-uid
    - X-authentik-jwt
    - X-authentik-meta-outpost
    - X-authentik-meta-provider
    - X-authentik-meta-app
    - X-authentik-meta-version

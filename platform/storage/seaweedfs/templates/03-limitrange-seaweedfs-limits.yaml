apiVersion: v1
kind: LimitRange
metadata:
  name: seaweedfs-limits
  namespace: 'seaweedfs'
spec:
  limits:
  - type: Container
    default:
      cpu: 2000m
      memory: 2Gi
    defaultRequest:
      cpu: 1000m
      memory: 1Gi
    min:
      cpu: 100m
      memory: 256Mi
    max:
      cpu: 4000m
      memory: 4Gi

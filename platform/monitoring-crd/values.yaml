---
# CRD-only install for the monitoring stack
# Values are at top level — this chart is used as a direct chart source,
# not as a Helm dependency.

prometheusOperator:
  createCustomResource: true
  enabled: false
  admissionWebhooks:
    enabled: false

# Disable all sub-chart deployments (only CRDs are wanted from this app)
grafana:
  enabled: false

kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

prometheus:
  enabled: false

alertmanager:
  enabled: false

# The chart renders these even with Prometheus disabled. Prometheus selects
# every ServiceMonitor, so they duplicated the monitoring app's kubelet,
# apiserver and coredns scrapes (cAdvisor out-of-order samples, 2026-10-15).
# The monitoring app owns all of them.
kubernetesServiceMonitors:
  enabled: false

defaultRules:
  create: false

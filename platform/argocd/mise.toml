[env]
ANSIBLE_CONFIG = "{{ config_root }}/ansible/ansible.cfg"

[tasks.init]
description = "Install Ansible Galaxy collections"
run = "ansible-galaxy collection install -r {{ config_root }}/ansible/requirements.yml"

[tasks.apply]
description = "Bootstrap Argo CD + root ApplicationSet"
run = "mise run init && op run -- ansible-playbook {{ config_root }}/ansible/playbooks/deploy.yml"

[tasks.check]
description = "Lint Ansible playbooks"
run = "ansible-lint {{ config_root }}/ansible/"

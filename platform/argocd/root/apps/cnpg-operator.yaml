1|apiVersion: argoproj.io/v1alpha1
2|kind: Application
3|metadata:
4|  name: cnpg-operator
5|  namespace: cnpg-system
6|  annotations:
7|    argocd.argoproj.io/sync-wave: "0"
8|spec:
9|  project: platform
10|  sources:
11|    - repoURL: https://cloudnative-pg.github.io/charts
12|      chart: cloudnative-pg
13|      targetRevision: "0.27.0"
14|      helm:
15|        valuesObject:
16|          config:
17|            create: true
18|  destination:
19|    server: https://kubernetes.default.svc
20|    namespace: cnpg-system
21|  syncPolicy:
22|    automated:
23|      prune: true
24|      selfHeal: true
25|    syncOptions:
26|      - CreateNamespace=false
27|      - ServerSideApply=true
28|    retry:
29|      limit: 5
30|      backoff: {duration: 20s, factor: 2, maxDuration: 5m}

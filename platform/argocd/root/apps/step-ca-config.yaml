---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step-ca-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  # One source: values by relative path in the same repo. A second source of
  # the same repo as $values made Argo fail syncs ("cannot reference a
  # different revision of the same repository") whenever a push landed mid-sync.
  source:
    repoURL: https://github.com/salishseawolf/k3s-service-cluster.git
    targetRevision: main
    path: platform/step-ca/config
    helm:
      valueFiles:
        - ../../argocd/root/cluster-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: step-ca
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}

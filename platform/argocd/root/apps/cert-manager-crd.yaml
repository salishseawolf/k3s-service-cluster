apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/CHANGEME/k3s-service-cluster.git
      targetRevision: main
      path: platform/cert-manager/crd
      helm:
        valueFiles:
          - $values/platform/argocd/root/cluster-values.yaml
    - repoURL: https://github.com/CHANGEME/k3s-service-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}

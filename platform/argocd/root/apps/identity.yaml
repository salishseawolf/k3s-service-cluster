1|apiVersion: argoproj.io/v1alpha1
2|kind: Application
3|metadata:
4|  name: identity
5|  namespace: identity
6|  annotations:
7|    argocd.argoproj.io/sync-wave: "20"
8|spec:
9|  project: platform
10|  sources:
11|    - repoURL: https://github.com/salishseawolf/k3s-service-cluster.git
12|      targetRevision: main
13|      path: services/identity/app
14|      helm:
15|        valueFiles:
16|          - $values/platform/argocd/root/cluster-values.yaml
17|    - repoURL: https://github.com/salishseawolf/k3s-service-cluster.git
18|      targetRevision: main
19|      ref: values
20|  destination:
21|    server: https://kubernetes.default.svc
22|    namespace: identity
23|  syncPolicy:
24|    automated:
25|      prune: true
26|      selfHeal: true
27|    syncOptions:
28|      - CreateNamespace=false
29|      - ServerSideApply=true
30|    retry:
31|      limit: 5
32|      backoff: {duration: 20s, factor: 2, maxDuration: 5m}

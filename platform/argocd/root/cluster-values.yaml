# ─── THE single domain-bearing file ──────────────────────────────────────
# Every Application pulls this via a multi-source $values ref. Rebrand or
# domain cutover = a one-file PR. Nothing else in the repo names the domain.
domain: "salishseawolf.com"

# gitea oauth registration lives here (not in services/gitea/app/values.yaml)
# because autoDiscoverUrl is domain-dependent and Helm values files cannot
# template themselves.
gitea:
  gitea:
    oauth:
      - name: authentik
        provider: openidConnect
        # key/secret come from extraEnv GITEA_OAUTH_KEY_0 / GITEA_OAUTH_SECRET_0
        scopes: "openid profile email"
        groupClaimName: groups
        adminGroup: infrastructure
        autoDiscoverUrl: "https://auth.salishseawolf.com/application/o/gitea/.well-known/openid-configuration"

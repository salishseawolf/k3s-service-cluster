argo-cd:
  # Injected by root ApplicationSet from cluster-values.yaml
  domain: ""
  # Argo CD Helm values — sized for a 3-node cx33 cluster, restricted PSA.
  global:
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

  configs:
    cm:
      create: false
    params:
      # TLS terminates at Traefik; Argo serves plain HTTP behind it.
      server.insecure: true
    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, infrastructure, role:admin

  dex:
    # Authentik is the IdP; dex is redundant here.
    enabled: false

  notifications:
    enabled: false

  applicationSet:
    enabled: true

  server:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    ingress:
      enabled: false

  repoServer:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  controller:
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 768Mi

  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

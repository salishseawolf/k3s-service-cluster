---
argo-cd:
  # Injected by root ApplicationSet from cluster-values.yaml
  domain: ""
  # Argo CD Helm values — sized for a 3-node cx33 cluster, restricted PSA.
  global:
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

  configs:
    cm:
      create: true
      # -- Argo CD external URL (the URL users visit in the browser)
      url: "https://argocd.salishseawolf.com"
      admin.enabled: "true"
      oidc.config: |
        name: Authentik
        issuer: https://auth.salishseawolf.com/application/o/argocd/
        clientID: $argocd-oidc:oidc_client
        clientSecret: $argocd-oidc:password
        requestedScopes: ["openid", "profile", "email"]
        requestedIDTokenClaims: {"groups": {"essential": true}}
        logoutURL: https://auth.salishseawolf.com/application/o/argocd/end-session/
    params:
      # TLS terminates at Traefik; Argo serves plain HTTP behind it.
      server.insecure: true
    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, infrastructure, role:admin

  dex:
    # Authentik is the IdP; dex is redundant here.
    enabled: false

  notifications:
    enabled: false

  applicationSet:
    enabled: true

  server:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    ingress:
      enabled: false

  repoServer:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  controller:
    # 768Mi limit was OOMKilled 18x in a day (2026-10-09), peaking at ~757Mi
    # while server-side-applying the monitoring CRDs.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi

  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

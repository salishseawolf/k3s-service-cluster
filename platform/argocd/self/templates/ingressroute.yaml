---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    # /api without forward-auth, for token clients (`argocd login
    # --auth-token`, CLI, automation): direct OIDC doesn't support
    # `argocd login --sso` (docs/ARGOCD-AUTHENTIK-SSO.md), and forward-auth's
    # cookie flow would break them. Admin ranges only: ClientIP sees the real
    # client because the LB sends PROXY protocol on 443. Argo CD still
    # enforces its own auth on every API call.
    - kind: Rule
      match: >-
        Host(`argocd.{{ .Values.domain }}`) && PathPrefix(`/api`) &&
        ClientIP({{ range $i, $r := .Values.adminSourceRanges }}{{ if $i }}, {{ end }}`{{ $r }}`{{ end }})
      priority: 200
      services:
        - name: argocd-server
          port: 80
    # Everything else, including /api from anywhere else (the UI's own API
    # calls carry the forward-auth cookie): Authentik forward-auth first.
    - kind: Rule
      match: "Host(`argocd.{{ .Values.domain }}`)"
      priority: 100
      middlewares:
        - name: authentik-forward-auth
          namespace: identity
      services:
        - name: argocd-server
          port: 80
  tls: {}

# step-ca secrets are created by bootstrap secret_zero, NOT rendered here:
# two of them are TYPED (smallstep.com/ca-password, smallstep.com/private-keys)
# which the 1Password Operator cannot emit, and the rest carry CA key material
# that must never pass through committed values. secret_zero sources every
# field from op:// env refs ("StepCA Secrets" item). This file documents the
# contract; it renders nothing.
#
# Secrets created by secret_zero in the step-ca namespace:
#   step-ca-ca-password           (smallstep.com/ca-password:  password)
#   step-ca-provisioner-password  (Opaque:                     password)
#   step-ca-certs                 (Opaque:  root_ca.crt, intermediate_ca.crt)
#   step-ca-config                (Opaque:  ca.json, defaults.json)
#   step-ca-secrets               (smallstep.com/private-keys: intermediate_ca_key,
#                                  ssh_host_ca_key, ssh_user_ca_key)

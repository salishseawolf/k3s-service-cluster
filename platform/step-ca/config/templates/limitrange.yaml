---
# LimitRange for step-ca namespace
# Sets default resource requests/limits for containers
apiVersion: v1
kind: LimitRange
metadata:
  name: step-ca-limits
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "1Gi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      min:
        cpu: "10m"
        memory: "16Mi"
      max:
        cpu: "2000m"
        memory: "4Gi"

---
# PodDisruptionBudget for step-ca
# Prevents voluntary disruption of the step-ca deployment
# during node drains, upgrades, or maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: step-ca
  namespace: step-ca
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
spec:
  # Single replica: maxUnavailable 0 would make `kubectl drain` hang forever
  # on this node. 1 lets a deliberate drain proceed; nodes' unattended
  # reboots don't drain, so this never blocked those anyway.
  maxUnavailable: 1
  # Let a drain evict a crash-looping pod instead of waiting on it.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: step-certificates
      app.kubernetes.io/instance: step-ca

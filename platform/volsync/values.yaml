---
volsync:
  manageCRDs: true
  # The chart always creates a ServiceMonitor (whenever the CRD exists) that
  # carries no bearer token, so with auth on it got 401 and fired TargetDown
  # from 2026-08 to 2026-10-13. Metrics are per-object backup status/timings.
  metrics:
    disableAuth: true
  replicaCount: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 300m, memory: 256Mi}
  # Movers run in the PVC's namespace (baseline PSA is sufficient — restic
  # movers need root to read all files, which baseline permits, but nothing
  # privileged). No node-agent DaemonSet: movers are per-sync Jobs.

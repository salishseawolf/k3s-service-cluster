---
# kube-linter config, picked up automatically from the repo root by CI
# (.github/workflows/validate-services.yaml) and local runs.
checks:
  addAllBuiltIn: false
  exclude:
    # Service namespaces ship a LimitRange that injects default
    # requests/limits at admission, so a container without explicit
    # resources is still bounded. kube-linter only sees the rendered
    # manifests, not the LimitRange's effect, so these checks are noise here.
    # Keep that true: a new chart must set resources or ship a LimitRange
    # (redis sets explicit resources instead of shipping one).
    - unset-cpu-requirements
    - unset-memory-requirements

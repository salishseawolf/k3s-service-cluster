---
# Day-2, opt-in: apply anonymous-auth=false to an already-running cluster.
#
# bootstrap/ansible/roles/k3s_server/vars/main.yml now includes
# --kube-apiserver-arg=anonymous-auth=false in k3s_common_args, so any FRESH
# install or join already gets it. This playbook is only for a cluster that
# was bootstrapped before that change and needs it applied without a full
# reinstall — k3s reads /etc/rancher/k3s/config.yaml on every start and
# accumulates repeatable args (like kube-apiserver-arg) with whatever was
# passed at install time, so this doesn't need to touch the original
# systemd unit.
#
# Run: mise run //bootstrap/ansible:harden-apiserver
#
# serial: 1 — restarts one control-plane node's k3s at a time and waits for
# it to rejoin healthy before moving on, so embedded-etcd quorum (2-of-3)
# is never at risk.

- name: Apply kube-apiserver anonymous-auth=false to running nodes
  hosts: k3s_nodes
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Ensure /etc/rancher/k3s exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Write k3s config.yaml overlay for day-2 apiserver args
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
        content: |
          kube-apiserver-arg:
            - "anonymous-auth=false"
      register: k3s_config_overlay

    - name: Restart k3s to apply new apiserver args
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: k3s_config_overlay is changed

    # NOT a plain unauthenticated GET to /livez — anonymous-auth=false makes
    # the apiserver reject unauthenticated requests outright (401), even to
    # /livez, so that would fail regardless of whether the node is healthy.
    # `k3s kubectl` uses this node's own admin kubeconfig (client-cert auth,
    # unaffected by anonymous-auth), matching the pattern already used in
    # roles/k3s_server/tasks/init.yml and join.yml.
    #
    # Deliberately NOT gated behind `k3s_config_overlay is changed`: this is
    # the safety gate before serial:1 moves to the next node, so it must run
    # (and actually prove Ready) even on a re-run where this node's overlay
    # is already in place and reports no change.
    - name: Wait for node to report Ready again
      ansible.builtin.command: >-
        k3s kubectl wait --for=condition=Ready
        node/{{ inventory_hostname }} --timeout=180s
      changed_when: false
      retries: 5
      delay: 10
      register: node_ready_again
      until: node_ready_again is success

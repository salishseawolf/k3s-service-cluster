---
argocd_namespace: argocd
argocd_chart_repo: "https://argoproj.github.io/argo-helm"
# Bootstrap installs this version to get the reconciler breathing; the
# platform/argocd/self app then converges to the version pinned in git.
argocd_chart_version: "7.7.11"

# Argo pulls from the GitHub push-mirror, NOT in-cluster Gitea: that break in
# the circular dependency is what lets Gitea be an ordinary GitOps app and
# lets a dead cluster rebuild without its own Gitea existing first.
argocd_repo_url: "{{ lookup('env', 'ARGOCD_REPO_URL') }}"
argocd_repo_creds_ref: "vaults/K3s Service Cluster/items/ArgoCD Repo Credentials"

---
# Fetch kubeconfig from K3s cluster and save locally
# The kubeconfig targets api.<domain> (one A record per node, see
# infrastructure/tofu/cloudflare.tf), so the API is reached directly under the
# Hetzner firewall instead of through the LB. tls-server-name: the serving
# cert has no SAN for api.<domain> (K3s fixes --tls-san at install), so
# verify against its built-in "kubernetes" SAN instead.
# Required variables:
#   - domain: cluster domain (group_vars, from TF_VAR_domain)
# Optional:
#   - kubeconfig_local_path: Where to save kubeconfig
#     Defaults to KUBECONFIG env var or ./kubeconfig in working directory

- name: Set kubeconfig path default
  ansible.builtin.set_fact:
    kubeconfig_local_path: >-
      {{ kubeconfig_local_path |
         default(lookup('env', 'KUBECONFIG') |
         default(playbook_dir + '/../../kubeconfig', true)) }}

- name: Fetch kubeconfig from node
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: kubeconfig_content
  no_log: true

- name: Save kubeconfig locally
  vars:
    kubeconfig_raw: "{{ kubeconfig_content.content | b64decode }}"
    kubeconfig_updated: >-
      {{ kubeconfig_raw | regex_replace(
        '(?m)^(\s*)server: https://127\.0\.0\.1:6443$',
        '\1server: https://api.' + domain + ':6443\n\1tls-server-name: kubernetes'
      ) }}
  ansible.builtin.copy:
    content: "{{ kubeconfig_updated }}"
    dest: "{{ kubeconfig_local_path }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true

- name: Show cluster status
  ansible.builtin.command: k3s kubectl get nodes -o wide
  register: cluster_nodes
  changed_when: false

- name: Display nodes
  ansible.builtin.debug:
    msg: "{{ cluster_nodes.stdout_lines }}"

---
# Injected by the root ApplicationSet as a Helm parameter (single source of
# truth for the cluster domain lives in platform/argocd).
domain: ""

secrets:
  # One 1P item, projected by templates/onepassworditems.yaml. Keys:
  # app-secret, admin-password, mailer-url, mariadb-password,
  # mariadb-root-password. mariadb-password must be alphanumeric: it is
  # spliced into DATABASE_URL unescaped.
  name: kimai-secrets
  itemPath: "vaults/K3s Service Cluster/items/Kimai Secrets"
  # Same 1P item services/identity uses to build Authentik's signing key
  # pair; only its public `certificate` field is read here.
  saml:
    name: kimai-saml-signing
    itemPath: "vaults/K3s Service Cluster/items/Kimai SAML Signing"

kimai:
  image:
    repository: docker.io/kimai/kimai2
    tag: "2.69.0"
  port: 8001
  # Superadmin login; created on first start (password: admin-password).
  adminEmail: admin@salishseawolf.com
  # Must be on a Resend-verified domain (salishseawolf.com), or Resend rejects it.
  mailerFrom: kimai@salishseawolf.com
  # Traefik (hostNetwork, node IPs) terminates TLS. Trusting it makes Symfony
  # honor X-Forwarded-Proto, so Kimai sees https and SAML's strict
  # destination check on /auth/saml/acs passes.
  trustedProxies: "127.0.0.1,10.42.0.0/16,192.168.0.0/16"
  # Per PHP process (the image's intended value; cache warmup needs well over
  # the 128M default). The container limit leaves headroom above it for
  # Apache workers serving requests alongside.
  phpMemoryLimit: 512M
  storage:
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# The shared MariaDB in the database namespace (services/mariadb/app). Its
# image tag lives there, so serverVersion is pinned here: Doctrine only uses
# it to pick the SQL platform; bump it with a major MariaDB upgrade.
database:
  host: mariadb.database.svc.cluster.local
  serverVersion: "13.0.2"

mariadb:
  # Official image: Renovate tracks it, and DATABASE_URL's serverVersion is
  # derived from this tag, so a bump needs no other edit.
  image:
    repository: docker.io/library/mariadb
    tag: "13.0.2"
  database: kimai
  user: kimai
  storage:
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Hourly logical dump into the kimai-db-dump PVC (VolSync uploads it at
  # :45). Same image as the server, so client and server versions match.
  dump:
    schedule: "15 * * * *"
    storage:
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kimai
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # Authentik forward-auth first, then Kimai's SAML login. Both
      # applications admit only the 'internal' group (blueprint-kimai.yaml,
      # blueprint-forward-auth-apps.yaml); the shared Authentik session makes
      # the second login automatic. The SAML ACS POST from auth.<domain> still
      # carries the forward-auth cookie: same site, so SameSite=Lax allows it.
      match: "Host(`kimai.{{ .Values.domain }}`)"
      middlewares:
        - name: authentik-forward-auth
          namespace: identity
      services:
        - kind: Service
          name: kimai
          port: 80
  tls: {}

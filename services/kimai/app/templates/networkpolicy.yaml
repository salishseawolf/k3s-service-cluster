# Same model as the other services: default-deny ingress; Traefik arrives with
# a node IP (hostNetwork), matched via ipBlock.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kimai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: kimai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-traefik
  namespace: kimai
spec:
  # Kimai's pod, from Traefik's node addresses only (values.traefikSources,
  # not the whole pod CIDR, so no pod can skip forward-auth) and gatus, which
  # checks the Service directly. Its database is the shared MariaDB in the
  # database namespace.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kimai
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.traefikSources }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
      ports:
        - protocol: TCP
          port: {{ .Values.kimai.port }}

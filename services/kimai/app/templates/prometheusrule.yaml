# Backup alerts for kimai, emailed via Alertmanager. `release: monitoring` is
# what Prometheus' ruleSelector matches (any namespace); `notify: email` is
# what routes an alert to the email receiver in services/monitoring (all
# other alerts go to the null receiver).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kimai-backups
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai
    release: monitoring
spec:
  groups:
    - name: kimai-backups
      rules:
        # A dump Job failed after the last success. Resolves on the next
        # successful run, although the failed Job stays in the CronJob history.
        - alert: KimaiDbDumpFailed
          expr: |
            max by (namespace) (
              kube_job_status_start_time{namespace="kimai", job_name=~"kimai-mariadb-dump-.*"}
              * on (namespace, job_name) group_left ()
              (kube_job_failed{namespace="kimai", job_name=~"kimai-mariadb-dump-.*", condition="true"} == 1)
            )
            > on (namespace)
            max by (namespace) (kube_cronjob_status_last_successful_time{namespace="kimai", cronjob="kimai-mariadb-dump"})
          for: 1m
          labels:
            severity: warning
            notify: email
          annotations:
            summary: Kimai database dump failed
            description: >-
              The hourly kimai-mariadb-dump Job failed. The previous dump is
              kept. Check: kubectl -n kimai get jobs; kubectl -n kimai logs job/<name>
        # Catches what a failure alert cannot: suspended CronJob, PSA-rejected
        # pods, a broken schedule, or no jobs running at all.
        - alert: KimaiDbDumpStale
          expr: |
            time() - max by (namespace) (kube_cronjob_status_last_successful_time{namespace="kimai", cronjob="kimai-mariadb-dump"}) > 3 * 3600
          for: 10m
          labels:
            severity: warning
            notify: email
          annotations:
            summary: No successful Kimai database dump in 3 hours
            description: >-
              kimai-mariadb-dump runs hourly but has not succeeded for over
              3 hours. Check: kubectl -n kimai get cronjob kimai-mariadb-dump; kubectl -n kimai get events
        # Before the first success the rules above have nothing to compare to.
        - alert: KimaiDbDumpNeverSucceeded
          expr: |
            absent(kube_cronjob_status_last_successful_time{namespace="kimai", cronjob="kimai-mariadb-dump"})
          for: 2h
          labels:
            severity: warning
            notify: email
          annotations:
            summary: Kimai database dump has never succeeded
            description: >-
              No successful kimai-mariadb-dump run has been recorded for 2
              hours (or kube-state-metrics is not reporting it).
        # A dump (or file backup) that never reaches B2 is no backup.
        - alert: KimaiBackupNotUploaded
          expr: |
            max by (obj_namespace, obj_name) (volsync_volume_out_of_sync{obj_namespace="kimai", obj_name=~"kimai-data|kimai-db-dump"}) == 1
          for: 2h
          labels:
            severity: warning
            notify: email
          annotations:
            summary: "Kimai backup {{`{{ $labels.obj_name }}`}} not uploaded to B2"
            description: >-
              VolSync reports ReplicationSource {{`{{ $labels.obj_name }}`}}
              out of sync for 2 hours. Check: kubectl -n kimai get
              replicationsource {{`{{ $labels.obj_name }}`}} -o yaml (status.latestMoverStatus)

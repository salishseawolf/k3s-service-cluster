apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimai-data
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-storage
  resources:
    requests:
      storage: {{ .Values.kimai.storage.size }}

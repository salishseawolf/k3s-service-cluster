apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimai-data
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-storage
  resources:
    requests:
      storage: {{ .Values.kimai.storage.size }}
---
# Standalone PVC (not volumeClaimTemplates): Argo tracks it like every other
# PVC in the repo, and it stays editable (StatefulSet templates are immutable).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimai-mariadb-data
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai-mariadb
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-storage
  resources:
    requests:
      storage: {{ .Values.mariadb.storage.size }}
---
# Latest logical dump only (templates/mariadb-dump-cronjob.yaml); history lives
# in restic via VolSync (templates/volsync.yaml), so this PVC itself is
# disposable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimai-db-dump
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai-mariadb-dump
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-storage
  resources:
    requests:
      storage: {{ .Values.mariadb.dump.storage.size }}

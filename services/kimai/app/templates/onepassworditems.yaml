{{- range $s := list .Values.secrets .Values.secrets.saml }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $s.name }}
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai
  annotations:
    # Secret exists before the workloads that read it.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  itemPath: "{{ $s.itemPath }}"
{{- end }}

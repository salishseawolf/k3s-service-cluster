# Hourly logical dump of the kimai database into the kimai-db-dump PVC.
# --single-transaction gives a consistent InnoDB snapshot without locks (a
# live copy of the data dir would only be crash-consistent). Only the latest
# dump is kept; VolSync (templates/volsync.yaml) keeps the history in restic.
# --skip-dump-date makes an unchanged database produce an identical file, so
# restic stores idle hours for free. Failures alert by email via
# templates/prometheusrule.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kimai-mariadb-dump
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai-mariadb-dump
spec:
  schedule: {{ .Values.mariadb.dump.schedule | quote }}
  concurrencyPolicy: Forbid
  # A run that cannot start within 30 min is skipped, not stacked.
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kimai-mariadb-dump
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -ec
                - |
                  out=/dumps/kimai.sql
                  tmp=/dumps/.kimai.sql.tmp
                  # K3s' policy controller admits a new pod's IP to the
                  # NetworkPolicy allow-sets a few seconds after it starts;
                  # until then default-deny drops its traffic. Wait (up to
                  # 60s) instead of failing on the first connect.
                  for i in $(seq 1 30); do
                    if mariadb-admin ping --host=kimai-mariadb --user={{ .Values.mariadb.user }} \
                         --connect-timeout=2 --silent; then
                      echo "mariadb reachable after attempt $i"; break
                    fi
                    sleep 2
                  done
                  mariadb-dump --host=kimai-mariadb --user={{ .Values.mariadb.user }} \
                    --single-transaction --skip-dump-date --hex-blob \
                    {{ .Values.mariadb.database }} > "$tmp"
                  # a truncated dump lacks the trailer: fail and keep the previous one
                  tail -n1 "$tmp" | grep -q 'Dump completed'
                  mv "$tmp" "$out"
                  echo "dump ok: $(wc -c < "$out") bytes"
              env:
                # read by the MariaDB client; keeps the password off the command line
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.name }}
                      key: mariadb-password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                {{- toYaml .Values.mariadb.dump.resources | nindent 16 }}
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: kimai-db-dump
            - name: tmp
              emptyDir: {}

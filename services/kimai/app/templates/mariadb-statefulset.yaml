apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kimai-mariadb
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai-mariadb
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: >-
      TODO(lint): mariadbd writes temp files under /tmp; map it to an emptyDir
      after a podman --read-only test.
spec:
  serviceName: kimai-mariadb
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kimai-mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kimai-mariadb
    spec:
      automountServiceAccountToken: false
      # Official image, run directly as its mysql user (999) instead of
      # starting as root and dropping via gosu; the entrypoint skips the
      # chown/gosu steps when it is already non-root.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: mysql
              containerPort: 3306
          # Read only on first start (empty data dir); later changes in 1P do
          # not alter the database. Rotate with ALTER USER, then restart kimai.
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: mariadb-root-password
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: mariadb-password
          # ping succeeds once the server answers, even without credentials,
          # so the probe needs no secret.
          readinessProbe:
            exec:
              command:
                - mariadb-admin
                - ping
                - --host=127.0.0.1
                - --silent
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # socket + pid file; writable for uid 999 regardless of image perms
            - name: run
              mountPath: /run/mysqld
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kimai-mariadb-data
        - name: run
          emptyDir: {}

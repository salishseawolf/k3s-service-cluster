# Ad-hoc dump of Kimai's database from the shared MariaDB. Uses the pod's own
# MARIADB_ROOT_PASSWORD, so no op run (which would mask secret values, such
# as the domain, inside the dump).
[tasks.dump]
run = [
'''
umask 077
kubectl -n database exec mariadb-0 -- sh -c \
  'MYSQL_PWD=$MARIADB_ROOT_PASSWORD mariadb-dump -uroot \
    --single-transaction --hex-blob kimai' > ../../tmp/kimai-db-cluster.dump.sql
''',
]

# Inspect this service's VolSync backups in B2. kimai-db-dump is the old
# per-app dump repository (history up to 2026-10-19); new dumps are in
# "VolSync B2 mariadb-dump". Each task names its
# "VolSync B2 <repo>" 1Password item; ../../scripts/volsync-restic.sh
# resolves the credentials via op run. `mount` needs FUSE.

[tasks."backup:snapshots"]
description = "List restic snapshots for every kimai VolSync repo"
run = [
  "mise run //services/kimai:backup:data:snapshots",
  "mise run //services/kimai:backup:db-dump:snapshots",
]

[tasks."backup:data:snapshots"]
description = "List restic snapshots in kimai-data"
env = { VOLSYNC_ITEM = "VolSync B2 kimai-data" }
run = "bash ../../scripts/volsync-restic.sh snapshots"

[tasks."backup:data:ls"]
description = "List files in the latest kimai-data snapshot"
env = { VOLSYNC_ITEM = "VolSync B2 kimai-data" }
run = "bash ../../scripts/volsync-restic.sh ls latest"

[tasks."backup:data:mount"]
description = "Browse every kimai-data snapshot as files (Ctrl-C unmounts)"
env = { VOLSYNC_ITEM = "VolSync B2 kimai-data" }
run = '''
set -euo pipefail
dir=$(mktemp -d)
# rmdir, not rm -rf: never recurse into a mountpoint
trap 'rmdir -- "$dir" 2>/dev/null || true' EXIT
echo "Mounting $VOLSYNC_ITEM at $dir (Ctrl-C to unmount)"
bash ../../scripts/volsync-restic.sh mount "$dir"
'''

[tasks."backup:db-dump:snapshots"]
description = "List restic snapshots in kimai-db-dump"
env = { VOLSYNC_ITEM = "VolSync B2 kimai-db-dump" }
run = "bash ../../scripts/volsync-restic.sh snapshots"

[tasks."backup:db-dump:ls"]
description = "List files in the latest kimai-db-dump snapshot"
env = { VOLSYNC_ITEM = "VolSync B2 kimai-db-dump" }
run = "bash ../../scripts/volsync-restic.sh ls latest"

[tasks."backup:db-dump:mount"]
description = "Browse every kimai-db-dump snapshot as files (Ctrl-C unmounts)"
env = { VOLSYNC_ITEM = "VolSync B2 kimai-db-dump" }
run = '''
set -euo pipefail
dir=$(mktemp -d)
# rmdir, not rm -rf: never recurse into a mountpoint
trap 'rmdir -- "$dir" 2>/dev/null || true' EXIT
echo "Mounting $VOLSYNC_ITEM at $dir (Ctrl-C to unmount)"
bash ../../scripts/volsync-restic.sh mount "$dir"
'''

# Restic locks. A mover killed mid-run (pod deleted, node evicted) leaves its
# lock, and the next forget/prune fails with "repository is already locked".
# `unlock` removes only stale locks; `unlock --all` removes every lock, so
# first check that no volsync-src-* pod is Running for that repo.

[tasks."backup:locks"]
description = "Show restic locks in every kimai VolSync repo"
run = [
  "mise run //services/kimai:backup:data:locks",
  "mise run //services/kimai:backup:db-dump:locks",
]

[tasks."backup:data:locks"]
description = "Show restic locks in kimai-data (age, host, pid)"
env = { VOLSYNC_ITEM = "VolSync B2 kimai-data" }
run = "bash ../../scripts/volsync-locks.sh show"

[tasks."backup:data:unlock"]
description = "Remove stale restic locks in kimai-data (--all: every lock)"
env = { VOLSYNC_ITEM = "VolSync B2 kimai-data" }
usage = 'flag "--all" help="Remove every lock, not only stale ones (no mover may be running)"'
run = "bash ../../scripts/volsync-locks.sh clear ${usage_all:+--all}"

[tasks."backup:db-dump:locks"]
description = "Show restic locks in kimai-db-dump (age, host, pid)"
env = { VOLSYNC_ITEM = "VolSync B2 kimai-db-dump" }
run = "bash ../../scripts/volsync-locks.sh show"

[tasks."backup:db-dump:unlock"]
description = "Remove stale restic locks in kimai-db-dump (--all: every lock)"
env = { VOLSYNC_ITEM = "VolSync B2 kimai-db-dump" }
usage = 'flag "--all" help="Remove every lock, not only stale ones (no mover may be running)"'
run = "bash ../../scripts/volsync-locks.sh clear ${usage_all:+--all}"

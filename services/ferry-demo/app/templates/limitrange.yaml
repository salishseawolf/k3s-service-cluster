# The upstream chart sets every container's limits itself (since 0.1.23), so
# these defaults reach only pods others make here: CNPG's initdb/join jobs and
# VolSync movers. A default CPU limit below a pod's own CPU request would
# reject it at admission, hence 1 CPU rather than personal-site's 200m.
apiVersion: v1
kind: LimitRange
metadata:
  name: pod-defaults
  namespace: '{{ .Release.Namespace }}'
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi

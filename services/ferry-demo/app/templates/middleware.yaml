# Public route (no forward-auth, approved 2026-11-02), so a per-client rate
# limit. Traefik sees the real client IP (the LB sends PROXY protocol). Loose
# on purpose: one view of the map loads hundreds of terrain tiles at once,
# and the live feeds poll every 10-60 s. Tune from Traefik's 429s.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ferry-demo-rate-limit
  namespace: ferry-demo
spec:
  rateLimit:
    average: 60
    burst: 600
---
# /api/v1/stats/ only (ingressroute-stats.yaml): database queries the server
# doesn't cache (~0.1 s each with days of history, growing with it). Far more
# than the app asks for: it fetches each route's stats once when picked and
# keeps them 5 minutes.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ferry-demo-stats-rate-limit
  namespace: ferry-demo
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 30

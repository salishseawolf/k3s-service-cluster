---
# Redis deployment tasks

- name: Create Redis namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ redis_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: restricted


- name: Create OnePasswordItem for Redis credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: "{{ redis_credentials_secret_name }}"
        namespace: "{{ redis_namespace }}"
      spec:
        itemPath: "{{ redis_credentials_ref }}"

- name: Wait for Redis credentials secret to sync
  kubernetes.core.k8s_info:
    kind: Secret
    name: "{{ redis_credentials_secret_name }}"
    namespace: "{{ redis_namespace }}"
  register: redis_secret_check
  until:
    - redis_secret_check.resources | length > 0
    - redis_secret_check.resources[0].data is defined
  retries: 15
  delay: 5

- name: Deploy Redis
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis
        namespace: "{{ redis_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: redis
        template:
          metadata:
            labels:
              app: redis
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: redis
                image: "{{ redis_image }}"
                args:
                  - redis-server
                  - --requirepass
                  - "$(REDIS_PASSWORD)"
                  - --maxmemory
                  - "{{ redis_maxmemory }}"
                  - --maxmemory-policy
                  - allkeys-lru
                  - --save
                  - ""
                env:
                  - name: REDIS_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ redis_credentials_secret_name }}"
                        key: password
                ports:
                  - containerPort: "{{ redis_port }}"
                    name: redis
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                resources:
                  requests:
                    cpu: "{{ redis_cpu_request }}"
                    memory: "{{ redis_memory_request }}"
                  limits:
                    cpu: "{{ redis_cpu_limit }}"
                    memory: "{{ redis_memory_limit }}"
                readinessProbe:
                  tcpSocket:
                    port: "{{ redis_port }}"
                  initialDelaySeconds: 5
                  periodSeconds: 10
                livenessProbe:
                  tcpSocket:
                    port: "{{ redis_port }}"
                  initialDelaySeconds: 15
                  periodSeconds: 20

- name: Create Redis Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: redis
        namespace: "{{ redis_namespace }}"
      spec:
        ports:
          - port: "{{ redis_port }}"
            targetPort: "{{ redis_port }}"
            name: redis
        selector:
          app: redis

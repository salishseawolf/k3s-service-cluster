apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis
  labels: {app.kubernetes.io/name: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: "{{ .Values.image }}"
          args:
            - redis-server
            - --requirepass
            - "$(REDIS_PASSWORD)"
            - --maxmemory
            - "{{ .Values.maxmemory }}"
            - --maxmemory-policy
            - allkeys-lru
            # Cache/broker only: no volume and a read-only root, so never try to
            # snapshot. A failed save makes Redis refuse all writes (MISCONF),
            # which broke every consumer after the Redis 8 bump (2026-10-13).
            - --save
            - ""
            - --appendonly
            - "no"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: password
          ports:
            - name: redis
              containerPort: {{ .Values.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: {port: redis}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            initialDelaySeconds: 15
            periodSeconds: 20

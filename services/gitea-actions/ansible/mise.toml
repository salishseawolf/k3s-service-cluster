[env]
ANSIBLE_CONFIG = "{{ config_root }}/ansible.cfg"
# Runner registration token — generated by Gitea CLI, not stored in 1Password
# GITEA_RUNNER_TOKEN will be set dynamically by the Ansible playbook

[tasks.init]
description = "Install Ansible collection dependencies"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks.deploy]
description = "Deploy Gitea Actions runner via Ansible"
run = "mise run init && op run -- ansible-playbook playbooks/deploy.yml"

[tasks.lint]
description = "Run ansible-lint on Gitea Actions runner"
run = "ansible-lint"

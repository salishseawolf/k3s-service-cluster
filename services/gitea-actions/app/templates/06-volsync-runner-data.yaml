# VolSync restic backup of gitea-runner-data (nightly; schedules are
# staggered across services so the movers don't all hit SeaweedFS/B2 at
# midnight). Runner state is mostly cache — kept for parity with the old
# Velero coverage; drop this file if the storage cost isn't worth it.
#
# The 1P item carries the restic env verbatim (the operator cannot template,
# so the vault does): RESTIC_REPOSITORY, RESTIC_PASSWORD, AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY. Each PVC gets its OWN item/repository — restic
# repositories must never be shared between ReplicationSources.
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: volsync-b2-gitea-runner-data
  namespace: 'gitea-actions'
spec:
  itemPath: "vaults/K3s Service Cluster/items/VolSync B2 gitea-runner-data"
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: gitea-runner-data
  namespace: 'gitea-actions'
spec:
  sourcePVC: 'gitea-runner-data'
  trigger:
    schedule: "30 0 * * *"
  restic:
    repository: volsync-b2-gitea-runner-data
    # Direct: neither hcloud-csi nor seaweedfs-csi supports VolumeSnapshots,
    # so the mover mounts the live PVC (file-level crash consistency).
    copyMethod: Direct
    pruneIntervalDays: 7
    retain:
      daily: 30  # parity with Velero's 720h TTL
    # Restic cache on node-local storage: hcloud-volumes has a 10Gi minimum
    # and caching on seaweedfs-storage would make restores depend on the very
    # store being restored.
    cacheCapacity: 2Gi
    cacheStorageClassName: local-path

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: 'gitea-actions'
  labels:
    app: gitea-runner
  annotations:
    # Deliberate exceptions: Docker-in-Docker runner. The namespace's egress
    # policy (H2.2) is the containment for this, not the pod spec.
    ignore-check.kube-linter.io/privileged-container: >-
      gitea/runner:*-dind runs dockerd, which requires privileged.
    ignore-check.kube-linter.io/privilege-escalation-container: >-
      Implied by privileged (dockerd).
    ignore-check.kube-linter.io/run-as-non-root: >-
      dockerd in the dind image runs as root.
    ignore-check.kube-linter.io/no-read-only-root-fs: >-
      dockerd writes image layers and state under the container's root fs.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: runner
        image: 'gitea/runner:latest-dind'
        imagePullPolicy: Always
        securityContext:
          privileged: true
        env:
        - name: GITEA_INSTANCE_URL
          value: 'http://gitea-http.gitea:3000'
        - name: GITEA_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: 'gitea-runner-token'
              key: actions_token
        - name: GITEA_RUNNER_NAME
          value: 'gitea-runner-01'
        - name: CONFIG_FILE
          value: /data/config.yaml
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /data/config.yaml
          subPath: config.yaml
        resources:
          requests:
            cpu: '500m'
            memory: '512Mi'
          limits:
            cpu: '2000m'
            memory: '2Gi'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: 'gitea-runner-data'
      - name: config
        configMap:
          name: gitea-runner-config

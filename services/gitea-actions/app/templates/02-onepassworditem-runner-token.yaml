# Runner registration token: generate once (gitea CLI or admin UI), store in
# 1P. act_runner registration tokens are reusable; rotation = new token in 1P.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: gitea-runner-token
  namespace: gitea-actions
spec:
  itemPath: "vaults/K3s Service Cluster/items/Gitea Secrets"

[env]
# OIDC credentials for Authentik integration (shared vault)
GATUS_OIDC_CLIENT_ID = "op://K3s Service Cluster/Gatus OIDC Client Secret/client_id"
GATUS_OIDC_CLIENT_SECRET = "op://K3s Service Cluster/Gatus OIDC Client Secret/client_secret"
# PostgreSQL credentials for Gatus (shared vault)
GATUS_DB_PASSWORD = "op://K3s Service Cluster/Gatus Secrets/password"
# Teams webhook URL for alerting (shared vault)
GATUS_TEAMS_WEBHOOK = "op://K3s Service Cluster/Microsoft Teams Infrastructure Channel Webhook/url"

[tasks.deploy]
description = "Deploy Gatus status monitoring"
run = "mise run //services/gatus/ansible:deploy"

[tasks.uninstall]
description = "Uninstall Gatus service"
run = "helm uninstall gatus -n gatus"

[tasks.check]
description = "Check Gatus deployment status"
run = "kubectl get all -n gatus"

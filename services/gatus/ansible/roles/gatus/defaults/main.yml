---
gatus_namespace: "gatus"
gatus_domain: "gatus.{{ lookup('env', 'TF_VAR_domain') }}"
gatus_image: "ghcr.io/twin/gatus"

# Helm Release
gatus_chart_repo: "https://twin.github.io/helm-charts"
gatus_chart_version: "1.5.0"

# Database (shared CloudNativePG cluster)
gatus_db_host: "main-db-rw.database.svc.cluster.local"
gatus_db_name: "gatus_db"
gatus_db_user: "gatus_user"
gatus_db_port: 5432
gatus_db_sslmode: "disable"

# OIDC (Authentik)
gatus_authentik_slug: gatus-application
gatus_oidc_issuer_url: "https://auth.{{ lookup('env', 'TF_VAR_domain') }}/application/o/gatus-application/"
gatus_oidc_secret_name: "gatus-oidc"

# Database password (from 1Password)
gatus_db_password: "{{ lookup('env', 'GATUS_DB_PASSWORD') }}"

# Alerting

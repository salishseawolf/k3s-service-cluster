---
# Gatus deployment tasks
# Follows the identity/database pattern with DB provisioning, Helm, and Traefik

# ──────────────────────────────────────────────────────────────────
# 1. Database Provisioning
# ──────────────────────────────────────────────────────────────────
- name: Wait for CloudNativePG cluster to be healthy
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: main-db
    namespace: database
  register: cnpg_cluster
  until: >
    cnpg_cluster.resources | length > 0 and
    cnpg_cluster.resources[0].status is defined and
    cnpg_cluster.resources[0].status.phase is defined and
    cnpg_cluster.resources[0].status.phase == "Cluster in healthy state"
  retries: 30
  delay: 10

- name: Get Postgres Read-Write Endpoints
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Endpoints
    name: "main-db-rw"
    namespace: "database"
  register: db_rw_endpoints

- name: Fail if Read-Write Endpoint is empty
  ansible.builtin.fail:
    msg: "The main-db-rw service has no active endpoints."
  when: >
    db_rw_endpoints.resources | length == 0 or
    db_rw_endpoints.resources[0].subsets is not defined or
    db_rw_endpoints.resources[0].subsets | length == 0

- name: Set Fact for Postgres Leader Pod
  ansible.builtin.set_fact:
    gatus_db_admin_pod: "{{ db_rw_endpoints.resources[0].subsets[0].addresses[0].targetRef.name }}"

- name: Check if Gatus User Exists
  kubernetes.core.k8s_exec:
    namespace: "database"
    pod: "{{ gatus_db_admin_pod }}"
    command: psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ gatus_db_user }}'"
  register: gatus_user_check
  changed_when: false

- name: Create Gatus Database User
  kubernetes.core.k8s_exec:
    namespace: "database"
    pod: "{{ gatus_db_admin_pod }}"
    command: >-
      psql -U postgres -c
      "CREATE ROLE {{ gatus_db_user }} WITH LOGIN PASSWORD '{{ gatus_db_password | string }}';"
  no_log: true
  when: (gatus_user_check.stdout | trim) != '1'

- name: Update Gatus Database User Password
  kubernetes.core.k8s_exec:
    namespace: "database"
    pod: "{{ gatus_db_admin_pod }}"
    command: >-
      psql -U postgres -c
      "ALTER ROLE {{ gatus_db_user }} WITH LOGIN PASSWORD '{{ gatus_db_password | string }}';"
  no_log: true

- name: Check if Gatus Database Exists
  kubernetes.core.k8s_exec:
    namespace: "database"
    pod: "{{ gatus_db_admin_pod }}"
    command: psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ gatus_db_name }}'"
  register: gatus_db_check
  changed_when: false

- name: Create Gatus Database
  kubernetes.core.k8s_exec:
    namespace: "database"
    pod: "{{ gatus_db_admin_pod }}"
    command: psql -U postgres -c "CREATE DATABASE {{ gatus_db_name }} OWNER {{ gatus_db_user }};"
  when: (gatus_db_check.stdout | trim) != '1'

- name: Grant All Privileges to Gatus User
  kubernetes.core.k8s_exec:
    namespace: "database"
    pod: "{{ gatus_db_admin_pod }}"
    command: psql -U postgres -d {{ gatus_db_name }} -c "GRANT ALL ON SCHEMA public TO {{ gatus_db_user }};"
  when: (gatus_db_check.stdout | trim) != '1'

- name: Alter Schema Owner
  kubernetes.core.k8s_exec:
    namespace: "database"
    pod: "{{ gatus_db_admin_pod }}"
    command: psql -U postgres -d {{ gatus_db_name }} -c "ALTER SCHEMA public OWNER TO {{ gatus_db_user }};"
  when: (gatus_db_check.stdout | trim) != '1'

# ──────────────────────────────────────────────────────────────────
# 2. Namespace
# ──────────────────────────────────────────────────────────────────
- name: Create Gatus Namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gatus_namespace }}"
        labels:
          app.kubernetes.io/name: gatus
          app.kubernetes.io/component: monitoring
          pod-security.kubernetes.io/enforce: restricted

# ──────────────────────────────────────────────────────────────────
# 3. ResourceQuota + LimitRange
# ──────────────────────────────────────────────────────────────────
- name: Deploy Gatus ResourceQuota
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'resourcequota.yaml.j2') | from_yaml }}"

- name: Deploy Gatus LimitRange
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'limitrange.yaml.j2') | from_yaml }}"

# ──────────────────────────────────────────────────────────────────
# 4. OnePasswordItem CRs (synced by 1Password Operator)
# ──────────────────────────────────────────────────────────────────

- name: Create OnePasswordItem for Gatus DB password
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: gatus-db
        namespace: "{{ gatus_namespace }}"
        labels:
          app.kubernetes.io/name: gatus
          app.kubernetes.io/component: monitoring
      spec:
        itemPath: "vaults/K3s Service Cluster/items/Gatus Secrets"

- name: Create OnePasswordItem for Gatus Teams webhook
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: gatus-teams-webhook
        namespace: "{{ gatus_namespace }}"
        labels:
          app.kubernetes.io/name: gatus
          app.kubernetes.io/component: monitoring
      spec:
        itemPath: "vaults/K3s Service Cluster/items/Microsoft Teams Infrastructure Channel Webhook"

- name: Wait for OnePasswordItem secrets to sync
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ gatus_namespace }}"
  loop:
    - gatus-db
    - gatus-teams-webhook
  register: op_secrets
  until: op_secrets.resources | length > 0
  retries: 12
  delay: 5

# ──────────────────────────────────────────────────────────────────
# 5. Helm Deployment
# ──────────────────────────────────────────────────────────────────
- name: Append gatus blueprint to authentik-blueprints
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: authentik-blueprints
        namespace: identity
      data:
        blueprint-gatus.yaml: "{{ lookup('template', 'blueprint-gatus.yaml.j2') }}"

- name: Wait for ConfigMap propagation and apply blueprint
  ansible.builtin.shell:
    cmd: |
      for i in $(seq 1 12); do
        kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
          -n identity exec deploy/authentik-server -- sh -c "test -f /blueprints/custom/blueprint-gatus.yaml" 2>/dev/null && break
        sleep 10
      done && \
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        -n identity exec deploy/authentik-server -- ak apply_blueprint /blueprints/custom/blueprint-gatus.yaml 2>&1
  register: gatus_blueprint_apply
  changed_when: "'created' in gatus_blueprint_apply.stdout or 'patched' in gatus_blueprint_apply.stdout"

- name: Get Gatus OIDC credentials from Authentik database
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ gatus_db_admin_pod }}" -c postgres -- \
        psql -U postgres -d authentik -tAc \
        "SELECT p.client_id || '|' || p.client_secret FROM authentik_providers_oauth2_oauth2provider p JOIN authentik_core_application a ON a.provider_id = p.provider_ptr_id WHERE a.slug='{{ gatus_authentik_slug }}'"
  register: gatus_oidc_creds_result
  changed_when: false

- name: Set Gatus OIDC credential facts
  ansible.builtin.set_fact:
    gatus_oidc_client_id: "{{ gatus_oidc_creds_result.stdout | trim | split('|') | first }}"
    gatus_oidc_client_secret: "{{ gatus_oidc_creds_result.stdout | trim | split('|') | last }}"

- name: Create/update Gatus OIDC Kubernetes Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gatus_oidc_secret_name }}"
        namespace: "{{ gatus_namespace }}"
      type: Opaque
      stringData:
        client_id: "{{ gatus_oidc_client_id }}"
        client_secret: "{{ gatus_oidc_client_secret }}"
  no_log: true
- name: Add Gatus Helm Repo
  kubernetes.core.helm_repository:
    name: twin
    repo_url: "{{ gatus_chart_repo }}"

- name: Deploy Gatus
  kubernetes.core.helm:
    name: gatus
    chart_ref: twin/gatus
    chart_version: "{{ gatus_chart_version }}"
    release_namespace: "{{ gatus_namespace }}"
    create_namespace: false
    values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"

# ──────────────────────────────────────────────────────────────────
# 6. PodDisruptionBudget
# ──────────────────────────────────────────────────────────────────
- name: Deploy Gatus PDB
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: gatus
        namespace: "{{ gatus_namespace }}"
        labels:
          app.kubernetes.io/name: gatus
      spec:
        maxUnavailable: 0
        selector:
          matchLabels:
            app.kubernetes.io/name: gatus
            app.kubernetes.io/instance: gatus

# ──────────────────────────────────────────────────────────────────
# 7. Traefik IngressRoute
# ──────────────────────────────────────────────────────────────────
- name: Deploy Gatus IngressRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: gatus
        namespace: "{{ gatus_namespace }}"
        labels:
          app.kubernetes.io/name: gatus
      spec:
        entryPoints:
          - websecure
        routes:
          - kind: Rule
            match: "Host(`{{ gatus_domain }}`)"
            middlewares:
              - name: authentik-forward-auth
                namespace: identity
            services:
              - kind: Service
                name: gatus
                namespace: "{{ gatus_namespace }}"
                port: 8080
        tls:
          secretName: "wildcard-{{ lookup('env', 'TF_VAR_domain') | replace('.', '-') }}-tls"

# ──────────────────────────────────────────────────────────────────
# 8. Wait for Ready
# ──────────────────────────────────────────────────────────────────
- name: Wait for Gatus deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: gatus
    namespace: "{{ gatus_namespace }}"
    wait: true
    wait_sleep: 10
    wait_timeout: 120
    wait_condition:
      type: Available
      status: "True"

# ──────────────────────────────────────────────────────────────────
# Network policies (docs/PLAN.md H2.1)
# ──────────────────────────────────────────────────────────────────

- name: Apply network policies
  kubernetes.core.k8s:
    state: present
    template: networkpolicy.yaml.j2

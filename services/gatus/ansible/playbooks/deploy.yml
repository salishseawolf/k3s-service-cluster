---
# Deploy Gatus status monitoring
# Run with: mise run //services/gatus:deploy

- name: Deploy Gatus
  hosts: localhost
  gather_facts: false
  connection: local

  module_defaults:
    kubernetes.core.helm:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"
    kubernetes.core.k8s:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"
    kubernetes.core.helm_repository:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"
    kubernetes.core.k8s_exec:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"

  roles:
    - role: gatus
      tags: ['gatus', 'monitoring']

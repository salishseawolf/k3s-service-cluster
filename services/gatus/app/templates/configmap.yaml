apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
data:
  config.yaml: |
    storage:
      type: postgres
      path: >-
        postgres://{{ .Values.db.user }}:${DATABASE_PASSWORD}@{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.name }}?sslmode={{ .Values.db.sslmode }}
      retention: 720h

    connectivity:
      checker:
        target: "1.1.1.1:53"
        interval: 5m

    alerting:
      teams:
        webhook-url: "${GATUS_TEAMS_WEBHOOK}"

    # App-level OIDC removed: this route sits behind authentik-forward-auth,
    # so authentication happens before traffic reaches the pod.
    endpoints:
      - name: Authentik
        group: services
        url: "https://auth.{{ .Values.domain }}/-/health/live/"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2
      - name: Copyparty
        group: services
        url: "tcp://copyparty.copyparty.svc.cluster.local:3923"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: K3s API
        group: platform
        url: "tcp://kubernetes.default.svc.cluster.local:443"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: Traefik Dashboard
        group: platform
        url: "https://{{ .Values.domain }}/dashboard/"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2
      - name: Wildcard TLS Certificate Expiry
        group: platform
        url: "https://auth.{{ .Values.domain }}/"
        interval: 120s
        conditions:
          - "[CERTIFICATE_EXPIRATION] > 168h"
      - name: Step-CA Health
        group: platform
        url: "tcp://step-ca.step-ca.svc.cluster.local:443"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: CloudNativePG (Postgres)
        group: database
        url: "tcp://main-db-rw.database.svc.cluster.local:5432"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: Redis
        group: database
        url: "tcp://redis.redis.svc.cluster.local:6379"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS S3 API
        group: storage
        url: "tcp://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS Master
        group: storage
        url: "tcp://seaweedfs-internal.seaweedfs.svc.cluster.local:9333"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS Filer
        group: storage
        url: "tcp://seaweedfs-internal.seaweedfs.svc.cluster.local:8888"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS Volume
        group: storage
        url: "tcp://seaweedfs-internal.seaweedfs.svc.cluster.local:8080"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS CSI Controller
        group: storage
        url: "tcp://seaweedfs-csi-controller.seaweedfs-csi.svc.cluster.local:9808"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS Backup Freshness
        group: backups
        url: "http://seaweedfs-backup-check.seaweedfs.svc.cluster.local:8080/health"
        interval: 3600s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2
      - name: Internet Connectivity
        group: external
        url: "https://google.com"
        interval: 300s
        timeout: 30s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"
        failures: 3
        success: 2
      - name: Paperless-ngx
        group: services
        url: "https://paperless.{{ .Values.domain }}"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2
      - name: Homarr
        group: services
        url: "tcp://homarr.homarr.svc.cluster.local:7575"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: Gitea
        group: services
        url: "https://git.{{ .Values.domain }}/api/healthz"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2
      - name: Gatus (self)
        group: internal
        url: "http://gatus.gatus.svc.cluster.local:{{ .Values.port }}/health"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2

    ui:
      title: "Cluster Status — {{ .Values.domain }}"
      header: "K3s Service Cluster Health Dashboard"

    metrics: true

apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
data:
  config.yaml: |
    storage:
      type: postgres
      path: >-
        postgres://{{ .Values.db.user }}:${DATABASE_PASSWORD}@{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.name }}?sslmode={{ .Values.db.sslmode }}
      retention: 720h

    connectivity:
      checker:
        target: "1.1.1.1:53"
        interval: 5m

    alerting:
      slack:
        webhook-url: "${GATUS_SLACK_WEBHOOK}"

    # App-level OIDC removed: this route sits behind authentik-forward-auth,
    # so authentication happens before traffic reaches the pod.
    endpoints:
      - name: Authentik
        group: services
        url: "https://auth.{{ .Values.domain }}/-/health/live/"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2
      - name: Copyparty
        group: services
        url: "tcp://copyparty.copyparty.svc.cluster.local:3923"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: K3s API
        group: platform
        url: "tcp://kubernetes.default.svc.cluster.local:443"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      # Traefik's dashboard is not exposed (404 even locally), and the bare
      # domain routes to the personal site, so the old /dashboard/ check could
      # never pass and logged an nginx 404 every minute. Check that Traefik
      # accepts HTTPS on its in-cluster Service instead (the same path Gitea
      # Actions uses via the CoreDNS rewrite).
      - name: Traefik
        group: platform
        url: "tcp://traefik.kube-system.svc.cluster.local:443"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: Wildcard TLS Certificate Expiry
        group: platform
        url: "https://auth.{{ .Values.domain }}/"
        interval: 120s
        conditions:
          - "[CERTIFICATE_EXPIRATION] > 168h"
      - name: Step-CA Health
        group: platform
        url: "tcp://step-ca.step-ca.svc.cluster.local:443"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: CloudNativePG (Postgres)
        group: database
        url: "tcp://main-db-rw.database.svc.cluster.local:5432"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      # Shared MariaDB (services/mariadb/app); admits Gatus on 3306.
      - name: MariaDB
        group: database
        url: "tcp://mariadb.database.svc.cluster.local:3306"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: Redis
        group: database
        url: "tcp://redis.redis.svc.cluster.local:6379"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS S3 API
        group: storage
        url: "tcp://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS Master
        group: storage
        url: "tcp://seaweedfs-internal.seaweedfs.svc.cluster.local:9333"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS Filer
        group: storage
        url: "tcp://seaweedfs-internal.seaweedfs.svc.cluster.local:8888"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS Volume
        group: storage
        url: "tcp://seaweedfs-internal.seaweedfs.svc.cluster.local:8080"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: SeaweedFS CSI Controller
        group: storage
        url: "tcp://seaweedfs-csi-controller.seaweedfs-csi.svc.cluster.local:9808"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: VolSync Operator
        group: backups
        url: "tcp://volsync-metrics.volsync-system.svc.cluster.local:8443"
        interval: 300s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: CNPG Backup
        group: backups
        url: "tcp://main-db-rw.database.svc.cluster.local:5432"
        interval: 300s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      # Independent of Prometheus/Alertmanager: every email alert goes through
      # them, so these two alert via Gatus' own Slack notifier. Prometheus runs
      # on a capped emptyDir and restarts empty if it fills (2026-10-13).
      - name: Prometheus
        group: monitoring
        url: "http://prometheus-prometheus.monitoring.svc.cluster.local:9090/-/ready"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true
            description: "Prometheus not ready: no metrics, and no email alerts can fire"
      - name: Alertmanager
        group: monitoring
        url: "http://prometheus-alertmanager.monitoring.svc.cluster.local:9093/-/ready"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: slack
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true
            description: "Alertmanager not ready: email alerts are not being delivered"
      - name: Internet Connectivity
        group: external
        url: "https://google.com"
        interval: 300s
        timeout: 30s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"
        failures: 3
        success: 2
      # Paperless, Gitea and Kimai sit behind Authentik forward-auth, which
      # would answer a check with a login redirect. So these call the Services
      # directly (allowed by each namespace's 10.42.0.0/16 ingress rule), with
      # the public Host header the apps validate (Paperless' PAPERLESS_URL,
      # Kimai's TRUSTED_HOSTS). Traefik and TLS are covered by the other
      # https checks (Authentik, Personal Site).
      - name: Paperless-ngx
        group: services
        url: "http://paperless.paperless.svc.cluster.local/"
        headers:
          Host: "paperless.{{ .Values.domain }}"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2
      # Outline admits Gatus' namespace explicitly (not the pod CIDR).
      - name: Outline
        group: services
        url: "http://outline.outline.svc.cluster.local:3000/_health"
        headers:
          Host: "wiki.{{ .Values.domain }}"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY] == OK"
        failures: 3
        success: 2
      - name: Outline Redis
        group: database
        url: "tcp://outline-redis.outline.svc.cluster.local:6379"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: Homarr
        group: services
        url: "tcp://homarr.homarr.svc.cluster.local:7575"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"
        failures: 3
        success: 2
      - name: Gitea
        group: services
        url: "http://gitea-http.gitea.svc.cluster.local:3000/api/healthz"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2
      - name: Personal Site
        group: services
        url: "https://{{ .Values.domain }}"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2
      # The login page renders only if PHP, the cache and the MariaDB
      # connection all work (same path as the pod's own probes); "/" just
      # redirects to it.
      - name: Kimai
        group: services
        url: "http://kimai.kimai.svc.cluster.local/en/login"
        headers:
          Host: "kimai.{{ .Values.domain }}"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2
      - name: Gatus (self)
        group: internal
        url: "http://gatus.gatus.svc.cluster.local:{{ .Values.port }}/health"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        failures: 3
        success: 2

    ui:
      title: "Cluster Status — {{ .Values.domain }}"
      header: "K3s Service Cluster Health Dashboard"

    metrics: true

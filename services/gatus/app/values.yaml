# Injected by the root ApplicationSet as a Helm parameter (single source of
# truth for the cluster domain lives in platform/argocd).
domain: ""

image:
  repository: ghcr.io/twin/gatus
  tag: "v5.34.0"

port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

db:
  host: main-db-rw.database.svc.cluster.local
  port: 5432
  name: gatus_db
  user: gatus_user
  sslmode: disable

secrets:
  # Same 1Password items the bootstrap deploy used — the operator projects
  # them here; the chart only ever commits the op:// pointers.
  db:
    name: gatus-db
    itemPath: "vaults/K3s Service Cluster/items/Gatus Secrets"
  teamsWebhook:
    name: gatus-teams-webhook
    itemPath: "vaults/K3s Service Cluster/items/Microsoft Teams Infrastructure Channel Webhook"

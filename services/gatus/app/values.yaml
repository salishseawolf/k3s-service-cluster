---
# Injected by the root ApplicationSet as a Helm parameter (single source of
# truth for the cluster domain lives in platform/argocd).
domain: ""

image:
  repository: ghcr.io/twin/gatus
  tag: "v5.34.0"

port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

db:
  host: main-db-rw.database.svc.cluster.local
  port: 5432
  name: gatus_db
  user: gatus_user
  sslmode: disable

secrets:
  db:
    name: gatus-db
    itemPath: "vaults/K3s Service Cluster/items/Gatus Secrets"
  slack:
    name: gatus-slack
    itemPath: "vaults/K3s Service Cluster/items/Gatus Slack App"

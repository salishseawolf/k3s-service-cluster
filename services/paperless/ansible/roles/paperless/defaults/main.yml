---
paperless_namespace: paperless
paperless_image: ghcr.io/paperless-ngx/paperless-ngx
paperless_image_tag: latest
paperless_domain: "paperless.{{ lookup('env', 'TF_VAR_domain') }}"

# PostgreSQL
paperless_db_name: paperless
paperless_db_user: paperless_user
paperless_db_host: main-db-rw.database.svc.cluster.local
paperless_db_port: 5432

# Redis
paperless_redis_host: redis.redis.svc.cluster.local
paperless_redis_port: 6379
paperless_redis_credentials_ref: "vaults/K3s Service Cluster/items/Redis"

# Storage sizes
paperless_data_storage_size: 10Gi
paperless_media_storage_size: 10Gi
paperless_storage_class: seaweedfs-storage

# Resource limits
paperless_resources_requests_cpu: 500m
paperless_resources_requests_memory: 512Mi
paperless_resources_limits_cpu: 1000m
paperless_resources_limits_memory: 2Gi

# Kubernetes secrets
paperless_secrets_secret_name: paperless-secrets
paperless_oidc_creds_secret_name: paperless-oidc-creds

# Authentik
paperless_authentik_host: "https://auth.{{ lookup('env', 'TF_VAR_domain') }}"
paperless_authentik_slug: paperless


---
# Paperless-ngx deployment tasks

# ──────────────────────────────────────────────────────────────────
# Preflight
# ──────────────────────────────────────────────────────────────────

- name: Check SeaweedFS CSI StorageClass exists
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ paperless_storage_class }}"
  register: paperless_sc_check

- name: Fail if StorageClass not found
  ansible.builtin.fail:
    msg: "SeaweedFS CSI StorageClass '{{ paperless_storage_class }}' not found. Deploy seaweedfs-csi first."
  when: paperless_sc_check.resources | length == 0

# ──────────────────────────────────────────────────────────────────
# Namespace
# ──────────────────────────────────────────────────────────────────

- name: Create Paperless namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ paperless_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/audit: baseline
          pod-security.kubernetes.io/warn: baseline

# ──────────────────────────────────────────────────────────────────
# Database
# ──────────────────────────────────────────────────────────────────

- name: Wait for CloudNativePG cluster to be healthy
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: main-db
    namespace: database
  register: cnpg_cluster
  retries: 30
  delay: 10
  until:
    - cnpg_cluster.resources | length > 0
    - cnpg_cluster.resources[0].status.phase | default("") | lower is search("healthy")
  changed_when: false

- name: Discover Postgres Leader Pod
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: database
    label_selectors:
      - cnpg.io/cluster = main-db
      - role = primary
  register: pg_leader_result
  changed_when: false

- name: Set Fact for Postgres Leader Pod
  ansible.builtin.set_fact:
    pg_leader: "{{ pg_leader_result.resources[0].metadata.name }}"
  when: pg_leader_result.resources | length > 0

- name: Check if Paperless DB User Exists
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ pg_leader }}" -c postgres -- \
        psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ paperless_db_user }}'"
  register: paperless_db_user_check
  changed_when: false
  no_log: true

- name: Create Paperless Database User
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ pg_leader }}" -c postgres -- \
        psql -U postgres -c "CREATE USER {{ paperless_db_user }} WITH PASSWORD '{{ lookup('env', 'PAPERLESS_DB_PASSWORD') }}'"
  register: paperless_db_user_created
  changed_when: "'CREATE ROLE' in paperless_db_user_created.stdout"
  when: paperless_db_user_check.stdout | trim != '1'
  no_log: true

- name: Update Paperless Database User Password
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ pg_leader }}" -c postgres -- \
        psql -U postgres -c "ALTER USER {{ paperless_db_user }} WITH PASSWORD '{{ lookup('env', 'PAPERLESS_DB_PASSWORD') }}'"
  register: paperless_db_user_updated
  changed_when: "'ALTER ROLE' in paperless_db_user_updated.stdout"
  no_log: true

- name: Check if Paperless Database Exists
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ pg_leader }}" -c postgres -- \
        psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ paperless_db_name }}'"
  register: paperless_db_check
  changed_when: false

- name: Create Paperless Database
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ pg_leader }}" -c postgres -- \
        psql -U postgres -c "CREATE DATABASE {{ paperless_db_name }} OWNER {{ paperless_db_user }}"
  register: paperless_db_created
  changed_when: "'CREATE DATABASE' in paperless_db_created.stdout"
  when: paperless_db_check.stdout | trim != '1'

- name: Grant All Privileges to Paperless User
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ pg_leader }}" -c postgres -- \
        psql -U postgres -d {{ paperless_db_name }} -c "GRANT ALL PRIVILEGES ON DATABASE {{ paperless_db_name }} TO {{ paperless_db_user }}"
  changed_when: false
  no_log: true

- name: Alter Schema Owner
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ pg_leader }}" -c postgres -- \
        psql -U postgres -d {{ paperless_db_name }} -c "ALTER SCHEMA public OWNER TO {{ paperless_db_user }}"
  changed_when: false
  no_log: true

- name: Grant All on Schema Public
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ pg_leader }}" -c postgres -- \
        psql -U postgres -d {{ paperless_db_name }} -c "GRANT ALL ON SCHEMA public TO {{ paperless_db_user }}"
  changed_when: false
  no_log: true

# ──────────────────────────────────────────────────────────────────
# 1Password secrets
# ──────────────────────────────────────────────────────────────────

- name: Create OnePasswordItem for Paperless secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: "{{ paperless_secrets_secret_name }}"
        namespace: "{{ paperless_namespace }}"
      spec:
        itemPath: "vaults/K3s Service Cluster/items/Paperless Secrets"

- name: Create OnePasswordItem for Paperless DB password
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: "{{ paperless_secrets_secret_name }}-db"
        namespace: "{{ paperless_namespace }}"
      spec:
        itemPath: "vaults/K3s Service Cluster/items/Paperless DB Password"

- name: Create OnePasswordItem for Paperless SMTP password
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: "{{ paperless_secrets_secret_name }}-smtp"
        namespace: "{{ paperless_namespace }}"
      spec:
        itemPath: "vaults/K3s Service Cluster/items/Resend.com SMTP"

- name: Create OnePasswordItem for shared Redis credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: redis-credentials
        namespace: "{{ paperless_namespace }}"
      spec:
        itemPath: "{{ paperless_redis_credentials_ref }}"

- name: Wait for OnePasswordItem secrets to sync
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ paperless_namespace }}"
    name: "{{ item }}"
  register: _op_sync
  retries: 30
  delay: 2
  until: _op_sync.resources | length > 0 and _op_sync.resources[0].data is defined
  loop:
    - "{{ paperless_secrets_secret_name }}"
    - redis-credentials
    - "{{ paperless_secrets_secret_name }}-db"
    - "{{ paperless_secrets_secret_name }}-smtp"

# ──────────────────────────────────────────────────────────────────
# Authentik blueprint + OIDC
# ──────────────────────────────────────────────────────────────────

- name: Delete existing Paperless provider and application from Authentik
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ pg_leader }}" -c postgres -- \
        psql -U postgres -d authentik -tAc \
        "DELETE FROM authentik_core_application WHERE slug='{{ paperless_authentik_slug }}'"
  changed_when: false
  failed_when: false

- name: Append paperless blueprint to authentik-blueprints
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: authentik-blueprints
        namespace: identity
      data:
        blueprint-paperless.yaml: "{{ lookup('template', 'blueprint-paperless.yaml.j2') }}"

- name: Wait for ConfigMap propagation and apply blueprint
  ansible.builtin.shell:
    cmd: |
      for i in $(seq 1 12); do
        kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
          -n identity exec deploy/authentik-server -- sh -c "test -f /blueprints/custom/blueprint-paperless.yaml" 2>/dev/null && break
        sleep 10
      done && \
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        -n identity exec deploy/authentik-server -- ak apply_blueprint /blueprints/custom/blueprint-paperless.yaml 2>&1
  register: blueprint_apply
  changed_when: "'created' in blueprint_apply.stdout or 'patched' in blueprint_apply.stdout"

- name: Get OIDC client_id and client_secret from Authentik database
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        exec -n database "{{ pg_leader }}" -c postgres -- \
        psql -U postgres -d authentik -tAc \
        "SELECT p.client_id || '|' || p.client_secret FROM authentik_providers_oauth2_oauth2provider p JOIN authentik_core_application a ON a.provider_id = p.provider_ptr_id WHERE a.slug='{{ paperless_authentik_slug }}'"
  register: paperless_oidc_creds_result
  changed_when: false

- name: Set OIDC credential facts
  ansible.builtin.set_fact:
    paperless_oidc_client_id: "{{ paperless_oidc_creds_result.stdout | trim | split('|') | first }}"
    paperless_oidc_client_secret: "{{ paperless_oidc_creds_result.stdout | trim | split('|') | last }}"

- name: Build PAPERLESS_SOCIALACCOUNT_PROVIDERS JSON
  ansible.builtin.set_fact:
    paperless_socialaccount_providers: >-
      {{ {
        "openid_connect": {
          "APPS": [{
            "provider_id": "authentik",
            "name": "Authentik",
            "client_id": paperless_oidc_client_id,
            "secret": paperless_oidc_client_secret,
            "settings": {
              "server_url": paperless_authentik_host + "/application/o/" + paperless_authentik_slug + "/.well-known/openid-configuration",
              "fetch_userinfo": true
            }
          }],
          "SCOPE": ["openid", "profile", "email"],
          "OAUTH_PKCE_ENABLED": true
        }
      } | to_json }}

- name: Create OIDC credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ paperless_oidc_creds_secret_name }}"
        namespace: "{{ paperless_namespace }}"
      type: Opaque
      stringData:
        client_id: "{{ paperless_oidc_client_id }}"
        client_secret: "{{ paperless_oidc_client_secret }}"
        socialaccount_providers: "{{ paperless_socialaccount_providers }}"

# ──────────────────────────────────────────────────────────────────
# PVCs
# ──────────────────────────────────────────────────────────────────

- name: Create Paperless data PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: paperless-data
        namespace: "{{ paperless_namespace }}"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "{{ paperless_data_storage_size }}"
        storageClassName: "{{ paperless_storage_class }}"

- name: Create Paperless media PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: paperless-media
        namespace: "{{ paperless_namespace }}"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "{{ paperless_media_storage_size }}"
        storageClassName: "{{ paperless_storage_class }}"

# ──────────────────────────────────────────────────────────────────
# Clean up old ReplicaSets
# ──────────────────────────────────────────────────────────────────

- name: Clean up old Paperless ReplicaSets (0 replicas)
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        -n {{ paperless_namespace }} delete rs -l app=paperless \
        --field-selector status.replicas=0 --ignore-not-found=true 2>/dev/null || true
  changed_when: false
  failed_when: false

# ──────────────────────────────────────────────────────────────────
# Deployment, Service, IngressRoute (kubectl apply)
# ──────────────────────────────────────────────────────────────────

- name: Render Paperless manifest
  ansible.builtin.template:
    src: paperless-manifest.yaml.j2
    dest: /tmp/paperless-manifest.yaml
    mode: "0644"
  changed_when: false

- name: Apply Paperless manifest
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        apply -f /tmp/paperless-manifest.yaml
  register: paperless_apply
  changed_when: "'unchanged' not in paperless_apply.stdout"

# ──────────────────────────────────────────────────────────────────
# Post-deploy: Promote OIDC users to superuser
# ──────────────────────────────────────────────────────────────────

- name: Promote OIDC-authenticated infrastructure group members to superuser
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        -n {{ paperless_namespace }} exec deploy/paperless -- \
        python3 manage.py shell -c "from django.contrib.auth.models import User,Group;from allauth.socialaccount.models import SocialAccount;g=Group.objects.filter(name='infrastructure').first();[(setattr(u,'is_superuser',True),setattr(u,'is_staff',True),u.save()) for sa in SocialAccount.objects.filter(provider='authentik') for u in [sa.user] if g and g in u.groups.all() and not u.is_superuser];print('done')"
  register: paperless_promote_superuser
  changed_when: false
- name: Wait for Paperless deployment to be ready
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" \
        -n {{ paperless_namespace }} rollout status deployment/paperless --timeout=300s
  register: paperless_rollout
  changed_when: false

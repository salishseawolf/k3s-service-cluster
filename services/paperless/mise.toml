[tasks.deploy]
description = "Deploy Paperless-ngx"
run = "mise run //services/paperless/ansible:deploy"

[tasks.check]
description = "Check Paperless-ngx status"
run = "kubectl get all -n paperless"

[tasks.logs]
description = "View Paperless-ngx logs"
run = "kubectl -n paperless logs deploy/paperless"

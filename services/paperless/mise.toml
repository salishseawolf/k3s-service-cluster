# Inspect this service's VolSync backups in B2. Each task names its
# "VolSync B2 <repo>" 1Password item; ../../scripts/volsync-restic.sh
# resolves the credentials via op run. `mount` needs FUSE.

[tasks."backup:snapshots"]
description = "List restic snapshots for every paperless VolSync repo"
run = [
  "mise run //services/paperless:backup:data:snapshots",
  "mise run //services/paperless:backup:media:snapshots",
]

[tasks."backup:data:snapshots"]
description = "List restic snapshots in paperless-data"
env = { VOLSYNC_ITEM = "VolSync B2 paperless-data" }
run = "bash ../../scripts/volsync-restic.sh snapshots"

[tasks."backup:data:ls"]
description = "List files in the latest paperless-data snapshot"
env = { VOLSYNC_ITEM = "VolSync B2 paperless-data" }
run = "bash ../../scripts/volsync-restic.sh ls latest"

[tasks."backup:data:mount"]
description = "Browse every paperless-data snapshot as files (Ctrl-C unmounts)"
env = { VOLSYNC_ITEM = "VolSync B2 paperless-data" }
run = '''
set -euo pipefail
dir=$(mktemp -d)
# rmdir, not rm -rf: never recurse into a mountpoint
trap 'rmdir -- "$dir" 2>/dev/null || true' EXIT
echo "Mounting $VOLSYNC_ITEM at $dir (Ctrl-C to unmount)"
bash ../../scripts/volsync-restic.sh mount "$dir"
'''

[tasks."backup:media:snapshots"]
description = "List restic snapshots in paperless-media"
env = { VOLSYNC_ITEM = "VolSync B2 paperless-media" }
run = "bash ../../scripts/volsync-restic.sh snapshots"

[tasks."backup:media:ls"]
description = "List files in the latest paperless-media snapshot"
env = { VOLSYNC_ITEM = "VolSync B2 paperless-media" }
run = "bash ../../scripts/volsync-restic.sh ls latest"

[tasks."backup:media:mount"]
description = "Browse every paperless-media snapshot as files (Ctrl-C unmounts)"
env = { VOLSYNC_ITEM = "VolSync B2 paperless-media" }
run = '''
set -euo pipefail
dir=$(mktemp -d)
# rmdir, not rm -rf: never recurse into a mountpoint
trap 'rmdir -- "$dir" 2>/dev/null || true' EXIT
echo "Mounting $VOLSYNC_ITEM at $dir (Ctrl-C to unmount)"
bash ../../scripts/volsync-restic.sh mount "$dir"
'''

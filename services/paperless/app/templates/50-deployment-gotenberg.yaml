# Deployment for Gotenberg document converter — companion to paperless-ngx
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: paperless
  labels:
    app: gotenberg
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: >-
      TODO(lint), see docs/todo.md "Fix linting issues": test gotenberg with a read-only root plus
      an emptyDir at /tmp.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8.38
          imagePullPolicy: IfNotPresent
          command:
            - gotenberg
          args:
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 1001
          volumeMounts:
            - name: gotenberg-cache
              mountPath: /home/gotenberg
      volumes:
        - name: gotenberg-cache
          emptyDir: {}

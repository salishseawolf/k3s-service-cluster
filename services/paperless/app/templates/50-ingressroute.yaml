apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`paperless.{{ .Values.domain }}`)"
      kind: Rule
      services:
        - name: paperless
          port: 80
  tls:
    secretName: wildcard-{{ .Values.domain | replace "." "-" }}-tls

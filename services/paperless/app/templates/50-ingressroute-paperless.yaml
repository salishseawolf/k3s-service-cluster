apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  entryPoints:
    - websecure
  routes:
    # Agents: the REST API without forward-auth, but only from apiSourceRanges
    # and only with a Paperless API token, which Paperless checks along with
    # the user's permissions. Basic auth and session requests don't match and
    # fall through to forward-auth. ClientIP sees the real client because the
    # LB sends PROXY protocol on 443. HeadersRegexp is Traefik v2 syntax (K3s
    # ships 2.11); v3 renames it HeaderRegexp. An invalid rule drops this
    # router, so everything falls through to forward-auth.
    - match: >-
        Host(`paperless.{{ .Values.domain }}`) &&
        PathPrefix(`/api/`) &&
        HeadersRegexp(`Authorization`, `^Token `) &&
        ClientIP({{ range $i, $c := .Values.apiSourceRanges }}{{ if $i }}, {{ end }}`{{ $c }}`{{ end }})
      kind: Rule
      priority: 200
      services:
        - name: paperless
          port: 80
    # Authentik forward-auth first, then Paperless' own login (OIDC via the
    # same Authentik session).
    - match: "Host(`paperless.{{ .Values.domain }}`)"
      kind: Rule
      priority: 100
      middlewares:
        - name: authentik-forward-auth
          namespace: identity
      services:
        - name: paperless
          port: 80
  tls: {}

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  entryPoints:
    - websecure
  routes:
    # Authentik forward-auth first, then Paperless' own login (OIDC via the
    # same Authentik session).
    - match: "Host(`paperless.{{ .Values.domain }}`)"
      kind: Rule
      middlewares:
        - name: authentik-forward-auth
          namespace: identity
      services:
        - name: paperless
          port: 80
  tls: {}

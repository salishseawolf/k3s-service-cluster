# Creates each tenant's database and user, and a read-only `dump` user, after
# every sync. Idempotent: CREATE ... IF NOT EXISTS, then ALTER USER so the
# passwords always match 1Password (rotate in 1P, then resync).
# Passwords only travel through env and stdin, never the command line.
apiVersion: batch/v1
kind: Job
metadata:
  name: mariadb-provision
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mariadb-provision
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb-provision
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              # K3s' policy controller admits a new pod's IP a few seconds
              # after it starts; wait (up to 60s) instead of failing.
              for i in $(seq 1 30); do
                mariadb-admin ping --host=mariadb --user=root \
                  --connect-timeout=2 --silent && break
                sleep 2
              done
              check() {  # identifiers and passwords are spliced into SQL
                [[ $2 =~ ^[A-Za-z0-9_]+$ ]] || { echo "$1 is not [A-Za-z0-9_]+"; exit 1; }
              }
              sql=""
              check dump_password "$DUMP_PASSWORD"
              sql+="CREATE USER IF NOT EXISTS 'dump'@'%' IDENTIFIED BY '$DUMP_PASSWORD';"
              sql+="ALTER USER 'dump'@'%' IDENTIFIED BY '$DUMP_PASSWORD';"
              sql+="GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON *.* TO 'dump'@'%';"
              {{- range .Values.tenants }}
              check {{ .name }} {{ .name | quote }}
              pw=$TENANT_{{ .name | upper }}_PASSWORD
              check {{ .name }}_password "$pw"
              sql+="CREATE DATABASE IF NOT EXISTS \`{{ .name }}\` CHARACTER SET utf8mb4;"
              sql+="CREATE USER IF NOT EXISTS '{{ .name }}'@'%' IDENTIFIED BY '$pw';"
              sql+="ALTER USER '{{ .name }}'@'%' IDENTIFIED BY '$pw';"
              sql+="GRANT ALL PRIVILEGES ON \`{{ .name }}\`.* TO '{{ .name }}'@'%';"
              {{- end }}
              mariadb --host=mariadb --user=root <<<"$sql"
              echo "provisioned: dump{{ range .Values.tenants }} {{ .name }}{{ end }}"
          env:
            # read by the MariaDB client; keeps the password off the command line
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: root_password
            - name: DUMP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: dump_password
            {{- range .Values.tenants }}
            - name: TENANT_{{ .name | upper }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: {{ .key }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

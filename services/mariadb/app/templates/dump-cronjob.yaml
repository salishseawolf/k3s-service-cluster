# Hourly logical dump of each tenant database into the mariadb-dump PVC
# (<db>.sql). --single-transaction gives a consistent InnoDB snapshot without
# locks (a live copy of the data dir would only be crash-consistent). Only
# the latest dump is kept; VolSync (volsync.yaml) keeps the history in restic.
# --skip-dump-date makes an unchanged database produce an identical file, so
# restic stores idle hours for free. Failures alert by email
# (prometheusrule.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-dump
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mariadb-dump
spec:
  schedule: {{ .Values.mariadb.dump.schedule | quote }}
  concurrencyPolicy: Forbid
  # A run that cannot start within 30 min is skipped, not stacked.
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mariadb-dump
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -ec
                - |
                  # K3s' policy controller admits a new pod's IP a few
                  # seconds after it starts; wait (up to 60s).
                  for i in $(seq 1 30); do
                    if mariadb-admin ping --host=mariadb --user=dump \
                         --connect-timeout=2 --silent; then
                      echo "mariadb reachable after attempt $i"; break
                    fi
                    sleep 2
                  done
                  for db in{{ range .Values.tenants }} {{ .name }}{{ end }}; do
                    out=/dumps/$db.sql
                    tmp=/dumps/.$db.sql.tmp
                    mariadb-dump --host=mariadb --user=dump \
                      --single-transaction --skip-dump-date --hex-blob \
                      "$db" > "$tmp"
                    # a truncated dump lacks the trailer: fail, keep the previous one
                    tail -n1 "$tmp" | grep -q 'Dump completed'
                    mv "$tmp" "$out"
                    echo "dump ok: $db $(wc -c < "$out") bytes"
                  done
              env:
                # read by the MariaDB client; keeps the password off the command line
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.name }}
                      key: dump_password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                {{- toYaml .Values.mariadb.dump.resources | nindent 16 }}
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: mariadb-dump
            - name: tmp
              emptyDir: {}

# Root and dump passwords from MariaDB Secrets; each tenant's password from
# its app's own item (one source of truth, as homarr-db-password does for CNPG).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mariadb
  annotations:
    # Secret exists before the workloads that read it.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  itemPath: "{{ .Values.secrets.itemPath }}"
{{- range .Values.tenants }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .secret }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: mariadb
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  itemPath: "{{ .itemPath }}"
{{- end }}

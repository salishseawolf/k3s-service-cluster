apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Values.clusterName }}-store
  namespace: database
spec:
  configuration:
    destinationPath: "{{ .Values.b2.bucketPath }}"
    endpointURL: "{{ .Values.b2.endpoint }}"
    s3Credentials:
      accessKeyId:
        name: {{ .Values.backupSecretName }}
        key: s3_key_id
      secretAccessKey:
        name: {{ .Values.backupSecretName }}
        key: s3_application_key
    wal:
      compression: gzip
      maxParallel: 8
    data:
      compression: gzip

  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: "when_required"
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: "when_required"
      - name: AWS_DEFAULT_REGION
        value: "{{ .Values.b2.region }}"

  retentionPolicy: "{{ .Values.backupRetention }}"

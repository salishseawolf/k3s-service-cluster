apiVersion: batch/v1
kind: Job
metadata:
  name: seed-homarr-group
  namespace: database
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: default
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.seedJob.nodeName }}
      restartPolicy: Never
      containers:
      - name: psql
        image: postgres:17-alpine
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 999
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: homarr-db-password
              key: db_password
        command:
        - sh
        - -c
        - |
          for i in $(seq 1 30); do
            psql -h main-db-rw.database.svc.cluster.local -U homarr_user -d homarr -c "SELECT 1" > /dev/null 2>&1 && break
            echo "Waiting for database... attempt $i"
            sleep 10
          done
          psql -h main-db-rw.database.svc.cluster.local -U homarr_user -d homarr -c "
            INSERT INTO \"group\" (id, name, owner_id, \"position\")
            SELECT '00000000-0000-0000-0000-000000000001', 'infrastructure', NULL, 0
            WHERE NOT EXISTS (SELECT 1 FROM \"group\" WHERE name = 'infrastructure');
          " && \
          psql -h main-db-rw.database.svc.cluster.local -U homarr_user -d homarr -c "
            INSERT INTO \"groupPermission\" (group_id, permission)
            SELECT '00000000-0000-0000-0000-000000000001', 'admin'
            WHERE NOT EXISTS (
              SELECT 1 FROM \"groupPermission\" gp
              WHERE gp.group_id = '00000000-0000-0000-0000-000000000001'
              AND gp.permission = 'admin'
            );
          "
        # Read-only root fs: give psql a writable /tmp in case it needs one.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
  backoffLimit: 3

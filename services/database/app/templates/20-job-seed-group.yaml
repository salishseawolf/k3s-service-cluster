apiVersion: batch/v1
kind: Job
metadata:
  name: seed-homarr-group
  namespace: database
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  template:
    spec:
      serviceAccountName: default
      nodeSelector:
        kubernetes.io/hostname: k3s-converged-node-03
      restartPolicy: Never
      containers:
      - name: psql
        image: postgres:17-alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: homarr-db-password
              key: db_password
        command:
        - sh
        - -c
        - |
          psql -h main-db-rw -U homarr_user -d homarr -c "
            INSERT INTO \"group\" (id, name, owner_id)
            SELECT '00000000-0000-0000-0000-000000000001', 'infrastructure', NULL
            WHERE NOT EXISTS (SELECT 1 FROM \"group\" WHERE name = 'infrastructure');
          " && \
          psql -h main-db-rw -U homarr_user -d homarr -c "
            INSERT INTO \"groupPermission\" (group_id, permission)
            SELECT '00000000-0000-0000-0000-000000000001', 'admin'
            WHERE NOT EXISTS (
              SELECT 1 FROM \"groupPermission\" gp
              WHERE gp.group_id = '00000000-0000-0000-0000-000000000001'
              AND gp.permission = 'admin'
            );
          "
  backoffLimit: 6

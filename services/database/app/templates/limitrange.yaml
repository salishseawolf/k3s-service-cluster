---
# LimitRange for database namespace
# Sets default resource requests/limits for containers
apiVersion: v1
kind: LimitRange
metadata:
  name: database-limits
  namespace: database
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/component: postgresql
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "1Gi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      min:
        cpu: "10m"
        memory: "64Mi"
      max:
        cpu: "2000m"
        memory: "4Gi"

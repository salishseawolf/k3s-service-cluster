# NetworkPolicies for the database namespace.
#
# Model: default-deny ingress per namespace, then explicit
# allows. Traefik runs as a hostNetwork DaemonSet, so ingress from Traefik
# arrives with a NODE ip as source — matched via ipBlock on the private net
# (192.168.0.0/16), not a podSelector. Kubelet probe traffic on some CNIs is
# sourced from the cni0 bridge IP (pod CIDR); K3s' embedded policy controller
# permits host-local probe traffic, but VERIFY on a canary namespace first
# before rolling this out cluster-wide.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: "database"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: "database"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Application consumers of the shared CNPG cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-consumers
  namespace: "database"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paperless
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homarr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: umami
      ports:
        - protocol: TCP
          port: 5432
---
# CNPG operator manages instances (status, switchover, backups).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: "database"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system

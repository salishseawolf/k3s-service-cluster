---
# ResourceQuota for database namespace (CNPG PostgreSQL)
# Includes storage quota for CNPG volumes (3x 20Gi + overhead)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: database-quota
  namespace: database
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/component: postgresql
spec:
  hard:
    requests.cpu: "2000m"
    requests.memory: "4Gi"
    limits.cpu: "4000m"
    limits.memory: "8Gi"
    persistentvolumeclaims: "5"
    requests.storage: "100Gi"
    configmaps: "20"
    secrets: "20"
    services: "10"

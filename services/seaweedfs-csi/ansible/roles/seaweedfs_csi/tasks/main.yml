---
# SeaweedFS CSI Driver deployment tasks

# ──────────────────────────────────────────────────────────────────
# Preflight: Check SeaweedFS filer is running
# ──────────────────────────────────────────────────────────────────
- name: Check SeaweedFS deployment is available
  kubernetes.core.k8s_info:
    kind: Deployment
    name: seaweedfs
    namespace: seaweedfs
    wait: true
    wait_sleep: 10
    wait_timeout: 120
    wait_condition:
      type: Available
      status: "True"

# ──────────────────────────────────────────────────────────────────
# Namespace
# ──────────────────────────────────────────────────────────────────
- name: Create CSI namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ seaweedfs_csi_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: privileged

# ──────────────────────────────────────────────────────────────────
# ServiceAccounts & RBAC
# ──────────────────────────────────────────────────────────────────
- name: Create controller ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: seaweedfs-controller-sa
        namespace: "{{ seaweedfs_csi_namespace }}"

- name: Create node ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: seaweedfs-node-sa
        namespace: "{{ seaweedfs_csi_namespace }}"

- name: Create mount ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: seaweedfs-mount-sa
        namespace: "{{ seaweedfs_csi_namespace }}"

- name: Create provisioner ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: seaweedfs-provisioner-role
      rules:
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["persistentvolumes"]
          verbs: ["get", "list", "watch", "create", "delete"]
        - apiGroups: [""]
          resources: ["persistentvolumeclaims"]
          verbs: ["get", "list", "watch", "update"]
        - apiGroups: [""]
          resources: ["persistentvolumeclaims/status"]
          verbs: ["get", "list", "watch", "update", "patch"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["storageclasses"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["list", "watch", "create", "update", "patch"]
        - apiGroups: ["snapshot.storage.k8s.io"]
          resources: ["volumesnapshots"]
          verbs: ["get", "list"]
        - apiGroups: ["snapshot.storage.k8s.io"]
          resources: ["volumesnapshotcontents"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]

- name: Create attacher ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: seaweedfs-attacher-role
      rules:
        - apiGroups: ["storage.k8s.io"]
          resources: ["volumeattachments"]
          verbs: ["get", "list", "watch", "update", "patch"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["volumeattachments/status"]
          verbs: ["patch"]

- name: Create driver-registrar ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: seaweedfs-driver-registrar-role
      rules:
        - apiGroups: ["storage.k8s.io"]
          resources: ["csidrivers"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["list", "watch", "create", "update", "patch"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["csinodes"]
          verbs: ["get", "list", "watch", "update", "patch"]

- name: Create leader-election Role
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: seaweedfs-leader-election-role
        namespace: "{{ seaweedfs_csi_namespace }}"
      rules:
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["configmaps/status"]
          verbs: ["get", "update", "patch"]
        - apiGroups: [""]
          resources: ["endpoints"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["coordination.k8s.io"]
          resources: ["leases"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "patch"]

- name: Bind provisioner ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: seaweedfs-provisioner-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: seaweedfs-provisioner-role
      subjects:
        - kind: ServiceAccount
          name: seaweedfs-controller-sa
          namespace: "{{ seaweedfs_csi_namespace }}"

- name: Bind attacher ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: seaweedfs-attacher-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: seaweedfs-attacher-role
      subjects:
        - kind: ServiceAccount
          name: seaweedfs-controller-sa
          namespace: "{{ seaweedfs_csi_namespace }}"

- name: Bind driver-registrar ClusterRole (controller)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: seaweedfs-driver-registrar-controller-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: seaweedfs-driver-registrar-role
      subjects:
        - kind: ServiceAccount
          name: seaweedfs-controller-sa
          namespace: "{{ seaweedfs_csi_namespace }}"

- name: Bind driver-registrar ClusterRole (node)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: seaweedfs-driver-registrar-node-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: seaweedfs-driver-registrar-role
      subjects:
        - kind: ServiceAccount
          name: seaweedfs-node-sa
          namespace: "{{ seaweedfs_csi_namespace }}"

- name: Bind leader-election Role
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: seaweedfs-leader-election-binding
        namespace: "{{ seaweedfs_csi_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: seaweedfs-leader-election-role
      subjects:
        - kind: ServiceAccount
          name: seaweedfs-controller-sa
          namespace: "{{ seaweedfs_csi_namespace }}"

# ──────────────────────────────────────────────────────────────────
# CSIDriver
# ──────────────────────────────────────────────────────────────────
- name: Create CSIDriver
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: CSIDriver
      metadata:
        name: seaweedfs-csi-driver
      spec:
        attachRequired: false
        podInfoOnMount: true
        fsGroupPolicy: File
        volumeLifecycleModes:
          - Persistent

# ──────────────────────────────────────────────────────────────────
# StorageClass
# ──────────────────────────────────────────────────────────────────
- name: Create StorageClass
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: seaweedfs-storage
      provisioner: seaweedfs-csi-driver
      allowVolumeExpansion: true
      volumeBindingMode: Immediate

# ──────────────────────────────────────────────────────────────────
# Controller Deployment
# ──────────────────────────────────────────────────────────────────
- name: Deploy CSI controller
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: seaweedfs-csi-controller
        namespace: "{{ seaweedfs_csi_namespace }}"
        labels:
          app.kubernetes.io/name: seaweedfs-csi-controller
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: seaweedfs-csi-controller
        template:
          metadata:
            labels:
              app.kubernetes.io/name: seaweedfs-csi-controller
          spec:
            serviceAccountName: seaweedfs-controller-sa
            priorityClassName: system-cluster-critical
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values:
                            - seaweedfs-csi-controller
                    topologyKey: kubernetes.io/hostname
            containers:
              - name: seaweedfs-csi-driver
                image: "{{ seaweedfs_csi_driver_image }}"
                args:
                  - --endpoint=$(CSI_ENDPOINT)
                  - --filer=$(SEAWEEDFS_FILER)
                  - --driverName=$(DRIVER_NAME)
                  - --components=controller
                env:
                  - name: SEAWEEDFS_FILER
                    value: "{{ seaweedfs_csi_filer }}"
                  - name: CSI_ENDPOINT
                    value: unix:///var/lib/csi/sockets/seaweedfs.sock
                  - name: DRIVER_NAME
                    value: seaweedfs-csi-driver
                volumeMounts:
                  - name: socket-dir
                    mountPath: /var/lib/csi/sockets
              - name: csi-provisioner
                image: "{{ seaweedfs_csi_provisioner_image }}"
                args:
                  - --csi-address=$(ADDRESS)
                  - --leader-election=true
                  - --leader-election-namespace={{ seaweedfs_csi_namespace }}
                  - --http-endpoint=:9810
                env:
                  - name: ADDRESS
                    value: unix:///var/lib/csi/sockets/seaweedfs.sock
                volumeMounts:
                  - name: socket-dir
                    mountPath: /var/lib/csi/sockets
              - name: csi-attacher
                image: "{{ seaweedfs_csi_attacher_image }}"
                args:
                  - --csi-address=$(ADDRESS)
                  - --leader-election=true
                  - --leader-election-namespace={{ seaweedfs_csi_namespace }}
                  - --http-endpoint=:9811
                env:
                  - name: ADDRESS
                    value: unix:///var/lib/csi/sockets/seaweedfs.sock
                volumeMounts:
                  - name: socket-dir
                    mountPath: /var/lib/csi/sockets
              - name: csi-resizer
                image: "{{ seaweedfs_csi_resizer_image }}"
                args:
                  - --csi-address=$(ADDRESS)
                  - --leader-election=true
                  - --leader-election-namespace={{ seaweedfs_csi_namespace }}
                  - --http-endpoint=:9809
                env:
                  - name: ADDRESS
                    value: unix:///var/lib/csi/sockets/seaweedfs.sock
                volumeMounts:
                  - name: socket-dir
                    mountPath: /var/lib/csi/sockets
              - name: livenessprobe
                image: "{{ seaweedfs_csi_livenessprobe_image }}"
                args:
                  - --csi-address=$(ADDRESS)
                  - --http-endpoint=:9808
                env:
                  - name: ADDRESS
                    value: unix:///var/lib/csi/sockets/seaweedfs.sock
                volumeMounts:
                  - name: socket-dir
                    mountPath: /var/lib/csi/sockets
            volumes:
              - name: socket-dir
                emptyDir: {}

# ──────────────────────────────────────────────────────────────────
# Controller Service (for Gatus health check)
# ──────────────────────────────────────────────────────────────────
- name: Create controller Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: seaweedfs-csi-controller
        namespace: "{{ seaweedfs_csi_namespace }}"
      spec:
        ports:
          - port: 9808
            targetPort: 9808
        selector:
          app.kubernetes.io/name: seaweedfs-csi-controller

# ──────────────────────────────────────────────────────────────────
# seaweedfs-mount DaemonSet (OnDelete strategy)
# ──────────────────────────────────────────────────────────────────
- name: Deploy seaweedfs-mount DaemonSet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: seaweedfs-mount
        namespace: "{{ seaweedfs_csi_namespace }}"
        labels:
          app.kubernetes.io/name: seaweedfs-mount
      spec:
        updateStrategy:
          type: OnDelete
        selector:
          matchLabels:
            app.kubernetes.io/name: seaweedfs-mount
        template:
          metadata:
            labels:
              app.kubernetes.io/name: seaweedfs-mount
          spec:
            serviceAccountName: seaweedfs-mount-sa
            hostPID: true
            priorityClassName: system-node-critical
            containers:
              - name: seaweedfs-mount
                image: "{{ seaweedfs_csi_mount_image }}"
                args:
                  - --endpoint=unix:///var/lib/seaweedfs-mount/seaweedfs-mount.sock
                securityContext:
                  privileged: true
                  capabilities:
                    add:
                      - SYS_ADMIN
                volumeMounts:
                  - name: plugins-dir
                    mountPath: "{{ seaweedfs_csi_kubelet_root }}/plugins"
                    mountPropagation: Bidirectional
                  - name: pods-mount-dir
                    mountPath: "{{ seaweedfs_csi_kubelet_root }}/pods"
                    mountPropagation: Bidirectional
                  - name: mount-dir
                    mountPath: /var/lib/seaweedfs-mount
                    mountPropagation: Bidirectional
                  - name: device-dir
                    mountPath: /dev
                  - name: cache-dir
                    mountPath: /var/cache/seaweedfs
            volumes:
              - name: plugins-dir
                hostPath:
                  path: "{{ seaweedfs_csi_kubelet_root }}/plugins"
                  type: Directory
              - name: pods-mount-dir
                hostPath:
                  path: "{{ seaweedfs_csi_kubelet_root }}/pods"
                  type: Directory
              - name: mount-dir
                hostPath:
                  path: /var/lib/seaweedfs-mount
                  type: DirectoryOrCreate
              - name: device-dir
                hostPath:
                  path: /dev
                  type: Directory
              - name: cache-dir
                emptyDir: {}

# ──────────────────────────────────────────────────────────────────
# seaweedfs-node DaemonSet (RollingUpdate)
# ──────────────────────────────────────────────────────────────────
- name: Deploy seaweedfs-node DaemonSet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: seaweedfs-node
        namespace: "{{ seaweedfs_csi_namespace }}"
        labels:
          app.kubernetes.io/name: seaweedfs-node
      spec:
        updateStrategy:
          type: RollingUpdate
        selector:
          matchLabels:
            app.kubernetes.io/name: seaweedfs-node
        template:
          metadata:
            labels:
              app.kubernetes.io/name: seaweedfs-node
          spec:
            serviceAccountName: seaweedfs-node-sa
            hostPID: true
            priorityClassName: system-node-critical
            containers:
              - name: seaweedfs-csi-driver
                image: "{{ seaweedfs_csi_driver_image }}"
                args:
                  - --endpoint=$(CSI_ENDPOINT)
                  - --filer=$(SEAWEEDFS_FILER)
                  - --nodeid=$(NODE_ID)
                  - --driverName=$(DRIVER_NAME)
                  - --mountEndpoint=$(MOUNT_ENDPOINT)
                  - --cacheDir=/var/cache/seaweedfs
                  - --components=node
                securityContext:
                  privileged: true
                  capabilities:
                    add:
                      - SYS_ADMIN
                env:
                  - name: SEAWEEDFS_FILER
                    value: "{{ seaweedfs_csi_filer }}"
                  - name: CSI_ENDPOINT
                    value: unix:///var/lib/csi/sockets/seaweedfs.sock
                  - name: NODE_ID
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                  - name: DRIVER_NAME
                    value: seaweedfs-csi-driver
                  - name: MOUNT_ENDPOINT
                    value: unix:///var/lib/seaweedfs-mount/seaweedfs-mount.sock
                volumeMounts:
                  - name: kubelet-dir
                    mountPath: /var/lib/kubelet
                  - name: plugins-dir
                    mountPath: /var/lib/csi/sockets
                    mountPropagation: Bidirectional
                  - name: pods-mount-dir
                    mountPath: /var/lib/kubelet/pods
                    mountPropagation: Bidirectional
                  - name: mount-dir
                    mountPath: /var/lib/seaweedfs-mount
                  - name: device-dir
                    mountPath: /dev
                  - name: cache-dir
                    mountPath: /var/cache/seaweedfs
              - name: driver-registrar
                image: "{{ seaweedfs_csi_registrar_image }}"
                args:
                  - --csi-address=$(ADDRESS)
                  - --kubelet-registration-path={{ seaweedfs_csi_kubelet_root }}/plugins/seaweedfs-csi-driver/seaweedfs.sock
                  - --http-endpoint=:9809
                env:
                  - name: ADDRESS
                    value: unix:///var/lib/csi/sockets/seaweedfs.sock
                volumeMounts:
                  - name: plugins-dir
                    mountPath: /var/lib/csi/sockets
                  - name: registration-dir
                    mountPath: /registration
              - name: livenessprobe
                image: "{{ seaweedfs_csi_livenessprobe_image }}"
                args:
                  - --csi-address=$(ADDRESS)
                  - --http-endpoint=:9812
                env:
                  - name: ADDRESS
                    value: unix:///var/lib/csi/sockets/seaweedfs.sock
                volumeMounts:
                  - name: plugins-dir
                    mountPath: /var/lib/csi/sockets
            volumes:
              - name: kubelet-dir
                hostPath:
                  path: "{{ seaweedfs_csi_kubelet_root }}"
                  type: Directory
              - name: plugins-dir
                hostPath:
                  path: "{{ seaweedfs_csi_kubelet_root }}/plugins/seaweedfs-csi-driver"
                  type: DirectoryOrCreate
              - name: registration-dir
                hostPath:
                  path: "{{ seaweedfs_csi_kubelet_root }}/plugins_registry"
                  type: DirectoryOrCreate
              - name: pods-mount-dir
                hostPath:
                  path: "{{ seaweedfs_csi_kubelet_root }}/pods"
                  type: DirectoryOrCreate
              - name: mount-dir
                hostPath:
                  path: /var/lib/seaweedfs-mount
                  type: DirectoryOrCreate
              - name: device-dir
                hostPath:
                  path: /dev
                  type: Directory
              - name: cache-dir
                emptyDir: {}

# ──────────────────────────────────────────────────────────────────
# Wait for ready
# ──────────────────────────────────────────────────────────────────
- name: Wait for CSI controller deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: seaweedfs-csi-controller
    namespace: "{{ seaweedfs_csi_namespace }}"
    wait: true
    wait_sleep: 10
    wait_timeout: 180
    wait_condition:
      type: Available
      status: "True"

- name: Wait for seaweedfs-mount DaemonSet to be ready
  kubernetes.core.k8s_info:
    kind: DaemonSet
    name: seaweedfs-mount
    namespace: "{{ seaweedfs_csi_namespace }}"
  register: seaweedfs_csi_mount_daemonset
  until:
    - seaweedfs_csi_mount_daemonset.resources | length > 0
    - seaweedfs_csi_mount_daemonset.resources[0].status.numberReady | default(0) >= seaweedfs_csi_mount_daemonset.resources[0].status.desiredNumberScheduled | default(1)
    - seaweedfs_csi_mount_daemonset.resources[0].status.desiredNumberScheduled | default(0) > 0
  retries: 18
  delay: 10

- name: Wait for seaweedfs-node DaemonSet to be ready
  kubernetes.core.k8s_info:
    kind: DaemonSet
    name: seaweedfs-node
    namespace: "{{ seaweedfs_csi_namespace }}"
  register: seaweedfs_csi_node_daemonset
  until:
    - seaweedfs_csi_node_daemonset.resources | length > 0
    - seaweedfs_csi_node_daemonset.resources[0].status.numberReady | default(0) >= seaweedfs_csi_node_daemonset.resources[0].status.desiredNumberScheduled | default(1)
    - seaweedfs_csi_node_daemonset.resources[0].status.desiredNumberScheduled | default(0) > 0
  retries: 18
  delay: 10

# ──────────────────────────────────────────────────────────────────
# Network policies (docs/PLAN.md H2.1)
# ──────────────────────────────────────────────────────────────────

- name: Apply network policies
  kubernetes.core.k8s:
    state: present
    template: networkpolicy.yaml.j2

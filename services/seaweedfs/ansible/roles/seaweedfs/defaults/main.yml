---
sw_namespace: "seaweedfs"
sw_domain: "s3.{{ lookup('env', 'TF_VAR_domain') }}"
sw_image: "chrislusf/seaweedfs:4.32_full"
sw_storage_size: "100Gi"
sw_storage_class: "hcloud-volumes"
sw_volume_port: 8080
sw_master_port: 9333
sw_filer_port: 8888
sw_s3_port: 8333

# Filer PostgreSQL backend (uses shared CNPG cluster)
sw_db_host: "main-db-rw.database.svc.cluster.local"
sw_db_name: "seaweedfs_filer"
sw_db_user: "seaweedfs_user"
sw_db_port: 5432
sw_db_password: "{{ lookup('env', 'SEAWEEDFS_DB_PASSWORD') }}"

# Backup
sw_backup_hostname: "{{ lookup('env', 'SEAWEEDFS_BACKUP_HOSTNAME') }}"

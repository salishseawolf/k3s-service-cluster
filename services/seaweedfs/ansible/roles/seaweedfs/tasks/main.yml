# SeaweedFS deployment tasks
# Single pod with all 4 roles: master, volume, filer, s3

# ──────────────────────────────────────────────────────────────────
# 1. Namespace
# ──────────────────────────────────────────────────────────────────
- name: Create SeaweedFS Namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ sw_namespace }}"
        labels:
          app.kubernetes.io/name: seaweedfs
          pod-security.kubernetes.io/enforce: privileged

# ──────────────────────────────────────────────────────────────────
# 2. ResourceQuota + LimitRange
# ──────────────────────────────────────────────────────────────────
- name: Deploy SeaweedFS ResourceQuota
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: seaweedfs-quota
        namespace: "{{ sw_namespace }}"
      spec:
        hard:
          requests.cpu: "4000m"
          requests.memory: "4Gi"
          limits.cpu: "8000m"
          limits.memory: "8Gi"
          persistentvolumeclaims: "2"
          configmaps: "5"
          secrets: "15"

- name: Deploy SeaweedFS LimitRange
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: LimitRange
      metadata:
        name: seaweedfs-limits
        namespace: "{{ sw_namespace }}"
      spec:
        limits:
          - type: Container
            default:
              cpu: "2000m"
              memory: "2Gi"
            defaultRequest:
              cpu: "1000m"
              memory: "1Gi"
            min:
              cpu: "100m"
              memory: "256Mi"
            max:
              cpu: "4000m"
              memory: "4Gi"

# ──────────────────────────────────────────────────────────────────
# 3. PVC
# ──────────────────────────────────────────────────────────────────
- name: Create SeaweedFS PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: seaweedfs-data
        namespace: "{{ sw_namespace }}"
        labels:
          app.kubernetes.io/name: seaweedfs
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ sw_storage_size }}"
        storageClassName: "{{ sw_storage_class }}"

# ──────────────────────────────────────────────────────────────────
# 4. OnePasswordItem CRs (all secrets via 1Password Operator)
# ──────────────────────────────────────────────────────────────────
- name: Create OnePasswordItem for SeaweedFS root credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: seaweedfs-root-creds
        namespace: "{{ sw_namespace }}"
      spec:
        itemPath: "vaults/K3s Service Cluster/items/SeaweedFS Secrets"

- name: Create OnePasswordItem for SeaweedFS DB password
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: seaweedfs-db-password
        namespace: "{{ sw_namespace }}"
      spec:
        itemPath: "vaults/K3s Service Cluster/items/SeaweedFS Secrets"

- name: Create OnePasswordItem for SeaweedFS backup credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: seaweedfs-backup-creds
        namespace: "{{ sw_namespace }}"
      spec:
        itemPath: "vaults/K3s Service Cluster/items/SeaweedFS Secrets"

- name: Create OnePasswordItem for Gitea S3 credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: gitea-s3-creds
        namespace: "{{ sw_namespace }}"
      spec:
        itemPath: "vaults/K3s Service Cluster/items/Gitea Secrets"

# ──────────────────────────────────────────────────────────────────
# 5a. Wait for all secrets to sync
# ──────────────────────────────────────────────────────────────────

- name: Wait for OnePasswordItem secrets to sync
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ sw_namespace }}"
  loop:
    - seaweedfs-root-creds
    - seaweedfs-db-password
    - seaweedfs-backup-creds
    - gitea-s3-creds
  register: op_secrets
  until: op_secrets.resources | length > 0
  retries: 12
  delay: 5

# ──────────────────────────────────────────────────────────────────
# 6. Database provisioning
# ──────────────────────────────────────────────────────────────────
- name: Wait for CloudNativePG cluster to be healthy
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: database
    label_selectors:
      - app.kubernetes.io/name = postgresql
      - cnpg.io/cluster = main-db
    field_selectors:
      - status.phase=Running
  register: pg_pods
  retries: 10
  delay: 5
  until: pg_pods.resources | length > 0

- name: Get Postgres Read-Write Endpoints
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Endpoints
    name: main-db-rw
    namespace: database
  register: pg_endpoints

- name: Fail if Read-Write Endpoint is empty
  ansible.builtin.fail:
    msg: "Postgres read-write endpoint not found"
  when: pg_endpoints.resources[0].subsets | length == 0

- name: Set Fact for Postgres Leader Pod
  ansible.builtin.set_fact:
    gatus_db_admin_pod: "{{ pg_endpoints.resources[0].subsets[0].addresses[0].targetRef.name }}"

- name: Check if SeaweedFS DB User Exists
  kubernetes.core.k8s_exec:
    namespace: database
    pod: "{{ pg_endpoints.resources[0].subsets[0].addresses[0].targetRef.name }}"
    command: psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ sw_db_user }}'"
  register: sw_user_check
  changed_when: false

- name: Create SeaweedFS Database User
  kubernetes.core.k8s_exec:
    namespace: database
    pod: "{{ pg_endpoints.resources[0].subsets[0].addresses[0].targetRef.name }}"
    command: psql -U postgres -c "CREATE ROLE {{ sw_db_user }} WITH LOGIN PASSWORD '{{ sw_db_password }}';"
  no_log: true
  when: (sw_user_check.stdout | trim) != '1'

- name: Check if SeaweedFS Database Exists
  kubernetes.core.k8s_exec:
    namespace: database
    pod: "{{ pg_endpoints.resources[0].subsets[0].addresses[0].targetRef.name }}"
    command: psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ sw_db_name }}'"
  register: sw_db_check
  changed_when: false

- name: Create SeaweedFS Database
  kubernetes.core.k8s_exec:
    namespace: database
    pod: "{{ pg_endpoints.resources[0].subsets[0].addresses[0].targetRef.name }}"
    command: psql -U postgres -c "CREATE DATABASE {{ sw_db_name }} OWNER {{ sw_db_user }};"
  when: (sw_db_check.stdout | trim) != '1'

- name: Grant All Privileges to SeaweedFS User
  kubernetes.core.k8s_exec:
    namespace: database
    pod: "{{ pg_endpoints.resources[0].subsets[0].addresses[0].targetRef.name }}"
    command: psql -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE {{ sw_db_name }} TO {{ sw_db_user }};"

- name: Alter Schema Owner
  kubernetes.core.k8s_exec:
    namespace: database
    pod: "{{ pg_endpoints.resources[0].subsets[0].addresses[0].targetRef.name }}"
    command: psql -U postgres -d {{ sw_db_name }} -c "ALTER SCHEMA public OWNER TO {{ sw_db_user }};"
- name: Grant All on Schema Public
  kubernetes.core.k8s_exec:
    namespace: database
    pod: "{{ pg_endpoints.resources[0].subsets[0].addresses[0].targetRef.name }}"
    command: psql -U postgres -d {{ sw_db_name }} -c "GRANT ALL ON SCHEMA public TO {{ sw_db_user }};"

# ──────────────────────────────────────────────────────────────────
# 7. ConfigMap for filer config (non-sensitive)
# ──────────────────────────────────────────────────────────────────
- name: Create SeaweedFS filer ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: seaweedfs-filer-config
        namespace: "{{ sw_namespace }}"
      data:
        filer.toml: |
          [s3]
          enabled = true
          [s3.auth]
          enabled = true

# ──────────────────────────────────────────────────────────────────
# 8. Authentik Blueprint (append + apply)
# ──────────────────────────────────────────────────────────────────
- name: Append seaweedfs blueprint to authentik-blueprints
  ansible.builtin.shell:
    cmd: >
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" patch configmap authentik-blueprints -n identity
      --type='json'
      -p='[{"op": "add", "path": "/data/seaweedfs-filer.yaml",
      "value": {{ lookup('template', 'blueprint-seaweedfs-filer.yaml.j2') | to_json }}}]'
  register: patch_result
  changed_when: patch_result.rc == 0
  failed_when: false

- name: Retry ConfigMap patch with replace if add failed
  ansible.builtin.shell:
    cmd: >
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" patch configmap authentik-blueprints -n identity
      --type='json'
      -p='[{"op": "replace", "path": "/data/seaweedfs-filer.yaml",
      "value": {{ lookup('template', 'blueprint-seaweedfs-filer.yaml.j2') | to_json }}}]'
  when: patch_result.failed
  changed_when: false

- name: Wait for ConfigMap propagation and apply blueprint
  ansible.builtin.shell:
    cmd: |
      for i in $(seq 1 12); do
        kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n identity exec deploy/authentik-server -- sh -c "test -f /blueprints/custom/seaweedfs-filer.yaml" 2>/dev/null && break
        sleep 10
      done && kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n identity exec deploy/authentik-server -- ak apply_blueprint /blueprints/custom/seaweedfs-filer.yaml 2>&1
  register: apply_result
  changed_when: "'created' in apply_result.stdout or 'patched' in apply_result.stdout"

- name: Fetch Authentik auto-generated outpost token
  ansible.builtin.shell:
    cmd: |
      for i in 1 2 3 4 5; do
        TOKEN=$(kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n identity exec deploy/authentik-server -- python3 -c "
      import django, os
      os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'authentik.root.settings')
      django.setup()
      from authentik.outposts.models import Outpost
      from authentik.core.models import Token
      o = Outpost.objects.filter(name='SeaweedFS Filer Outpost').first()
      if o and o.token:
          t = Token.objects.filter(identifier=o.token).first()
          print(t.key if t and t.key else '')
      " 2>/dev/null)
        if [ -n "$TOKEN" ]; then
          echo "$TOKEN"
          exit 0
        fi
        sleep 5
      done
      exit 1
  register: outpost_token_result
  changed_when: outpost_token_result.stdout | length > 10
  failed_when: outpost_token_result.stdout | length == 0

- name: Create outpost token Secret from auto-generated token
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: seaweedfs-outpost-token
        namespace: "{{ sw_namespace }}"
      type: Opaque
      stringData:
        token: "{{ outpost_token_result.stdout }}"

# ──────────────────────────────────────────────────────────────────
# 9. Deployment (all 4 roles in one pod)
# ──────────────────────────────────────────────────────────────────
- name: Deploy SeaweedFS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: seaweedfs
        namespace: "{{ sw_namespace }}"
        labels:
          app.kubernetes.io/name: seaweedfs
      spec:
        replicas: 1
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app.kubernetes.io/name: seaweedfs
        template:
          metadata:
            labels:
              app.kubernetes.io/name: seaweedfs
          spec:
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
            initContainers:
              - name: config-builder
                image: busybox:1.36
                command:
                  - /bin/sh
                  - -c
                  - |
                    ROOT_USER=$(cat /secrets/root-creds/username)
                    ROOT_PASS=$(cat /secrets/root-creds/password)
                    GITEA_S3_KEY=$(cat /secrets/gitea-s3-creds/access_key)
                    GITEA_S3_SECRET=$(cat /secrets/gitea-s3-creds/secret_key)
                    DB_PASS=$(cat /secrets/db-password/db_password)
                    cat > /shared/s3.json << EOF
                    {
                      "identities": [
                        {
                          "name": "$ROOT_USER",
                          "credentials": [
                            {
                              "accessKey": "$ROOT_USER",
                              "secretKey": "$ROOT_PASS"
                            }
                          ],
                          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
                        },
                        {
                          "name": "gitea",
                          "credentials": [
                            {
                              "accessKey": "$GITEA_S3_KEY",
                              "secretKey": "$GITEA_S3_SECRET"
                            }
                          ],
                          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
                        }
                      ]
                    }
                    EOF
                    cat /etc/filer-config/filer.toml > /shared/filer.toml
                    cat >> /shared/filer.toml << EOF
                    [postgres2]
                    enabled = true
                    hostname = "{{ sw_db_host }}"
                    port = {{ sw_db_port }}
                    username = "{{ sw_db_user }}"
                    password = "$DB_PASS"
                    database = "{{ sw_db_name }}"
                    sslmode = "disable"
                    connection_max_idle = 5
                    connection_max_open = 10
                    connection_max_lifetime_seconds = 0
                    createTable = 'CREATE TABLE IF NOT EXISTS "%s" (dirhash BIGINT NOT NULL, name VARCHAR(65535) NOT NULL, directory TEXT NOT NULL, meta BYTEA, PRIMARY KEY (dirhash, name))'
                    EOF
                volumeMounts:
                  - name: root-creds
                    mountPath: /secrets/root-creds
                    readOnly: true
                  - name: db-password
                    mountPath: /secrets/db-password
                  - mountPath: /secrets/gitea-s3-creds
                    name: gitea-s3-creds
                    readOnly: true
                  - name: filer-config
                    mountPath: /etc/filer-config
                    readOnly: true
                  - name: config-data
                    mountPath: /shared
            containers:
              - name: seaweedfs
                image: "{{ sw_image }}"
                command:
                  - weed
                  - server
                  - -filer
                  - -s3
                  - -master.port={{ sw_master_port }}
                  - -volume.port={{ sw_volume_port }}
                  - -filer.port={{ sw_filer_port }}
                  - -s3.port={{ sw_s3_port }}
                  - -dir=/data
                  - -volume.max=100
                  - -s3.config=/etc/seaweedfs/s3.json
                ports:
                  - containerPort: "{{ sw_master_port }}"
                    name: master
                  - containerPort: "{{ sw_volume_port }}"
                    name: volume
                  - containerPort: "{{ sw_filer_port }}"
                    name: filer
                  - containerPort: "{{ sw_s3_port }}"
                    name: s3
                  - containerPort: 18888
                    name: filer-grpc
                env:
                  - name: WEED_MASTER
                    value: "localhost:{{ sw_master_port }}"
                  - name: S3_CONFIG_FILE
                    value: /etc/seaweedfs/s3.json
                volumeMounts:
                  - name: data
                    mountPath: /data
                  - name: config-data
                    mountPath: /etc/seaweedfs/filer.toml
                    subPath: filer.toml
                  - name: config-data
                    mountPath: /etc/seaweedfs/s3.json
                    subPath: s3.json
                livenessProbe:
                  httpGet:
                    path: /cluster/status
                    port: "{{ sw_master_port }}"
                  initialDelaySeconds: 30
                  periodSeconds: 30
                readinessProbe:
                  httpGet:
                    path: /cluster/status
                    port: "{{ sw_master_port }}"
                  initialDelaySeconds: 10
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: "1000m"
                    memory: "1Gi"
                  limits:
                    cpu: "4000m"
                    memory: "4Gi"
              - name: backup-tools
                image: amazon/aws-cli:latest
                command:
                  - sleep
                  - infinity
                env:
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: seaweedfs-backup-creds
                        key: backup_access_key
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: seaweedfs-backup-creds
                        key: backup_secret_key
                  - name: AWS_DEFAULT_REGION
                    value: hel1
                volumeMounts:
                  - name: data
                    mountPath: /data
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: seaweedfs-data
              - name: config-data
                emptyDir: {}
              - name: filer-config
                configMap:
                  name: seaweedfs-filer-config
              - name: root-creds
                secret:
                  secretName: seaweedfs-root-creds
              - name: db-password
                secret:
                  secretName: seaweedfs-db-password
              - name: gitea-s3-creds
                secret:
                  secretName: gitea-s3-creds

# ──────────────────────────────────────────────────────────────────
# 10. Services
# ──────────────────────────────────────────────────────────────────
- name: Create SeaweedFS S3 Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: seaweedfs-s3
        namespace: "{{ sw_namespace }}"
        labels:
          app.kubernetes.io/name: seaweedfs
      spec:
        type: ClusterIP
        ports:
          - port: 8333
            targetPort: "{{ sw_s3_port }}"
            name: s3
        selector:
          app.kubernetes.io/name: seaweedfs

# ──────────────────────────────────────────────────────────────────
# 11. Internal Service
# ──────────────────────────────────────────────────────────────────
- name: Create SeaweedFS Internal Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: seaweedfs-internal
        namespace: "{{ sw_namespace }}"
        labels:
          app.kubernetes.io/name: seaweedfs
      spec:
        type: ClusterIP
        ports:
          - port: 9333
            targetPort: "{{ sw_master_port }}"
            name: master
          - port: 8080
            targetPort: "{{ sw_volume_port }}"
            name: volume
          - port: 8888
            targetPort: "{{ sw_filer_port }}"
            name: filer
          - port: 18888
            targetPort: 18888
            name: filer-grpc
        selector:
          app.kubernetes.io/name: seaweedfs

# ──────────────────────────────────────────────────────────────────
# 12. Authentik Outpost + Middleware
# ──────────────────────────────────────────────────────────────────
- name: Deploy ForwardAuth Middleware
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: seaweedfs-filer-auth
        namespace: "{{ sw_namespace }}"
      spec:
        forwardAuth:
          address: "http://seaweedfs-filer-outpost.{{ sw_namespace }}.svc.cluster.local/outpost.goauthentik.io/auth/traefik"
          trustForwardHeader: true
          authResponseHeaders:
            - X-authentik-username
            - Authorization
            - X-authentik-groups
            - X-authentik-email
            - X-authentik-name
            - X-authentik-uid
            - X-authentik-jwt
            - X-authentik-meta-outpost
            - X-authentik-meta-provider
            - X-authentik-meta-app
            - X-authentik-meta-version

- name: Create outpost ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: seaweedfs-filer-outpost
        namespace: "{{ sw_namespace }}"

- name: Deploy outpost Kubernetes Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: seaweedfs-filer-outpost
        namespace: "{{ sw_namespace }}"
      spec:
        type: ClusterIP
        ports:
          - port: 80
            targetPort: 9000
            name: http
        selector:
          app.kubernetes.io/name: seaweedfs-filer-outpost

- name: Deploy outpost Deployment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: seaweedfs-filer-outpost
        namespace: "{{ sw_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: seaweedfs-filer-outpost
        template:
          metadata:
            labels:
              app.kubernetes.io/name: seaweedfs-filer-outpost
          spec:
            serviceAccountName: seaweedfs-filer-outpost
            containers:
              - name: proxy
                image: ghcr.io/goauthentik/proxy:2026.5.3
                ports:
                  - containerPort: 9000
                    name: http
                env:
                  - name: AUTHENTIK_HOST
                    value: "http://authentik-server.identity.svc.cluster.local"
                  - name: AUTHENTIK_HOST_BROWSER
                    value: "https://auth.{{ lookup('env', 'TF_VAR_domain') }}"
                  - name: AUTHENTIK_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: seaweedfs-outpost-token
                        key: token
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi

- name: Deploy S3 trailing slash middleware
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: s3-add-trailing-slash
        namespace: "{{ sw_namespace }}"
      spec:
        replacePathRegex:
          regex: ^(/([^/]+))$
          replacement: ${1}/

- name: Deploy SeaweedFS S3 IngressRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: seaweedfs-s3
        namespace: "{{ sw_namespace }}"
      spec:
        entryPoints:
        - websecure
        routes:
        - kind: Rule
          match: Host(`{{ sw_domain }}`)
          middlewares:
          - name: s3-add-trailing-slash
          services:
          - name: seaweedfs-s3
            port: "{{ sw_s3_port }}"
        tls:
          secretName: wildcard-{{ lookup('env', 'TF_VAR_domain') | replace('.', '-') }}-tls

- name: Deploy SeaweedFS Filer UI IngressRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: seaweedfs-filer
        namespace: "{{ sw_namespace }}"
      spec:
        entryPoints:
          - websecure
        routes:
          - kind: Rule
            match: "Host(`filer-{{ sw_domain }}`)"
            middlewares:
              - name: seaweedfs-filer-auth
                namespace: "{{ sw_namespace }}"
            services:
              - name: seaweedfs-internal
                port: "{{ sw_filer_port }}"
        tls:
          secretName: wildcard-{{ lookup('env', 'TF_VAR_domain') | replace('.', '-') }}-tls

# ──────────────────────────────────────────────────────────────────
# 14. PodDisruptionBudget
# ──────────────────────────────────────────────────────────────────
- name: Deploy SeaweedFS PDB
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: seaweedfs-pdb
        namespace: "{{ sw_namespace }}"
      spec:
        maxUnavailable: 0
        selector:
          matchLabels:
            app.kubernetes.io/name: seaweedfs

# ──────────────────────────────────────────────────────────────────
# 15. Backup CronJob + RBAC
# ──────────────────────────────────────────────────────────────────
- name: Create SeaweedFS backup ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: seaweedfs-backup
        namespace: "{{ sw_namespace }}"

- name: Create SeaweedFS backup Role
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: seaweedfs-backup
        namespace: "{{ sw_namespace }}"
      rules:
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["get"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["pods/exec"]
          verbs: ["create"]

- name: Create SeaweedFS backup RoleBinding
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: seaweedfs-backup
        namespace: "{{ sw_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: seaweedfs-backup
      subjects:
        - kind: ServiceAccount
          name: seaweedfs-backup
          namespace: "{{ sw_namespace }}"

- name: Deploy SeaweedFS backup CronJob
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: seaweedfs-backup
        namespace: "{{ sw_namespace }}"
      spec:
        schedule: "0 3 * * *"
        timeZone: "America/Los_Angeles"
        concurrencyPolicy: Forbid
        startingDeadlineSeconds: 7200
        jobTemplate:
          spec:
            template:
              spec:
                serviceAccountName: seaweedfs-backup
                restartPolicy: OnFailure
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: s3sync
                    image: bitnami/kubectl:latest
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    command:
                      - /bin/sh
                      - -c
                      - |
                        kubectl exec deploy/seaweedfs -n {{ sw_namespace }} -c backup-tools -- \
                          aws s3 cp --recursive /data/ s3://seaweedfs-backup/ \
                            --endpoint-url https://{{ sw_backup_hostname }} \
                            --no-follow-symlinks
                    env:
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef:
                            name: seaweedfs-backup-creds
                            key: backup_access_key
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef:
                            name: seaweedfs-backup-creds
                            key: backup_secret_key
                      - name: AWS_DEFAULT_REGION
                        value: hel1

# 16. Backup Freshness Health Check
# ──────────────────────────────────────────────────────────────────
- name: Deploy backup-check ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: seaweedfs-backup-check
        namespace: "{{ sw_namespace }}"

- name: Deploy backup-check ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: seaweedfs-backup-check
      rules:
        - apiGroups: ["batch"]
          resources: ["cronjobs"]
          verbs: ["get"]

- name: Deploy backup-check ClusterRoleBinding
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: seaweedfs-backup-check
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: seaweedfs-backup-check
      subjects:
        - kind: ServiceAccount
          name: seaweedfs-backup-check
          namespace: "{{ sw_namespace }}"

- name: Deploy backup-check Deployment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: seaweedfs-backup-check
        namespace: "{{ sw_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: seaweedfs-backup-check
        template:
          metadata:
            labels:
              app: seaweedfs-backup-check
          spec:
            serviceAccountName: seaweedfs-backup-check
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: server
                image: python:3.11-slim
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                ports:
                  - containerPort: 8080
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 60
                command:
                  - sh
                  - -c
                  - |
                    python3 -c "
                    import http.server, json, time, urllib.request, os, ssl
                    from datetime import datetime, timezone

                    NAMESPACE = os.environ.get('NAMESPACE', '{{ sw_namespace }}')
                    K8S_HOST = 'https://kubernetes.default.svc'
                    TOKEN_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/token'
                    CA_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
                    MAX_HOURS = 36

                    class H(http.server.BaseHTTPRequestHandler):
                        def do_GET(self):
                            if self.path != '/health':
                                self.send_response(404)
                                self.end_headers()
                                return
                            try:
                                token = open(TOKEN_PATH).read()
                                req = urllib.request.Request(
                                    f'{K8S_HOST}/apis/batch/v1/namespaces/{NAMESPACE}/cronjobs/seaweedfs-backup',
                                    headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'}
                                )
                                ctx = ssl.create_default_context(cafile=CA_PATH)
                                resp = urllib.request.urlopen(req, context=ctx, timeout=10)
                                data = json.loads(resp.read())
                                t = data.get('status', {}).get('lastSuccessfulTime')
                                if not t:
                                    self.send_response(503)
                                    self.send_header('Content-Type', 'application/json')
                                    self.end_headers()
                                    self.wfile.write(json.dumps({'status': 'no_backup_found'}).encode())
                                    return
                                last_dt = datetime.fromisoformat(t.replace('Z', '+00:00'))
                                age = (datetime.now(timezone.utc) - last_dt).total_seconds()
                                ok = age < MAX_HOURS * 3600
                                self.send_response(200 if ok else 503)
                                self.send_header('Content-Type', 'application/json')
                                self.end_headers()
                                self.wfile.write(json.dumps({
                                    'status': 'ok' if ok else 'stale',
                                    'last_backup': t,
                                    'age_hours': round(age / 3600, 1)
                                }).encode())
                            except Exception as e:
                                self.send_response(500)
                                self.send_header('Content-Type', 'text/plain')
                                self.end_headers()
                                self.wfile.write(str(e).encode())
                    http.server.HTTPServer(('0.0.0.0', 8080), H).serve_forever()
                    "
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi

- name: Deploy backup-check Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: seaweedfs-backup-check
        namespace: "{{ sw_namespace }}"
      spec:
        ports:
          - port: 8080
            targetPort: 8080
        selector:
          app: seaweedfs-backup-check

# 17. Wait for ready
- name: Wait for SeaweedFS deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: seaweedfs
    namespace: "{{ sw_namespace }}"
    wait: true
    wait_sleep: 10
    wait_timeout: 180
    wait_condition:
      type: Available
      status: "True"


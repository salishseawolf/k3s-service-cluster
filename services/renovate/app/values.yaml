---
# Injected by the root ApplicationSet as a Helm parameter (single source of
# truth for the cluster domain lives in platform/argocd). Unused here.
domain: ""

image:
  repository: ghcr.io/renovatebot/renovate
  tag: "44.210.0"

# Hourly: Renovate's working cadence (act on Dependency Dashboard clicks,
# clean up merged branches). Updates and their PRs happen only inside the
# schedule window in /renovate.json5 (05:00-07:59 Pacific): the 05:15 run
# pushes branches, and the 06:15 and 07:15 runs open PRs once CI passes.
schedule: "15 * * * *"
timeZone: America/Los_Angeles

repositories: salishseawolf/k3s-service-cluster
botUsername: "salishseawolf-renovate[bot]"
logLevel: info

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

secrets:
  githubApp:
    name: renovate-github-app
    itemPath: "vaults/K3s Service Cluster/items/Renovate App Key"
    # The operator turns field labels into Secret keys, replacing characters
    # Kubernetes disallows: the 1P field "private key" becomes "private-key".
    privateKeyKey: private-key
    appIdKey: app_id
    installationIdKey: installation_id

apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-mint-token
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
data:
  # Trades the GitHub App private key for a 1-hour installation token and
  # prints it on stdout. Uses only Node built-ins (crypto, fetch), which the
  # Renovate image already ships, so no extra image or init container.
  mint-token.js: |
    const crypto = require('node:crypto');
    const fs = require('node:fs');

    const appId = process.env.GITHUB_APP_ID;
    const installationId = process.env.GITHUB_APP_INSTALLATION_ID;
    const key = fs.readFileSync(process.env.GITHUB_APP_PRIVATE_KEY_FILE, 'utf8');

    const b64url = (s) => Buffer.from(s).toString('base64url');
    const now = Math.floor(Date.now() / 1000);
    // iat backdated 60s for clock skew; GitHub caps exp at 10 minutes.
    const unsigned = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' })) + '.' +
      b64url(JSON.stringify({ iat: now - 60, exp: now + 540, iss: appId }));
    const jwt = unsigned + '.' +
      crypto.sign('RSA-SHA256', Buffer.from(unsigned), key).toString('base64url');

    (async () => {
      const res = await fetch(
        `https://api.github.com/app/installations/${installationId}/access_tokens`,
        {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${jwt}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          },
        },
      );
      if (!res.ok) {
        console.error(`mint-token: HTTP ${res.status}: ${await res.text()}`);
        process.exit(1);
      }
      const body = await res.json();
      console.error(`mint-token: installation token issued, expires ${body.expires_at}`);
      process.stdout.write(body.token);
    })().catch((err) => {
      console.error(`mint-token: ${err.message}`);
      process.exit(1);
    });

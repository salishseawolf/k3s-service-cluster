# GitHub App credentials: private key + app_id + installation_id. The key
# never leaves the cluster; each run trades it for a 1-hour install token.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.secrets.githubApp.name }}
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
spec:
  itemPath: "{{ .Values.secrets.githubApp.itemPath }}"

---
domain: ""

authentik:
  authentik:
    log_level: info
    # secret_key, postgresql.password, redis.password, email.username/password
    # deliberately ABSENT: injected as AUTHENTIK_* env from 1P-synced secrets.
    postgresql:
      host: main-db-rw.database.svc.cluster.local
      port: "5432"
      name: authentik
      user: authentik
    redis:
      host: redis.redis.svc.cluster.local
    email:
      host: smtp.resend.com
      port: 465
      username: resend
      use_tls: false
      use_ssl: true

  postgresql:
    enabled: false
  redis:
    enabled: false

  global:
    envFrom:
      # domain-dependent env (AUTHENTIK_HOST, EMAIL__FROM): values files can't
      # template, so a chart template renders this ConfigMap
      - configMapRef:
          name: authentik-domain-env
    env:
      - name: AUTHENTIK_SECRET_KEY
        valueFrom: {secretKeyRef: {name: authentik-secrets, key: secret_key}}
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom: {secretKeyRef: {name: authentik-secrets, key: db_password}}
      - name: AUTHENTIK_REDIS__PASSWORD
        valueFrom: {secretKeyRef: {name: redis-credentials, key: password}}
      - name: AUTHENTIK_EMAIL__PASSWORD
        valueFrom: {secretKeyRef: {name: resend-smtp, key: password}}
      - name: AUTHENTIK_EMAIL__HOST
        valueFrom: {secretKeyRef: {name: resend-smtp, key: host}}
      - name: AUTHENTIK_EMAIL__PORT
        valueFrom: {secretKeyRef: {name: resend-smtp, key: port-number}}
      - name: AUTHENTIK_EMAIL__USERNAME
        valueFrom: {secretKeyRef: {name: resend-smtp, key: username}}
      - name: AUTHENTIK_BOOTSTRAP_EMAIL
        valueFrom: {secretKeyRef: {name: authentik-secrets, key: bootstrap_email}}
      - name: AUTHENTIK_BOOTSTRAP_PASSWORD
        valueFrom: {secretKeyRef: {name: authentik-secrets, key: bootstrap_password}}
      # OIDC credential inversion — consumed by blueprints via !Env
      - name: AUTHENTIK_GITEA_CLIENT_ID
        valueFrom: {secretKeyRef: {name: gitea-oidc-creds, key: key}}
      - name: AUTHENTIK_GITEA_CLIENT_SECRET
        valueFrom: {secretKeyRef: {name: gitea-oidc-creds, key: secret}}
      - name: AUTHENTIK_HOMARR_CLIENT_ID
        valueFrom: {secretKeyRef: {name: homarr-oidc-creds, key: oidc_client}}
      - name: AUTHENTIK_HOMARR_CLIENT_SECRET
        valueFrom: {secretKeyRef: {name: homarr-oidc-creds, key: oidc_secret}}
      - name: AUTHENTIK_PAPERLESS_CLIENT_ID
        valueFrom: {secretKeyRef: {name: paperless-oidc-creds, key: oidc_client}}
      - name: AUTHENTIK_PAPERLESS_CLIENT_SECRET
        valueFrom: {secretKeyRef: {name: paperless-oidc-creds, key: oidc_secret}}
      - name: AUTHENTIK_ARGOCD_CLIENT_ID
        valueFrom: {secretKeyRef: {name: argocd-oidc, key: oidc_client}}
      - name: AUTHENTIK_ARGOCD_CLIENT_SECRET
        valueFrom: {secretKeyRef: {name: argocd-oidc, key: password}}
      - name: AUTHENTIK_GRAFANA_OIDC_CLIENT_ID
        valueFrom: {secretKeyRef: {name: grafana-oidc-creds, key: oidc_client}}
      - name: AUTHENTIK_GRAFANA_OIDC_CLIENT_SECRET
        valueFrom: {secretKeyRef: {name: grafana-oidc-creds, key: password}}
      # SAML signing pair inversion: Kimai pins this certificate in its own
      # config, so it must survive a rebuild (a self-signed one would not).
      - name: AUTHENTIK_KIMAI_SAML_CERT
        valueFrom: {secretKeyRef: {name: kimai-saml-signing, key: certificate}}
      - name: AUTHENTIK_KIMAI_SAML_KEY
        valueFrom: {secretKeyRef: {name: kimai-saml-signing, key: private_key}}

  server:
    # kube-linter exception on the Deployment object only (no rollout).
    deploymentAnnotations:
      ignore-check.kube-linter.io/no-read-only-root-fs: >-
        TODO(lint), see docs/todo.md "Fix linting issues": authentik server is SSO for everything;
        test a read-only root separately.
    volumes:
      - name: blueprints
        configMap: {name: authentik-blueprints}
    volumeMounts:
      - name: blueprints
        mountPath: /blueprints/custom
    ingress:
      enabled: false   # house style: templated IngressRoute (rate-limited)
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}

  worker:
    # kube-linter exception on the Deployment object only (no rollout).
    deploymentAnnotations:
      ignore-check.kube-linter.io/no-read-only-root-fs: >-
        TODO(lint), see docs/todo.md "Fix linting issues": authentik worker is SSO for everything;
        test a read-only root separately.
    volumes:
      - name: blueprints
        configMap: {name: authentik-blueprints}
    volumeMounts:
      - name: blueprints
        mountPath: /blueprints/custom
    livenessProbe:
      exec: {command: [ak, healthcheck]}
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 5
    readinessProbe:
      exec: {command: [ak, healthcheck]}
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 3
    startupProbe:
      exec: {command: [ak, healthcheck]}
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 60
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}

# ALL Authentik blueprints live here (identity owns the auth contract):
# blueprints must be MOUNTED into authentik pods — same namespace + static
# mount list — so per-app-chart blueprints can't work. Apps stay coupled only
# at the credential level via shared 1P OIDC items.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: identity
data:
  blueprint-copyparty.yaml: |
    ---
    version: 1
    metadata:
      name: Copyparty Filer
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: provider-copyparty
        identifiers:
          name: Copyparty Filer
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: "https://files.{{ .Values.domain }}"
          access_token_validity: hours=24

      - model: authentik_core.application
        state: present
        id: app-copyparty
        identifiers:
          slug: copyparty
        attrs:
          name: Copyparty
          provider: !KeyOf provider-copyparty
          meta_launch_url: "https://files.{{ .Values.domain }}"
          meta_description: "File sharing and storage"
          meta_icon: ""
          policy_engine_mode: any
          group: "Storage"

      - model: authentik_outposts.outpost
        state: present
        id: outpost-copyparty
        identifiers:
          name: Copyparty Filer Outpost
        attrs:
          type: proxy
          providers:
            - !KeyOf provider-copyparty
          # Authentik-managed outpost: authentik deploys ak-outpost-copyparty
          # into copyparty; the manual outpost Deployment/token machinery is gone.
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, "Local Kubernetes Cluster"]]
          config:
            kubernetes_namespace: copyparty
            object_naming_template: ak-outpost-copyparty
            authentik_host: http://identity-authentik-server.identity.svc.cluster.local
            authentik_host_browser: "https://auth.{{ .Values.domain }}"
  blueprint-default-login-customization.yaml: |
    # Customizes Authentik's built-in default login identification stage to show
    # the "Forgot password?" link on the user/email prompt instead of the password prompt.
    #
    # Depends on: recovery-email blueprint (for default-recovery-flow)
    version: 1
    metadata:
      labels:
        blueprints.goauthentik.io/instantiate: "true"
      name: Default login customization
    entries:
      # --- Passwordless Flow ---
      - identifiers:
          slug: default-passwordless-flow
        id: default-passwordless-flow
        model: authentik_flows.flow
        attrs:
          name: Default passwordless flow
          title: Welcome back!
          designation: authentication
          authentication: require_unauthenticated

      # --- WebAuthn Validation Stage ---
      - identifiers:
          name: default-passwordless-webauthn-validation
        id: default-passwordless-webauthn-validation
        model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        attrs:
          device_classes:
            - webauthn
          not_configured_action: deny

      # --- User Login Stage ---
      - identifiers:
          name: default-passwordless-user-login
        id: default-passwordless-user-login
        model: authentik_stages_user_login.userloginstage

      # --- Flow Stage Bindings ---
      - identifiers:
          target: !KeyOf default-passwordless-flow
          stage: !KeyOf default-passwordless-webauthn-validation
          order: 10
        model: authentik_flows.flowstagebinding

      - identifiers:
          target: !KeyOf default-passwordless-flow
          stage: !KeyOf default-passwordless-user-login
          order: 20
        model: authentik_flows.flowstagebinding

      # --- Customize Default Identification Stage ---
      - identifiers:
          name: default-authentication-identification
        model: authentik_stages_identification.identificationstage
        attrs:
          user_fields:
            - email
            - username
          recovery_flow: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
          passwordless_flow: !KeyOf default-passwordless-flow
          pretend_user_exists: true
          enable_remember_me: true
  blueprint-enforce-mfa-authenticator.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      labels:
        blueprints.goauthentik.io/instantiate: "true"
      name: Enforce MFA Authentication
    entries:
      # --- Email OTP Setup Flow ---
      - model: authentik_flows.flow
        state: present
        identifiers:
          slug: email-mfa-setup-flow
        attrs:
          name: email-mfa-setup-flow
          title: Configure Email OTP
          designation: stage_configuration
          authentication: require_authenticated
      # --- Email OTP Setup Stage ---
      - model: authentik_stages_authenticator_email.authenticatoremailstage
        state: present
        identifiers:
          name: email-mfa-setup
        attrs:
          friendly_name: Email (One-Time Code)
          configure_flow: !Find [authentik_flows.flow, [slug, email-mfa-setup-flow]]
          use_global_settings: true
          subject: Your sign-in code
          template: email/email_otp.html
          token_expiry: minutes=10
      # --- MFA Validation Stage ---
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          not_configured_action: configure
          user_verification: required
          configuration_stages:
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
            - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
            - !Find [authentik_stages_authenticator_email.authenticatoremailstage, [name, email-mfa-setup]]
      # --- Bind to invitation enrollment flow ---
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, link-invitation-enrollment]]
          stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
          order: 25
        attrs:
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      # --- Move existing login stage to after MFA validation ---
    # --- Ensure login stage is at order 3 (after MFA at order 2) ---
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
          stage: !Find [authentik_stages_user_login.userloginstage, [name, default-source-enrollment-login]]
        attrs:
          order: 3
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      # --- Insert MFA validation into source enrollment before login ---
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
          stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
          order: 2
        attrs:
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
  blueprint-enrollment-invitation.yaml: |
    # Simplified to a single invitation-gated enrollment flow.
    # Example invitations removed — create invitations via the Admin UI.
    version: 1
    metadata:
      labels:
        blueprints.goauthentik.io/instantiate: "true"
      name: Link Invitation-based Enrollment
    entries:
      # --- Flow ---
      - identifiers:
          slug: link-invitation-enrollment
        model: authentik_flows.flow
        id: invitation-enrollment-flow
        attrs:
          name: Invitation Enrollment Flow
          title: Welcome! Complete your enrollment
          designation: enrollment
          authentication: require_unauthenticated

      # --- Invitation Stage ---
      - identifiers:
          name: invitation-enrollment-invitation
        id: invitation-stage
        model: authentik_stages_invitation.invitationstage
        attrs:
          continue_flow_without_invitation: false

      # --- Prompt Fields ---
      - identifiers:
          name: invitation-enrollment-field-name
        id: prompt-field-name
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: name
          label: Full Name
          type: text
          required: true
          placeholder: Name
          placeholder_expression: false
          order: 0

      - identifiers:
          name: invitation-enrollment-field-email
        id: prompt-field-email
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: email
          label: Email
          type: email
          required: true
          placeholder: Email
          placeholder_expression: false
          order: 1

      - identifiers:
          name: invitation-enrollment-field-username
        id: prompt-field-username
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: username
          label: Username
          type: username
          required: true
          placeholder: Username
          placeholder_expression: false
          order: 2

      - identifiers:
          name: invitation-enrollment-field-password
        id: prompt-field-password
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          placeholder_expression: false
          order: 3

      - identifiers:
          name: invitation-enrollment-field-password-repeat
        id: prompt-field-password-repeat
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          placeholder_expression: false
          order: 4

      # --- Prompt Stages ---
      - identifiers:
          name: invitation-enrollment-prompt-credentials
        id: prompt-stage-credentials
        model: authentik_stages_prompt.promptstage
        attrs:
          fields:
            - !KeyOf prompt-field-email
            - !KeyOf prompt-field-username
            - !KeyOf prompt-field-name
            - !KeyOf prompt-field-password
            - !KeyOf prompt-field-password-repeat
          validation_policies: 
            - !Find [authentik_policies_password.passwordpolicy, [name, default-password-policy]]

      # --- User Write Stage ---
      - identifiers:
          name: invitation-enrollment-user-write
        id: user-write-stage
        model: authentik_stages_user_write.userwritestage
        attrs:
          user_creation_mode: always_create
          user_type: internal
          user_path_template: users

      # --- Flow Stage Bindings ---
      - identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf invitation-stage
          order: 5
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true

      - identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf prompt-stage-credentials
          order: 10
        model: authentik_flows.flowstagebinding

      - identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !KeyOf user-write-stage
          order: 20
        model: authentik_flows.flowstagebinding

      - identifiers:
          target: !KeyOf invitation-enrollment-flow
          stage: !Find [authentik_stages_user_login.userloginstage, [name, default-source-enrollment-login]]
          order: 100
        model: authentik_flows.flowstagebinding
  blueprint-forward-auth-apps.yaml: |
    # Forward-auth proxy providers for applications behind Traefik.
    # All forward-auth providers must be listed here so the embedded outpost
    # providers list (which is REPLACED, not merged) stays complete.
    version: 1
    metadata:
      labels:
        blueprints.goauthentik.io/instantiate: "true"
      name: Forward Auth Applications
    entries:
      # ============================================================
      # Traefik Dashboard
      # ============================================================
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: provider-traefik-dashboard
        identifiers:
          name: Traefik Dashboard
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: "https://{{ .Values.domain }}"

      - model: authentik_core.application
        state: present
        id: app-traefik-dashboard
        identifiers:
          slug: traefik-dashboard
        attrs:
          name: Traefik Dashboard
          provider: !KeyOf provider-traefik-dashboard
          meta_launch_url: "https://{{ .Values.domain }}/dashboard/"
          policy_engine_mode: any



      # ============================================================
      # Gatus (health dashboard) — internal tool, auth at the edge
      # ============================================================
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: provider-gatus-fwd
        identifiers:
          name: Gatus Forward Auth
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: "https://gatus.{{ .Values.domain }}"

      - model: authentik_core.application
        state: present
        id: app-gatus-fwd
        identifiers:
          slug: gatus-forward-auth
        attrs:
          name: Gatus
          provider: !KeyOf provider-gatus-fwd
          meta_launch_url: "https://gatus.{{ .Values.domain }}/"
          policy_engine_mode: any

      # ============================================================
      # Homarr (dashboard) — internal tool, auth at the edge
      # ============================================================
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: provider-homarr-fwd
        identifiers:
          name: Homarr Forward Auth
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: "https://dashboard.{{ .Values.domain }}"

      - model: authentik_core.application
        state: present
        id: app-homarr-fwd
        identifiers:
          slug: homarr-forward-auth
        attrs:
          name: Homarr (edge auth)
          provider: !KeyOf provider-homarr-fwd
          meta_launch_url: "https://dashboard.{{ .Values.domain }}/"
          policy_engine_mode: any

      # ============================================================
      # Tenancy groups (docs/PLAN.md H2.4)
      # 'internal' gates staff-only tools at the edge. Client access
      # is modeled as client-<name> groups bound per application.
      # ============================================================
      - model: authentik_core.group
        state: present
        id: group-internal
        identifiers:
          name: internal

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !KeyOf app-traefik-dashboard
        attrs:
          group: !KeyOf group-internal

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !KeyOf app-gatus-fwd
        attrs:
          group: !KeyOf group-internal

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !KeyOf app-homarr-fwd
        attrs:
          group: !KeyOf group-internal

      # ============================================================
      # Embedded Outpost (all forward-auth providers)
      # ============================================================
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          managed: goauthentik.io/outposts/embedded
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, "Traefik Dashboard"]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, "Gatus Forward Auth"]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, "Homarr Forward Auth"]]
          config:
            authentik_host: "https://auth.{{ .Values.domain }}"
  blueprint-gitea.yaml: |
    ---
    version: 1
    metadata:
      name: Gitea
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: provider-gitea
        identifiers:
          name: Gitea OIDC Provider
        attrs:
          client_type: confidential
          # Credential inversion: pre-generated in 1P, injected via env; the
          # consuming app reads the same 1P item. No extraction, ever.
          client_id: !Env AUTHENTIK_GITEA_CLIENT_ID
          client_secret: !Env AUTHENTIK_GITEA_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          redirect_uris:
            - matching_mode: strict
              url: https://git.{{ .Values.domain }}/user/oauth2/authentik/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          access_code_validity: minutes=1
          access_token_validity: hours=24
          grant_types:
            - authorization_code
            - refresh_token
          include_claims_in_id_token: true
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
          scope_set:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

      - model: authentik_core.application
        state: present
        identifiers:
          name: Gitea
          slug: gitea
        attrs:
          group: Services
          provider: !KeyOf provider-gitea
          meta_launch_url: https://git.{{ .Values.domain }}
  blueprint-homarr.yaml: |
    ---
    version: 1
    metadata:
      name: Homarr
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: provider-homarr
        identifiers:
          name: Homarr OIDC Provider
        attrs:
          client_type: confidential
          # Credential inversion: pre-generated in 1P, injected via env; the
          # consuming app reads the same 1P item. No extraction, ever.
          client_id: !Env AUTHENTIK_HOMARR_CLIENT_ID
          client_secret: !Env AUTHENTIK_HOMARR_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          redirect_uris:
            - matching_mode: strict
              url: https://dashboard.{{ .Values.domain }}/api/auth/callback/oidc
            - matching_mode: strict
              url: http://localhost:3000/api/auth/callback/oidc
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          access_code_validity: minutes=1
          access_token_validity: hours=24
          grant_types:
            - authorization_code
            - refresh_token
          include_claims_in_id_token: true
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
          scope_set:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

      - model: authentik_core.application
        state: present
        identifiers:
          name: Homarr
          slug: homarr
        attrs:
          group: Services
          provider: !KeyOf provider-homarr
          meta_launch_url: https://dashboard.{{ .Values.domain }}
  blueprint-infrastructure-group.yaml: |
    version: 1
    metadata:
      labels:
        blueprints.goauthentik.io/instantiate: "true"
      name: Infrastructure Admin Group
    entries:
      - identifiers:
          name: infrastructure
        model: authentik_core.group
        id: infrastructure-group
        attrs:
          name: infrastructure
          is_superuser: true
        state: present
  blueprint-ldap.yaml: |
    ---
    version: 1
    metadata:
      name: Internal Services LDAP
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Wildcard certificate arrives via authentik's cert DISCOVERY, not blueprint
      # embedding: the wildcard TLS secret is mounted at /certs/wildcard (see chart
      # values), authentik imports it as a keypair named "wildcard". No key
      # material ever renders into this ConfigMap.

      # ─── Kubernetes Service Connection ─────────────────────────────────────────
      - model: authentik_outposts.kubernetesserviceconnection
        id: k8s-service-connection
        state: present
        identifiers:
          name: Local Kubernetes Cluster
        attrs:
          local: true

      # ─── Password-Only Bind Flow ────────────────────────────────────────────────
      - identifiers:
          slug: ldap-bind-flow
        model: authentik_flows.flow
        id: flow-ldap-bind
        state: present
        attrs:
          name: LDAP Bind Flow
          title: LDAP Authentication
          designation: authentication
          authentication: require_unauthenticated

      # ─── Flow Stage Bindings ────────────────────────────────────────────
      - identifiers:
          target: !KeyOf flow-ldap-bind
          stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
          order: 10
        model: authentik_flows.flowstagebinding
        state: present

      - identifiers:
          target: !KeyOf flow-ldap-bind
          stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
          order: 20
        model: authentik_flows.flowstagebinding
        state: present

      # ─── LDAP Provider ──────────────────────────────────────────────────────────
      - model: authentik_providers_ldap.ldapprovider
        id: provider-internal-ldap
        state: present
        identifiers:
          name: Internal Services LDAP
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, ldap-bind-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          base_dn: dc=ldap,dc=goauthentik,dc=io
          search_mode: cached
          certificate: !Find [authentik_crypto.certificatekeypair, [name, wildcard]]
          tls_server_name: ldap.{{ .Values.domain }}

      # ─── Application ────────────────────────────────────────────────────────────
      - model: authentik_core.application
        id: app-internal-ldap
        state: present
        identifiers:
          name: Internal Services LDAP
          slug: internal-services-ldap
        attrs:
          provider: !Find [authentik_providers_ldap.ldapprovider, [name, Internal Services LDAP]]

      # ─── LDAP Outpost ──────────────────────────────────────────────────────────
      - model: authentik_outposts.outpost
        id: outpost-ldap
        state: present
        persistent: true
        identifiers:
          name: LDAP
        attrs:
          type: ldap
          service_connection: !KeyOf k8s-service-connection
          providers:
            - !Find [authentik_providers_ldap.ldapprovider, [name, Internal Services LDAP]]
          config:
            authentik_host: http://identity-authentik-server.identity.svc.cluster.local
            log_level: info

      # ─── LDAP Read-Only Group ──────────────────────────────────────────────────
      - model: authentik_core.group
        id: group-ldap-ro
        state: present
        identifiers:
          name: ldap-ro-service-accounts
        attrs:
          users:
            - !Find [authentik_core.user, [username, sssd-ldap-user]]

      # ─── Service Account Users ──────────────────────────────────────────────────
      - model: authentik_core.user
        id: user-sssd
        state: present
        identifiers:
          username: sssd-ldap-user
        attrs:
          name: SSSD LDAP Service Account
          type: service_account
          is_active: true
          password: !File /blueprints/secrets/sssd-password
  blueprint-paperless.yaml: |
    ---
    version: 1
    metadata:
      name: Paperless-ngx
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: paperless-provider
        identifiers:
          name: Paperless-ngx
        attrs:
          name: Paperless-ngx
          client_type: confidential
          # Credential inversion: pre-generated in 1P, injected via env; the
          # consuming app reads the same 1P item. No extraction, ever.
          client_id: !Env AUTHENTIK_PAPERLESS_CLIENT_ID
          client_secret: !Env AUTHENTIK_PAPERLESS_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://paperless.{{ .Values.domain }}/accounts/oidc/authentik/login/callback/
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          access_code_validity: minutes=5
          access_token_validity: hours=24
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
          scope_set:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

      - model: authentik_core.application
        state: present
        identifiers:
          name: Paperless-ngx
          slug: paperless
        attrs:
          group: Services
          provider: !KeyOf paperless-provider
          meta_launch_url: https://paperless.{{ .Values.domain }}
          meta_description: Document management system
  blueprint-password-policy.yaml: |
    version: 1
    metadata:
      labels:
        blueprints.goauthentik.io/instantiate: "true"
      name: Password Policy
    entries:
      - model: authentik_policies_password.passwordpolicy
        state: present
        identifiers:
          name: default-password-policy
        id: default-password-policy
        attrs:
          check_zxcbnm: true
          zxcvbn_score_threshold: 2
          check_static_rules: true
          length_min: 8
          amount_digits: 1
          amount_lowercase: 1
          amount_uppercase: 1
          amount_symbols: 1
          error_message: >-
            Password needs to be 8 characters or longer. It must have at least
            1 upper case, 1 lower case, 1 number digit, and 1 special character.
          symbol_charset: "!\"#$%&''()*+,-./:;<=>?@[\\]^_`{|}~"

      - model: authentik_policies_password.passwordpolicy
        state: absent
        identifiers:
          name: default-password-change-password-policy

      - model: authentik_stages_prompt.promptstage
        state: present
        identifiers:
          name: default-password-change-prompt
        attrs:
          validation_policies:
            - !KeyOf default-password-policy
  blueprint-recovery-email.yaml: |
    # Based on the official "Example - Recovery with email verification" blueprint
    # https://github.com/goauthentik/authentik/blob/main/blueprints/example/flows-recovery-email-verification.yaml
    #
    # After applying, set this as the default recovery flow for your brand to
    # enable the "Email recovery link" button in Directory > Users.
    version: 1
    metadata:
      labels:
        blueprints.goauthentik.io/instantiate: "true"
      name: Recovery with email verification
    entries:
      # --- Flow ---
      - identifiers:
          slug: default-recovery-flow
        id: default-recovery-flow
        model: authentik_flows.flow
        attrs:
          name: Default recovery flow
          title: Reset your password
          designation: recovery
          authentication: require_unauthenticated

      # --- Policy: skip identification if user already restored ---
      - identifiers:
          name: default-recovery-skip-if-restored
        id: default-recovery-skip-if-restored
        model: authentik_policies_expression.expressionpolicy
        attrs:
          expression: |
            return not request.context.get('is_restored', False)

      # --- Email Stage ---
      - identifiers:
          name: default-recovery-email
        id: default-recovery-email
        model: authentik_stages_email.emailstage
        attrs:
          activate_user_on_success: true
          use_global_settings: true
          token_expiry: minutes=30
          subject: Password Reset
          template: email/password_reset.html
          recovery_max_attempts: 5
          recovery_cache_timeout: minutes=5

      # --- User Write Stage (never creates users) ---
      - identifiers:
          name: default-recovery-user-write
        id: default-recovery-user-write
        model: authentik_stages_user_write.userwritestage
        attrs:
          user_creation_mode: never_create

      # --- Identification Stage ---
      - identifiers:
          name: default-recovery-identification
        id: default-recovery-identification
        model: authentik_stages_identification.identificationstage
        attrs:
          user_fields:
            - email
            - username

      # --- User Login Stage ---
      - identifiers:
          name: default-recovery-user-login
        id: default-recovery-user-login
        model: authentik_stages_user_login.userloginstage

      # --- Flow Stage Bindings ---
      - identifiers:
          target: !KeyOf default-recovery-flow
          stage: !KeyOf default-recovery-identification
          order: 10
        model: authentik_flows.flowstagebinding
        id: flow-binding-identification
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry

      - identifiers:
          target: !KeyOf default-recovery-flow
          stage: !KeyOf default-recovery-email
          order: 20
        model: authentik_flows.flowstagebinding
        id: flow-binding-email
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry

      - identifiers:
          target: !KeyOf default-recovery-flow
          stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
          order: 25
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry

      - identifiers:
          target: !KeyOf default-recovery-flow
          stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
          order: 30
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry

      - identifiers:
          target: !KeyOf default-recovery-flow
          stage: !KeyOf default-recovery-user-write
          order: 40
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry

      - identifiers:
          target: !KeyOf default-recovery-flow
          stage: !KeyOf default-recovery-user-login
          order: 100
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry

      # --- Policy Bindings ---
      - identifiers:
          policy: !KeyOf default-recovery-skip-if-restored
          target: !KeyOf flow-binding-identification
          order: 0
        model: authentik_policies.policybinding
        attrs:
          negate: false
          enabled: true
          timeout: 30

      - identifiers:
          policy: !KeyOf default-recovery-skip-if-restored
          target: !KeyOf flow-binding-email
          order: 0
        model: authentik_policies.policybinding
        attrs:
          negate: false
          enabled: true
          timeout: 30

      # --- Set as default brand recovery flow ---
      - identifiers:
          domain: authentik-default
          default: true
        model: authentik_brands.brand
        attrs:
          flow_recovery: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
  blueprint-seaweedfs-filer.yaml: |
    ---
    version: 1
    metadata:
      name: SeaweedFS Filer
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: provider-seaweedfs-filer
        identifiers:
          name: SeaweedFS Filer
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: "https://filer-s3.{{ .Values.domain }}"

      - model: authentik_core.application
        state: present
        id: app-seaweedfs-filer
        identifiers:
          slug: filer-application
        attrs:
          name: SeaweedFS Filer
          provider: !KeyOf provider-seaweedfs-filer
          meta_launch_url: "https://filer-s3.{{ .Values.domain }}/"
          policy_engine_mode: any

      - model: authentik_outposts.outpost
        state: present
        id: outpost-seaweedfs-filer
        identifiers:
          name: SeaweedFS Filer Outpost
        attrs:
          type: proxy
          providers:
            - !KeyOf provider-seaweedfs-filer
          # Authentik-managed outpost: authentik deploys ak-outpost-seaweedfs-filer
          # into seaweedfs; the manual outpost Deployment/token machinery is gone.
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, "Local Kubernetes Cluster"]]
          config:
            kubernetes_namespace: seaweedfs
            object_naming_template: ak-outpost-seaweedfs-filer
            authentik_host: http://identity-authentik-server.identity.svc.cluster.local
            authentik_host_browser: "https://auth.{{ .Values.domain }}"

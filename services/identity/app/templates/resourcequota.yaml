---
# ResourceQuota for identity namespace (Authentik)
# Limits total resource consumption for Authentik workloads
apiVersion: v1
kind: ResourceQuota
metadata:
  name: identity-quota
  namespace: identity
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: identity-provider
spec:
  hard:
    requests.cpu: "2000m"
    requests.memory: "4Gi"
    limits.cpu: "4000m"
    limits.memory: "8Gi"
    persistentvolumeclaims: "5"
    configmaps: "20"
    secrets: "20"
    services: "10"

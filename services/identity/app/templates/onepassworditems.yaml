{{- range $name, $item := dict
  "authentik-secrets"    "Authentik Deployment Secrets"
  "redis-credentials"    "Redis Password"
  "resend-smtp"          "Resend.com SMTP"
  "gitea-oidc-creds"     "Gitea OIDC Creds"
  "homarr-oidc-creds"    "Homarr Secrets"
  "paperless-oidc-creds" "Paperless Secrets"
  "argocd-oidc"          "ArgoCD Secrets"
  "grafana-oidc-creds"   "Grafana OIDC"
  "kimai-saml-signing"   "Kimai SAML Signing" }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $name }}
  namespace: identity
spec:
  itemPath: "vaults/K3s Service Cluster/items/{{ $item }}"
{{- end }}

{{- range $name, $item := dict
  "authentik-secrets"    "Authentik Deployment Secrets"
  "redis-credentials"    "Redis Password"
  "resend-smtp"          "Resend.com SMTP"
  "gitea-oidc-creds"     "Gitea OIDC"
  "homarr-oidc-creds"    "Homarr OIDC"
  "paperless-oidc-creds" "Paperless OIDC" }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $name }}
  namespace: identity
spec:
  itemPath: "vaults/K3s Service Cluster/items/{{ $item }}"
{{- end }}

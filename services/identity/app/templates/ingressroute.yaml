apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: identity
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: "Host(`auth.{{ .Values.domain }}`)"
      middlewares:
        - name: authentik-rate-limit
          namespace: identity
      services:
        - name: authentik-server
          port: 80
  tls:
    secretName: wildcard-identity-tls

# NetworkPolicies for the identity namespace.
#
# Model: default-deny ingress per namespace, then explicit
# allows. Traefik runs as a hostNetwork DaemonSet, so ingress from Traefik
# arrives with a NODE ip as source — matched via ipBlock on the private net
# (192.168.0.0/16), not a podSelector. Kubelet probe traffic on some CNIs is
# sourced from the cni0 bridge IP (pod CIDR); K3s' embedded policy controller
# permits host-local probe traffic, but VERIFY on a canary namespace first
# before rolling this out cluster-wide.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: "identity"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Authentik is the auth hub: token validation, outposts, forward-auth (Traefik via hostNetwork), and every OIDC app talk to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authentik-clients
  namespace: "identity"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 192.168.0.0/16

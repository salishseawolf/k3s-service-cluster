[env]
# Authentik deployment secrets (shared infra vault)
AUTHENTIK_SECRET_KEY = "op://K3s Service Cluster/Authentik Deployment Secrets/secret_key"
AUTHENTIK_DB_PASSWORD = "op://K3s Service Cluster/Authentik Deployment Secrets/db_password"
AUTHENTIK_BOOTSTRAP_EMAIL = "op://K3s Service Cluster/Authentik Deployment Secrets/bootstrap_email"
AUTHENTIK_BOOTSTRAP_PASSWORD = "op://K3s Service Cluster/Authentik Deployment Secrets/bootstrap_password"
# SMTP relay credentials (shared infra vault)
AUTHENTIK_SMTP_HOST = "op://K3s Service Cluster/Resend.com SMTP/host"
AUTHENTIK_SMTP_PORT = "op://K3s Service Cluster/Resend.com SMTP/port number"
AUTHENTIK_SMTP_USERNAME = "op://K3s Service Cluster/Resend.com SMTP/username"
AUTHENTIK_SMTP_PASSWORD = "op://K3s Service Cluster/Resend.com SMTP/password"

[tasks.deploy]
description = "Deploy identity service"
run = "mise run //services/identity/ansible:deploy"
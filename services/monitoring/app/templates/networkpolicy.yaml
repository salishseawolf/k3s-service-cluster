---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow intra-namespace communication (Grafana → Prometheus/Loki, Alloy → Loki, etc.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: monitoring
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  policyTypes:
    - Ingress
---
# Allow Grafana ingress from Traefik (hostNetwork DaemonSet — traffic arrives via node IPs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - port: 3000
          protocol: TCP
  policyTypes:
    - Ingress
---
# Prometheus needs to reach the Kubernetes API for service discovery,
# kube-dns for name resolution, kubelet for node metrics, and all
# scrape targets on the pod network (KSM, Alertmanager, exporters, etc.).
# Without broad egress, SD fails and Prometheus discovers zero targets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    # DNS (kube-dns runs at the ClusterIP service CIDR)
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # Kubernetes API server (service CIDR + node CIDR for external endpoints)
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - { port: 443, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - { port: 6443, protocol: TCP }
        - { port: 10250, protocol: TCP }
    # Scrape targets on the pod network
    - to:
        - ipBlock:
            cidr: 10.42.0.0/16

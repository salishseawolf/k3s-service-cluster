# VolSync restic backups of monitoring PVCs (hourly). Only Loki has a PVC since
# 2026-10-13; Prometheus and Alertmanager run on emptyDir (not backed up).
# Shared B2 key scoped to volsync/monitoring/; each PVC gets its own repo.
# The actual PVC names from kube-prometheus-stack StatefulSets are long;
# we keep the 1Password items named after the short names so they remain human-friendly.
{{- range $item := list
  (dict "actual" "storage-monitoring-loki-0" "short" "loki-data" "paused" false "minute" "35") }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: volsync-b2-{{ $item.short }}
  namespace: monitoring
spec:
  itemPath: "vaults/K3s Service Cluster/items/VolSync B2 {{ $item.short }}"
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: {{ $item.short }}
  namespace: monitoring
spec:
  # Paused for the SeaweedFS migration (2026-10): until this PVC is restored
  # onto real SeaweedFS, a mover would back up an empty volume. Unpause per
  # app after its restore is verified ("paused" per item above).
  paused: {{ $item.paused }}
  sourcePVC: {{ $item.actual }}
  trigger:
    schedule: "{{ $item.minute }} * * * *"
  restic:
    repository: volsync-b2-{{ $item.short }}
    copyMethod: Direct
    pruneIntervalDays: 7
    retain:
      daily: 30
    cacheCapacity: 2Gi
    # Not local-path: that pins the cache to one node, and copyMethod Direct
    # runs the mover on the app pod's node, so a rescheduled app deadlocked
    # its backup ("volume node affinity conflict"). SeaweedFS follows the pod.
    cacheStorageClassName: seaweedfs-storage
    moverSecurityContext:
      runAsUser: 0
    unlock: "prometheus-2026-08-10"
{{- end }}

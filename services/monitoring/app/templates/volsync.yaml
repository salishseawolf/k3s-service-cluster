# VolSync restic backups of monitoring PVCs (hourly; staggered schedules).
# Shared B2 key scoped to volsync/monitoring/; each PVC gets its own repo.
# The actual PVC names from kube-prometheus-stack StatefulSets are long;
# we keep the 1Password items named after the short names so they remain human-friendly.
{{- range $item := list
  (dict "actual" "prometheus-prometheus-prometheus-db-prometheus-prometheus-prometheus-0" "short" "prometheus-main-db" "minute" "5")
  (dict "actual" "alertmanager-prometheus-alertmanager-db-alertmanager-prometheus-alertmanager-0" "short" "alertmanager-db" "minute" "20")
  (dict "actual" "storage-monitoring-loki-0" "short" "loki-data" "minute" "35") }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: volsync-b2-{{ $item.short }}
  namespace: monitoring
spec:
  itemPath: "vaults/K3s Service Cluster/items/VolSync B2 {{ $item.short }}"
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: {{ $item.short }}
  namespace: monitoring
spec:
  sourcePVC: {{ $item.actual }}
  trigger:
    schedule: "{{ $item.minute }} * * * *"
  restic:
    repository: volsync-b2-{{ $item.short }}
    copyMethod: Direct
    pruneIntervalDays: 7
    retain:
      daily: 30
    cacheCapacity: 2Gi
    # Not local-path: that pins the cache to one node, and copyMethod Direct
    # runs the mover on the app pod's node, so a rescheduled app deadlocked
    # its backup ("volume node affinity conflict"). SeaweedFS follows the pod.
    cacheStorageClassName: seaweedfs-storage
    moverSecurityContext:
      runAsUser: 0
    unlock: "prometheus-2026-08-10"
{{- end }}

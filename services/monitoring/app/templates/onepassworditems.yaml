---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: grafana-admin-password
  namespace: monitoring
spec:
  itemPath: "vaults/K3s Service Cluster/items/Grafana Admin Password"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: grafana-oidc-creds
  namespace: monitoring
spec:
  itemPath: "vaults/K3s Service Cluster/items/Grafana OIDC"
---
# Alertmanager's SMTP login for alert email (same Resend item identity uses).
# Mounted into Alertmanager via alertmanagerSpec.secrets; only the
# `password` key is read (auth_password_file).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: alertmanager-smtp
  namespace: monitoring
spec:
  itemPath: "vaults/K3s Service Cluster/items/Resend.com SMTP"

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    gatus.io/enabled: "true"
    gatus.io/group: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`monitor.salishseawolf.com`)
      middlewares:
        - name: authentik-forward-auth
          namespace: identity
      services:
        - kind: Service
          name: monitoring-grafana
          namespace: monitoring
          port: 80  # Grafana serves on port 80 inside the chart (default grafana.ini server port)
  # Traefik's default TLSStore serves the wildcard certificate. Naming the
  # secret here made Traefik look for it in this namespace, where it doesn't
  # exist, and log an error on every config reload.
  tls: {}
---
# Alertmanager UI (no login of its own): behind the same Authentik edge gate
# ('internal' group). Alert emails link here via alertmanagerSpec.externalUrl.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`alertmanager.{{ .Values.domain }}`)
      middlewares:
        - name: authentik-forward-auth
          namespace: identity
      services:
        - kind: Service
          name: prometheus-alertmanager
          namespace: monitoring
          port: 9093
  tls: {}

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    gatus.io/enabled: "true"
    gatus.io/group: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`monitor.salishseawolf.com`)
      services:
        - kind: Service
          name: monitoring-grafana
          namespace: monitoring
          port: 80  # Grafana serves on port 80 inside the chart (default grafana.ini server port)
  tls:
    secretName: wildcard-salishseawolf-com-tls

---
# VolSync metrics require RBAC auth. The operator-created ServiceMonitor
# doesn't include a bearer token, so we add one here targeting the same
# volsync-metrics service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: volsync-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: volsync
spec:
  endpoints:
    - interval: 30s
      path: /metrics
      port: https
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/instance: volsync
  namespaceSelector:
    matchNames:
      - volsync-system

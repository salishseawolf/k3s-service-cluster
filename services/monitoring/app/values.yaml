---
# kube-prometheus-stack — workloads only (CRDs are in platform/monitoring-crd)
kps:
  fullnameOverride: prometheus

  prometheusOperator:
    enabled: true
    createCustomResource: false  # CRDs managed by platform app
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false

  prometheus:
    enabled: true
    ingress:
      enabled: false
    prometheusSpec:
      # No PVC (2026-10-13): metrics history resets on every pod restart, by
      # choice. On SeaweedFS its FUSE client grew to 4.2 GB and OOM-starved
      # node-02. The emptyDir is on the node's root disk, so retention stays
      # well under its sizeLimit (the kubelet evicts the pod, not the node).
      retention: 7d
      retentionSize: 8GiB
      scrapeInterval: 60s
      externalLabels:
        cluster: salishseawolf
        environment: production
      storageSpec:
        emptyDir:
          sizeLimit: 10Gi
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2
          memory: 8Gi

  alertmanager:
    enabled: true
    ingress:
      enabled: false
    # Chart default config plus one opt-in email route: only alerts labelled
    # notify="email" (e.g. services/kimai/app/templates/prometheusrule.yaml)
    # are mailed; everything else still goes to the null receiver. Lists in
    # Helm values replace rather than merge, so the defaults are restated.
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers: ['severity = critical']
          target_matchers: ['severity =~ warning|info']
          equal: ['namespace', 'alertname']
        - source_matchers: ['severity = warning']
          target_matchers: ['severity = info']
          equal: ['namespace', 'alertname']
        - source_matchers: ['alertname = InfoInhibitor']
          target_matchers: ['severity = info']
          equal: ['namespace']
        - target_matchers: ['alertname = InfoInhibitor']
      route:
        group_by: ['namespace']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'null'
        routes:
          - receiver: 'null'
            matchers: ['alertname = "Watchdog"']
          - receiver: email
            matchers: ['notify = "email"']
            group_by: ['alertname', 'namespace']
      receivers:
        - name: 'null'
        - name: email
          email_configs:
            - to: admin@salishseawolf.com
              # Must be on the Resend-verified domain.
              from: alerts@salishseawolf.com
              # STARTTLS on Resend's alternate port. Not 465: Hetzner blocks
              # outbound 465 (and 25). Not 2465 (implicit TLS, as Authentik and
              # Kimai use): on any port but 465 that needs force_implicit_tls,
              # which prometheus-operator v0.89 (kube-prometheus-stack 82.x)
              # rejects; its strict config parse keeps the last good config.
              # require_tls (default true) refuses to log in unless STARTTLS
              # succeeds. See docs/todo.md for moving to 2465 later.
              smarthost: smtp.resend.com:2587
              auth_username: resend
              auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
              send_resolved: true
      templates:
        - '/etc/alertmanager/config/*.tmpl'
    alertmanagerSpec:
      # Base for the links in alert emails (default is the in-cluster Service
      # URL, unreachable from a browser). Served by the alertmanager
      # IngressRoute behind Authentik forward-auth. Literal domain: values
      # files can't template (same as grafana.ini root_url).
      externalUrl: https://alertmanager.salishseawolf.com
      # Mounted at /etc/alertmanager/secrets/<name>/<key>.
      secrets:
        - alertmanager-smtp
      # No PVC (2026-10-13): silences and the notification log reset on pod
      # restart (a still-firing alert may be emailed again).
      storage:
        emptyDir:
          sizeLimit: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

  grafana:
    enabled: true
    # kube-linter exception on the Deployment object only (no rollout).
    annotations:
      ignore-check.kube-linter.io/no-read-only-root-fs: >-
        TODO(lint), see docs/todo.md "Fix linting issues": chart supports a read-only root; grafana
        writes /var/lib/grafana and /tmp.
    forceDeployDatasources: true
    forceDeployDashboard: true
    adminPassword: ""
    admin:
      existingSecret: grafana-admin-password
      userKey: username
      passwordKey: password
    ingress:
      enabled: false
    sidecar:
      datasources:
        defaultDatasourceEnabled: false
    extraSecretMounts:
      - name: grafana-oidc-creds
        mountPath: /etc/secrets
        secretName: grafana-oidc-creds
        readOnly: true
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-oidc-creds
          key: oidc_client
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc-creds
          key: password
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            url: http://prometheus-prometheus.monitoring:9090
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://monitoring-loki.monitoring:3100
            access: proxy
          # Alerts, silences and routing in Grafana's Alerting UI. Grafana's
          # own alert rules stay unused (handleGrafanaManagedAlerts: false).
          - name: Alertmanager
            uid: alertmanager
            type: alertmanager
            url: http://prometheus-alertmanager.monitoring:9093
            access: proxy
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false
    grafana.ini:
      server:
        root_url: https://monitor.salishseawolf.com
        serve_from_sub_path: false
      auth:
        disable_login_form: false
        oauth_auto_login: true
      auth.anonymous:
        enabled: false
      auth.generic_oauth:
        enabled: true
        name: authentik
        scopes: openid profile email entitlements
        auth_url: https://auth.salishseawolf.com/application/o/authorize/
        token_url: https://auth.salishseawolf.com/application/o/token/
        api_url: https://auth.salishseawolf.com/application/o/userinfo/
        signout_redirect_url: https://auth.salishseawolf.com/application/o/grafana/end-session/
        role_attribute_path: >-
          contains(entitlements[*], 'Grafana Admins') && 'Admin' ||
          contains(entitlements[*], 'Grafana Editors') && 'Editor' || 'Viewer'
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  kubeStateMetrics:
    enabled: true

  nodeExporter:
    enabled: true

  prometheus-node-exporter:
    hostNetwork: false
    # kernel_hung reads /proc/sys/kernel/hung_task_detect_count, which Debian's
    # 6.1 kernel doesn't have: it failed (and logged an ERROR) on every scrape.
    extraArgs:
      - --no-collector.kernel_hung
    # Deliberate kube-linter exceptions, on the DaemonSet object only (not the
    # pod template, so no rollout): reading host metrics is its whole job.
    daemonsetAnnotations:
      ignore-check.kube-linter.io/host-pid: >-
        node-exporter reads per-process host metrics via the host PID namespace.
      ignore-check.kube-linter.io/sensitive-host-mounts: >-
        Mounts /, /proc and /sys read-only to report host metrics.

  # k3s runs these inside the k3s process, not as pods: the chart's Services
  # would select nothing, Prometheus would scrape dead targets and TargetDown
  # would fire for them. Their alert rules are disabled below as well.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  # Default rules and dashboards — keep them
  defaultRules:
    create: true
    rules:
      alertmanager: true
      etcd: false
      configReloaders: true
      general: true
      k8s: true
      kubeApiserverAvailability: true
      kubeApiserverBurnrate: true
      kubeApiserverHistogram: true
      kubeApiserverSlos: true
      kubelet: true
      kubeProxy: false
      kubePrometheusGeneral: true
      kubePrometheusNodeRecording: true
      kubernetesApps: true
      kubernetesResources: true
      kubernetesStorage: true
      kubernetesSystem: true
      kubeScheduler: false
      network: true
      node: true
      nodeExporterAlerting: true
      nodeExporterRecording: true
      prometheus: true
      prometheusOperator: true
    # Per-namespace ResourceQuotas are deliberate ceilings, so their sum is
    # meant to exceed the cluster. KubeCPUOvercommit/KubeMemoryOvercommit
    # (pod requests vs. capacity) stay on.
    disabled:
      KubeCPUQuotaOvercommit: true
      KubeMemoryQuotaOvercommit: true

  global:
    rbac:
      create: true
      pspEnable: false
# Loki
loki:
  enabled: true
  fullnameOverride: monitoring-loki
  loki:
    # Single-tenant mode (tenant "fake"): Grafana and Alloy then need no
    # X-Scope-OrgID header. This is tenant routing, not authentication (Loki
    # has none); access is limited by the monitoring NetworkPolicies.
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    limits_config:
      retention_period: 4320h  # 180 days
      max_entries_limit_per_query: 5000
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2025-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
  deploymentMode: SingleBinary
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  singleBinary:
    replicas: 1
    # Hetzner volume, not SeaweedFS: monitoring must not depend on the storage
    # it monitors (2026-10-13, docs/RCA-2026-10-SEAWEEDFS.md).
    persistence:
      storageClass: hcloud-volumes
      size: 10Gi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  test:
    enabled: false
  # Nothing uses the gateway (Grafana and Alloy talk to monitoring-loki:3100
  # directly) and the canary only produced test lines through it.
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
  # Loki doesn't need a lot of resources for 3 nodes
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
# Alloy
alloy:
  enabled: true
  fullnameOverride: monitoring-alloy
  alloy:
    # The level templates below are single Alloy strings and can't wrap.
    # yamllint disable rule:line-length
    configMap:
      create: true
      content: |
        logging {
          level = "warn"
        }
        loki.write "default" {
          endpoint {
            url = "http://monitoring-loki.monitoring:3100/loki/api/v1/push"
          }
        }
        // loki.source.file does not expand globs; local.file_match does.
        local.file_match "pod_logs" {
          path_targets = [{__path__ = "/var/log/pods/*/*/*.log"}]
        }
        loki.source.file "pod_logs" {
          targets    = local.file_match.pod_logs.targets
          forward_to = [loki.process.pod_logs.receiver]
        }
        // Strip the CRI prefix (timestamp, stream, flag) and label each line
        // from its path: /var/log/pods/<ns>_<pod>_<uid>/<container>/<n>.log
        loki.process "pod_logs" {
          stage.cri {}
          stage.regex {
            source     = "filename"
            expression = "/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/"
          }
          stage.labels {
            values = {
              namespace = "",
              pod       = "",
              container = "",
            }
          }
          // Log levels for the formats Loki can't detect itself (it handles
          // JSON and logfmt `level`). Each rule sets the extracted `level`;
          // later rules win, so the keyword fallback goes first and the
          // format-specific rules override it. Lines no rule matches stay
          // "unknown" in Loki, deliberately not "info".
          //
          // Keyword fallback (restic, Go/Python stderr), skipped for JSON
          // and logfmt lines.
          stage.match {
            selector = `{namespace=~".+"} !~ "^\\{|level="`
            stage.regex {
              expression = `(?i)\b(?P<level>warn|warning)\b`
            }
            stage.regex {
              expression = `[a-z](?P<level>Warning):`
            }
            stage.regex {
              expression = `(?i)\b(?P<level>error|failed|exception)\b`
            }
            stage.regex {
              expression = `(?i)^(?P<level>fatal|panic)\b`
            }
          }
          // glog (SeaweedFS and its CSI driver): I1009 22:50:10.965407 ...
          stage.regex {
            expression = `^(?P<level>[IWEF])\d{4} \d{2}:\d{2}:\d{2}\.\d+ `
          }
          // Gitea: 2026/10/09 22:30:58 HTTPRequest [I] router: ...
          stage.regex {
            expression = `^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} \S+ \[(?P<level>[TDIWEFC])\] `
          }
          // MariaDB: 2026-10-09 22:46:01 4852 [Warning] ...
          stage.regex {
            expression = `^\d{4}-\d{2}-\d{2} +\d{1,2}:\d{2}:\d{2} \d+ \[(?P<level>Note|Warning|ERROR)\] `
          }
          // 1Password Connect: JSON with a numeric level Loki can't map, and
          // the real one as a "(I) " prefix on log_message.
          stage.regex {
            expression = `^\{"log_message":"\((?P<level>[DIWE])\) `
          }
          // The Alloy chart renders this config through Helm's tpl, so Alloy
          // templates are wrapped as Helm raw strings: {{`"..."`}}.
          // Apache/nginx access logs (Kimai, personal site): by HTTP status.
          stage.match {
            selector = `{namespace=~".+"} |~ "\\] \"[A-Z]+ [^\"]*\" \\d{3} "`
            stage.regex {
              expression = `\] "[A-Z]+ [^"]*" (?P<http_status>\d{3}) `
            }
            stage.template {
              source   = "level"
              template = {{`"{{ if ge .http_status \"500\" }}error{{ else if ge .http_status \"400\" }}warn{{ else }}info{{ end }}"`}}
            }
          }
          // Gatus check results.
          stage.match {
            selector = `{namespace="gatus"} |= "] Monitored " |= "success=false"`
            stage.template {
              source   = "level"
              template = "error"
            }
          }
          stage.match {
            selector = `{namespace="gatus"} |= "] Monitored " |= "success=true"`
            stage.template {
              source   = "level"
              template = "info"
            }
          }
          // Go's "http: TLS handshake error" is a client hanging up (Gatus
          // TCP checks), not a server error.
          stage.match {
            selector = `{namespace=~".+"} |= "http: TLS handshake error from"`
            stage.template {
              source   = "level"
              template = "debug"
            }
          }
          // Loki logs a query the client abandoned (Grafana refresh or a
          // changed query) as level=error, several lines per query. Not a
          // failure: real Loki errors use other messages.
          stage.match {
            selector = `{namespace="monitoring", container="loki"} |= "context canceled"`
            stage.template {
              source   = "level"
              template = "debug"
            }
          }
          // Normalise to Loki's level names and attach as structured metadata
          // (not a label: no new streams); Loki uses it as detected_level.
          stage.template {
            source   = "level"
            template = {{`"{{ $l := ToLower (print .Value) }}{{ if or (eq $l \"t\") (eq $l \"trace\") }}trace{{ else if or (eq $l \"d\") (eq $l \"debug\") }}debug{{ else if or (eq $l \"i\") (eq $l \"info\") (eq $l \"note\") }}info{{ else if or (eq $l \"w\") (eq $l \"warn\") (eq $l \"warning\") }}warn{{ else if or (eq $l \"e\") (eq $l \"error\") (eq $l \"failed\") (eq $l \"exception\") }}error{{ else if or (eq $l \"f\") (eq $l \"c\") (eq $l \"fatal\") (eq $l \"panic\") (eq $l \"critical\") }}critical{{ end }}"`}}
          }
          stage.structured_metadata {
            values = {
              level = "",
            }
          }
          forward_to = [loki.write.default.receiver]
        }
    # yamllint enable rule:line-length
    mounts:
      varlog: true
      dockercontainers: false
  controller:
    type: daemonset
    # Deliberate kube-linter exception, on the DaemonSet object only.
    extraAnnotations:
      ignore-check.kube-linter.io/run-as-non-root: >-
        Alloy tails every pod's logs from root-owned host paths (/var/log).
      ignore-check.kube-linter.io/no-read-only-root-fs: >-
        TODO(lint), see docs/todo.md "Fix linting issues": alloy keeps its WAL under /tmp/alloy;
        mount an emptyDir and test.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Inspect this service's VolSync backups in B2. Each task names its
# "VolSync B2 <repo>" 1Password item; ../../scripts/volsync-restic.sh
# resolves the credentials via op run. `mount` needs FUSE.

[tasks."backup:snapshots"]
description = "List restic snapshots for every monitoring VolSync repo"
run = [
  "mise run //services/monitoring:backup:loki:snapshots",
]

[tasks."backup:loki:snapshots"]
description = "List restic snapshots in loki-data"
env = { VOLSYNC_ITEM = "VolSync B2 loki-data" }
run = "bash ../../scripts/volsync-restic.sh snapshots"

[tasks."backup:loki:ls"]
description = "List files in the latest loki-data snapshot"
env = { VOLSYNC_ITEM = "VolSync B2 loki-data" }
run = "bash ../../scripts/volsync-restic.sh ls latest"

[tasks."backup:loki:mount"]
description = "Browse every loki-data snapshot as files (Ctrl-C unmounts)"
env = { VOLSYNC_ITEM = "VolSync B2 loki-data" }
run = '''
set -euo pipefail
dir=$(mktemp -d)
# rmdir, not rm -rf: never recurse into a mountpoint
trap 'rmdir -- "$dir" 2>/dev/null || true' EXIT
echo "Mounting $VOLSYNC_ITEM at $dir (Ctrl-C to unmount)"
bash ../../scripts/volsync-restic.sh mount "$dir"
'''

[tasks."backup:locks"]
description = "Show restic locks in every monitoring VolSync repo"
run = [
  "mise run //services/monitoring:backup:loki:locks",
]

[tasks."backup:loki:locks"]
description = "Show restic locks in loki-data (age, host, pid)"
env = { VOLSYNC_ITEM = "VolSync B2 loki-data" }
run = "bash ../../scripts/volsync-locks.sh show"

[tasks."backup:loki:unlock"]
description = "Remove stale restic locks in loki-data (--all: every lock)"
env = { VOLSYNC_ITEM = "VolSync B2 loki-data" }
usage = 'flag "--all" help="Remove every lock, not only stale ones (no mover may be running)"'
run = "bash ../../scripts/volsync-locks.sh clear ${usage_all:+--all}"


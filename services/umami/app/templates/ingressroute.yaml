apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: umami
  namespace: umami
  labels:
    app.kubernetes.io/name: umami
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: "Host(`umami.{{ .Values.domain }}`)"
      middlewares:
        # Auth at the edge Authentik's 'internal' group gates this application
        # before traffic reaches the pod.
        - name: authentik-forward-auth
          namespace: identity
      services:
        - kind: Service
          name: umami
          port: {{ .Values.umami.service.port }}
  tls: {}


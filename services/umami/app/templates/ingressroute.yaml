apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: umami
  namespace: umami
  labels:
    app.kubernetes.io/name: umami
spec:
  entryPoints:
    - websecure
  routes:
    # Public tracking surface: anonymous visitor browsers hit these with no
    # Authentik session, so they must bypass forward-auth or the tracker/
    # replay scripts and their data get redirected to the login flow instead
    # of served/accepted. Scoped to exact paths so nothing else on this host
    # (dashboard, admin API) is exposed unauthenticated.
    - kind: Rule
      priority: 10
      match: >-
        Host(`umami.{{ .Values.domain }}`) &&
        (
          Path(`/info.js`) ||
          Path(`/recorder.js`) ||
          Path(`/api/send`) ||
          Path(`/api/record`) ||
          PathRegexp(`^/api/websites/[^/]+/recorder$`)
        )
      services:
        - kind: Service
          name: umami
          port: {{ .Values.umami.service.port }}
    # Everything else (dashboard, login, admin API) — Authentik's 'internal'
    # group gates this before traffic reaches the pod.
    - kind: Rule
      priority: 1
      match: "Host(`umami.{{ .Values.domain }}`)"
      middlewares:
        - name: authentik-forward-auth
          namespace: identity
      services:
        - kind: Service
          name: umami
          port: {{ .Values.umami.service.port }}
  tls: {}


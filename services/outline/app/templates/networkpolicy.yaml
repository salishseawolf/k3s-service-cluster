# Default-deny both ways for the two workloads (docs/OUTLINE-WIKI.md step 6).
# Ingress: Outline only from Traefik's node addresses (traefikSources, not the
# whole pod CIDR, so no pod can skip forward-auth) and Gatus; Redis only from
# Outline and Gatus. Egress: only what Outline needs. VolSync mover pods are
# not selected by the egress policies: they need DNS and B2.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: outline
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-outline
  namespace: outline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: outline
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.traefikSources }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
      ports:
        - protocol: TCP
          port: {{ .Values.outline.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-redis
  namespace: outline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: outline-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: outline
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
      ports:
        - protocol: TCP
          port: 6379
---
# Outline: DNS, Postgres, its Redis, Authentik's server (OIDC token and
# userinfo over the internal Service). Nothing else: no update ping, no
# server-side fetches of external URLs or images, no exfiltration path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-egress-outline
  namespace: outline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: outline
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              cnpg.io/cluster: main-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: outline-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 9000
---
# Redis talks to no one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-egress-redis
  namespace: outline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: outline-redis
  policyTypes:
    - Egress

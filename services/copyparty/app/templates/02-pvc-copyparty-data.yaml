apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    # PVCs are never pruned: a manifest rename must not delete a volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: 'copyparty-data'
  namespace: 'copyparty'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: '5Gi'
  storageClassName: 'seaweedfs-storage'

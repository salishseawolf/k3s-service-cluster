apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: copyparty-share
  namespace: 'copyparty'
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`files.{{ .Values.domain }}`) && Query(`h`, `.{0,}`)
    priority: 150
    services:
    - name: copyparty
      port: 3923
  tls: {}

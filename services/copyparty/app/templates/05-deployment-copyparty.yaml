apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
  namespace: 'copyparty'
  labels:
    app.kubernetes.io/name: copyparty
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: >-
      TODO(lint), see docs/todo.md "Fix linting issues": map copyparty write paths outside the PVC,
      then mount emptyDirs.
    ignore-check.kube-linter.io/run-as-non-root: >-
      TODO(lint), see docs/todo.md "Fix linting issues": PVC data is root-owned; migrate ownership,
      then run as uid 1000.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: copyparty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copyparty
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 1000
      containers:
      - name: copyparty
        image: 'copyparty/ac:1.20.16'
        ports:
        - containerPort: 3923
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        volumeMounts:
        - name: config
          mountPath: /cfg
        - name: data
          mountPath: /w
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: copyparty-config
      - name: data
        persistentVolumeClaim:
          claimName: 'copyparty-data'

# NetworkPolicies for the copyparty namespace.
#
# Model: default-deny ingress per namespace, then explicit
# allows. Traefik runs as a hostNetwork DaemonSet, so ingress from Traefik
# arrives with a NODE ip as source — matched via ipBlock on the private net
# (192.168.0.0/16), not a podSelector. Kubelet probe traffic on some CNIs is
# sourced from the cni0 bridge IP (pod CIDR); K3s' embedded policy controller
# permits host-local probe traffic, but VERIFY on a canary namespace first
# before rolling this out cluster-wide.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: "copyparty"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: "copyparty"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Web traffic via hostNetwork Traefik (node addresses only, see
# values.traefikSources); gatus TCP-checks the service directly. Not the whole
# pod network: copyparty trusts X-Authentik-* identity headers, so any pod
# that could reach it directly could log in as anyone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-traefik
  namespace: "copyparty"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.traefikSources }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus

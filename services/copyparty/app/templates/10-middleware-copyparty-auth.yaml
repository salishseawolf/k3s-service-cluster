apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: copyparty-auth
  namespace: 'copyparty'
spec:
  forwardAuth:
    address: http://ak-outpost-copyparty.copyparty:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
    - X-authentik-username
    - X-authentik-groups

# Inspect this service's VolSync backups in B2. Each task names its
# "VolSync B2 <repo>" 1Password item; ../../scripts/volsync-restic.sh
# resolves the credentials via op run. `mount` needs FUSE.

[tasks."backup:snapshots"]
description = "List restic snapshots for every copyparty VolSync repo"
run = [
  "mise run //services/copyparty:backup:data:snapshots",
]

[tasks."backup:data:snapshots"]
description = "List restic snapshots in copyparty-data"
env = { VOLSYNC_ITEM = "VolSync B2 copyparty-data" }
run = "bash ../../scripts/volsync-restic.sh snapshots"

[tasks."backup:data:ls"]
description = "List files in the latest copyparty-data snapshot"
env = { VOLSYNC_ITEM = "VolSync B2 copyparty-data" }
run = "bash ../../scripts/volsync-restic.sh ls latest"

[tasks."backup:data:mount"]
description = "Browse every copyparty-data snapshot as files (Ctrl-C unmounts)"
env = { VOLSYNC_ITEM = "VolSync B2 copyparty-data" }
run = '''
set -euo pipefail
dir=$(mktemp -d)
# rmdir, not rm -rf: never recurse into a mountpoint
trap 'rmdir -- "$dir" 2>/dev/null || true' EXIT
echo "Mounting $VOLSYNC_ITEM at $dir (Ctrl-C to unmount)"
bash ../../scripts/volsync-restic.sh mount "$dir"
'''

# Restic locks. A mover killed mid-run (pod deleted, node evicted) leaves its
# lock, and the next forget/prune fails with "repository is already locked".
# `unlock` removes only stale locks; `unlock --all` removes every lock, so
# first check that no volsync-src-* pod is Running for that repo.

[tasks."backup:locks"]
description = "Show restic locks in every copyparty VolSync repo"
run = [
  "mise run //services/copyparty:backup:data:locks",
]

[tasks."backup:data:locks"]
description = "Show restic locks in copyparty-data (age, host, pid)"
env = { VOLSYNC_ITEM = "VolSync B2 copyparty-data" }
run = "bash ../../scripts/volsync-locks.sh show"

[tasks."backup:data:unlock"]
description = "Remove stale restic locks in copyparty-data (--all: every lock)"
env = { VOLSYNC_ITEM = "VolSync B2 copyparty-data" }
usage = 'flag "--all" help="Remove every lock, not only stale ones (no mover may be running)"'
run = "bash ../../scripts/volsync-locks.sh clear ${usage_all:+--all}"

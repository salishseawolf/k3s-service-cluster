---
# Gitea deployment tasks

# ──────────────────────────────────────────────────────────────────
# Preflight
# ──────────────────────────────────────────────────────────────────

- name: Check SeaweedFS CSI StorageClass exists
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ gitea_storage_class }}"
  register: gitea_sc_check

- name: Fail if StorageClass not found
  ansible.builtin.fail:
    msg: "SeaweedFS CSI StorageClass '{{ gitea_storage_class }}' not found. Deploy seaweedfs-csi first."
  when: gitea_sc_check.resources | length == 0

# ──────────────────────────────────────────────────────────────────
# Namespace & PVC
# ──────────────────────────────────────────────────────────────────

- name: Create Gitea namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gitea_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: restricted

# ──────────────────────────────────────────────────────────────────
# Database (shared CloudNativePG cluster)
# ──────────────────────────────────────────────────────────────────

- name: Wait for CloudNativePG cluster to be healthy
  kubernetes.core.k8s_info:
    kind: Cluster
    name: main-db
    namespace: database
    api_version: postgresql.cnpg.io/v1
  register: gitea_cnpg_check
  until:
    - gitea_cnpg_check.resources | length > 0
    - gitea_cnpg_check.resources[0].status.phase | default("") | lower is search("healthy")
  retries: 15
  delay: 10

- name: Check PostgreSQL version
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database pod/main-db-1 -- psql -U postgres -tAc "SELECT version()"
  register: gitea_pg_version
  changed_when: false

- name: Get Postgres Leader Pod
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: database
    label_selectors:
      - "cnpg.io/cluster = main-db"
      - "role = primary"
    field_selectors:
      - "status.phase=Running"
  register: gitea_pg_pod

- name: Set Fact for Postgres Leader Pod
  ansible.builtin.set_fact:
    gitea_pg_leader: "{{ gitea_pg_pod.resources[0].metadata.name }}"

- name: Check if Gitea DB User Exists
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ gitea_pg_leader }}" -- psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ gitea_db_user }}'"
  register: gitea_user_check
  changed_when: false

- name: Create Gitea Database User
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ gitea_pg_leader }}" -- psql -U postgres -c "CREATE USER {{ gitea_db_user }} WITH PASSWORD '{{ gitea_db_password }}'"
  no_log: true
  when: gitea_user_check.stdout | trim != '1'

- name: Update Gitea Database User Password
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ gitea_pg_leader }}" -- psql -U postgres -c "ALTER USER {{ gitea_db_user }} WITH PASSWORD '{{ gitea_db_password }}'"
  no_log: true

- name: Check if Gitea Database Exists
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ gitea_pg_leader }}" -- psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ gitea_db_name }}'"
  register: gitea_db_check
  changed_when: false

- name: Create Gitea Database
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ gitea_pg_leader }}" -- psql -U postgres -c "CREATE DATABASE {{ gitea_db_name }} OWNER {{ gitea_db_user }}"
  when: gitea_db_check.stdout | trim != '1'

- name: Grant All Privileges to Gitea User
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ gitea_pg_leader }}" -- psql -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE {{ gitea_db_name }} TO {{ gitea_db_user }}"

- name: Alter Schema Owner
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ gitea_pg_leader }}" -- psql -U postgres -d "{{ gitea_db_name }}" -c "ALTER SCHEMA public OWNER TO {{ gitea_db_user }}"

- name: Grant All on Schema Public
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ gitea_pg_leader }}" -- psql -U postgres -d "{{ gitea_db_name }}" -c "GRANT ALL ON SCHEMA public TO {{ gitea_db_user }}"

# ──────────────────────────────────────────────────────────────────
# Secrets (1Password)
# ──────────────────────────────────────────────────────────────────

- name: Create OnePasswordItem for Gitea secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: "{{ gitea_secrets_secret_name }}"
        namespace: "{{ gitea_namespace }}"
      spec:
        itemPath: "{{ gitea_secrets_ref }}"

- name: Wait for OnePasswordItem secrets to sync
  kubernetes.core.k8s_info:
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ gitea_namespace }}"
  register: gitea_secret_check
  until:
    - gitea_secret_check.resources | length > 0
    - gitea_secret_check.resources[0].data is defined
  retries: 15
  delay: 5
  loop:
    - "{{ gitea_secrets_secret_name }}"


# ──────────────────────────────────────────────────────────────────
# Authentik blueprint (run BEFORE Helm deploy so OIDC secret exists)
# ──────────────────────────────────────────────────────────────────

- name: Append gitea blueprint to authentik-blueprints
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: authentik-blueprints
        namespace: identity
      data:
        blueprint-gitea.yaml: "{{ lookup('template', 'blueprint-gitea.yaml.j2') | indent(4) }}"

- name: Wait for ConfigMap propagation and apply blueprint
  ansible.builtin.shell:
    cmd: |
      for i in $(seq 1 12); do
        kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n identity exec deploy/authentik-server -- sh -c "test -f /blueprints/custom/blueprint-gitea.yaml" 2>/dev/null && break
        sleep 10
      done && kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n identity exec deploy/authentik-server -- ak apply_blueprint /blueprints/custom/blueprint-gitea.yaml 2>&1
  register: gitea_blueprint_result
  changed_when: "'created' in gitea_blueprint_result.stdout or 'patched' in gitea_blueprint_result.stdout"

- name: Fetch Authentik auto-generated OIDC client ID and secret
  ansible.builtin.shell:
    cmd: |
      for i in 1 2 3 4 5; do
        RESULT=$(kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n identity exec deploy/authentik-server -- python3 -c "
      import django, os
      os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'authentik.root.settings')
      django.setup()
      from authentik.providers.oauth2.models import OAuth2Provider
      from authentik.core.models import Application
      app = Application.objects.filter(slug='gitea').first()
      if app and app.provider:
          p = OAuth2Provider.objects.filter(pk=app.provider.pk).first()
          if p:
              print(f'{p.client_id},{p.client_secret}')
              exit(0)
      exit(1)
      " 2>/dev/null)
        if [ -n "$RESULT" ]; then
          echo "$RESULT"
          exit 0
        fi
        sleep 10
      done
      exit 1
  register: gitea_oidc_result
  changed_when: false
  no_log: true
  run_once: true
  until: gitea_oidc_result is not failed

- name: Create OIDC credentials Secret from auto-generated values
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gitea_oidc_creds_secret_name }}"
        namespace: "{{ gitea_namespace }}"
      type: Opaque
      stringData:
        client_id: "{{ gitea_oidc_result.stdout.split(',')[0] | trim }}"
        client_secret: "{{ gitea_oidc_result.stdout.split(',')[1] | trim }}"

# ──────────────────────────────────────────────────────────────────
# Helm deploy (OIDC secret now exists — pod starts with real creds)
# ──────────────────────────────────────────────────────────────────

- name: Add Gitea Helm Repo
  kubernetes.core.helm_repository:
    name: gitea-charts
    repo_url: "{{ gitea_chart_repo }}"

- name: Deploy Gitea
  kubernetes.core.helm:
    name: gitea
    chart_ref: gitea-charts/gitea
    chart_version: "{{ gitea_chart_version | default(omit) }}"
    release_namespace: "{{ gitea_namespace }}"
    create_namespace: false
    wait: false
    timeout: 3m0s
    values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"

- name: Wait for Gitea deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: gitea
    namespace: "{{ gitea_namespace }}"
  register: gitea_deploy_check
  until:
    - gitea_deploy_check.resources | length > 0
    - gitea_deploy_check.resources[0].status.availableReplicas is defined
    - gitea_deploy_check.resources[0].status.availableReplicas | int > 0
  retries: 30
  delay: 10

# ──────────────────────────────────────────────────────────────────
# IngressRoute
# ──────────────────────────────────────────────────────────────────

- name: Register Authentik OAuth2 source in Gitea
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n {{ gitea_namespace }} exec deploy/gitea -- gitea admin auth add-oauth \
        --name authentik \
        --provider openidConnect \
        --key "$(kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n {{ gitea_namespace }} get secret {{ gitea_oidc_creds_secret_name }} -o jsonpath='{.data.client_id}' | base64 -d)" \
        --secret "$(kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n {{ gitea_namespace }} get secret {{ gitea_oidc_creds_secret_name }} -o jsonpath='{.data.client_secret}' | base64 -d)" \
        --auto-discover-url "https://auth.{{ lookup('env', 'TF_VAR_domain') }}/application/o/gitea/.well-known/openid-configuration" \
        --scopes openid --scopes profile --scopes email \
        --group-claim-name groups \
        --admin-group infrastructure \
        --full-name-claim-name name \
        --icon-url "https://auth.{{ lookup('env', 'TF_VAR_domain') }}/static/dist/assets/icons/icon.png"
  register: gitea_auth_registration
  failed_when: false
  changed_when: "'already exists' not in gitea_auth_registration.stderr"

- name: Deploy Gitea IngressRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: gitea
        namespace: "{{ gitea_namespace }}"
      spec:
        entryPoints:
          - websecure
        routes:
          - kind: Rule
            match: "Host(`{{ gitea_domain }}`)"
            priority: 100
            services:
              - name: gitea-http
                port: "{{ gitea_port }}"
        tls:
          secretName: wildcard-{{ lookup('env', 'TF_VAR_domain') | replace('.', '-') }}-tls

- name: Deploy Gitea SSH IngressRouteTCP
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRouteTCP
      metadata:
        name: gitea-ssh
        namespace: "{{ gitea_namespace }}"
      spec:
        entryPoints:
          - ssh
        routes:
          - match: HostSNI(`*`)
            services:
              - name: gitea-ssh
                port: "{{ gitea_ssh_service_port }}"

# ──────────────────────────────────────────────────────────────────
# Wait for ready
# ──────────────────────────────────────────────────────────────────

- name: Wait for Gitea deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: gitea
    namespace: "{{ gitea_namespace }}"
  register: gitea_deploy_ready
  until:
    - gitea_deploy_ready.resources | length > 0
    - gitea_deploy_ready.resources[0].status.availableReplicas is defined
    - gitea_deploy_ready.resources[0].status.availableReplicas | int > 0
  retries: 30
  delay: 10

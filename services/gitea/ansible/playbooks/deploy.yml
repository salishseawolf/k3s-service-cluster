---
- name: Deploy Gitea
  hosts: localhost
  gather_facts: false
  connection: local

  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}"

  roles:
    - role: gitea

# VolSync restic backup of gitea-data (hourly; minutes are staggered
# across services so the movers don't all hit SeaweedFS/B2 at the top of the hour).
#
# The 1P item carries the restic env verbatim (the operator cannot template,
# so the vault does): RESTIC_REPOSITORY, RESTIC_PASSWORD, AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY. Each PVC gets its OWN item/repository — restic
# repositories must never be shared between ReplicationSources.
#
# The valkey PVC (gitea subchart) is deliberately NOT backed up: it holds
# session/queue cache that Gitea rebuilds on start.
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: volsync-b2-gitea-data
  namespace: gitea
spec:
  itemPath: "vaults/K3s Service Cluster/items/VolSync B2 gitea-data"
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: gitea-data
  namespace: gitea
spec:
  sourcePVC: gitea-data
  trigger:
    schedule: "10 * * * *"
  restic:
    repository: volsync-b2-gitea-data
    # Direct: hcloud-csi has no snapshot support (no Hetzner volume-snapshot
    # API) and seaweedfs-csi implements neither CSI snapshots nor cloning (no
    # csi-snapshotter sidecar, no snapshot-controller/CRDs in-cluster), so
    # Clone/Snapshot PiT copies are impossible here. The mover mounts the
    # live PVC (file-level crash consistency; databases have Barman).
    copyMethod: Direct
    pruneIntervalDays: 7
    retain:
      hourly: 12
      daily: 5
      weekly: 4
      monthly: 2
      yearly: 1
    # Restic cache on node-local storage: hcloud-volumes has a 10Gi minimum
    # and caching on seaweedfs-storage would make restores depend on the very
    # store being restored.
    cacheCapacity: 2Gi
    # Not local-path: that pins the cache to one node, and copyMethod Direct
    # runs the mover on the app pod's node, so a rescheduled app deadlocked
    # its backup ("volume node affinity conflict"). SeaweedFS follows the pod.
    cacheStorageClassName: seaweedfs-storage
    moverSecurityContext:
      runAsUser: 0

{{- $giteaSecrets := lookup "v1" "Secret" "gitea" "gitea-secrets" -}}
{{- if $giteaSecrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: gitea-admin
  namespace: gitea
  labels:
    app.kubernetes.io/instance: gitea
type: Opaque
data:
  username: {{ index $giteaSecrets.data "admin_user" }}
  password: {{ index $giteaSecrets.data "admin_password" }}
{{- end -}}

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  entryPoints: [websecure]
  routes:
    # Git smart-HTTP, the API and the package registry, without forward-auth
    # (token clients can't do a browser login), but only from the admin
    # ranges or the pod network. In-cluster clients (Gitea Actions'
    # actions/checkout, Gatus) reach this through Traefik's ClusterIP via the
    # CoreDNS rewrite (coredns-custom.yaml); their source is a pod or node
    # address. ClientIP sees the real client because the LB sends PROXY
    # protocol on 443. From anywhere else these paths fall through to the
    # forward-auth route below.
    - kind: Rule
      match: >-
        Host(`git.{{ .Values.domain }}`) &&
        (Path(`/{owner}/{repo}/info/refs`) || Path(`/{owner}/{repo}/git-upload-pack`) ||
        Path(`/{owner}/{repo}/git-receive-pack`) || PathPrefix(`/{owner}/{repo}/info/lfs/`) ||
        PathPrefix(`/api/`) || PathPrefix(`/v2/`)) &&
        ClientIP({{ include "k3s.gitea.tokenSourceRanges" . }})
      priority: 200
      services:
        - name: gitea-http
          port: 3000
    # Everything else: Authentik forward-auth first, then Gitea's own login
    # (OIDC via the same Authentik session).
    - kind: Rule
      match: "Host(`git.{{ .Values.domain }}`)"
      priority: 100
      middlewares:
        - name: authentik-forward-auth
          namespace: identity
      services:
        - name: gitea-http
          port: 3000
  tls: {}
---
# Restricts SSH git access to the admin's own network, matching the intent
# already applied to direct node access by infrastructure/tofu's Hetzner
# firewall (which only governs direct-to-node traffic, not traffic arriving
# via the Load Balancer — this middleware is what actually enforces it for
# the LB-fronted path). It only sees the real client IP because the LB's
# 2222 service sends PROXY protocol and Traefik's ssh entrypoint trusts it;
# without that every LB connection appears as 192.168.1.10 and passes.
apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: gitea-ssh-allowlist
  namespace: gitea
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.adminSourceRanges | nindent 6 }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gitea-ssh
  namespace: gitea
spec:
  entryPoints: [ssh]
  routes:
    - match: HostSNI(`*`)
      middlewares:
        - name: gitea-ssh-allowlist
      services:
        - name: gitea-ssh
          port: ssh

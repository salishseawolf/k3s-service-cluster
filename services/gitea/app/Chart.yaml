apiVersion: v2
name: gitea
description: >-
  Gitea (umbrella). Deployed by Argo like any other app — Argo pulls from the
  GitHub mirror, so Gitea is not a bootstrap dependency. Domain-dependent
  config via additionalConfigSources ConfigMap; secrets via 1P-synced env.
type: application
version: 0.1.0
dependencies:
  - name: gitea
    version: ">=12.0.0"
    repository: https://dl.gitea.com/charts/

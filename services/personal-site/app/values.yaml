---
# Injected by the root ApplicationSet as a Helm parameter (single source of
# truth for the cluster domain lives in platform/argocd).
domain: ""

image:
  repository: ghcr.io/salishseawolf/personal-site
  # `latest` by digest, which Renovate updates when a new build is published
  # (the git-SHA tags don't sort). The digest is the image that runs; the tag
  # is only a label for it.
  tag: "latest@sha256:75b14c655c97eea653504fc86ec35232b00b0cd0c2d63e68cedf88ab8f5b953b"

port: 80

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

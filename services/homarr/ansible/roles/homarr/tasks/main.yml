---
# Homarr dashboard deployment tasks

# ──────────────────────────────────────────────────────────────────
# Preflight
# ──────────────────────────────────────────────────────────────────

- name: Check SeaweedFS CSI StorageClass exists
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ homarr_storage_class }}"
  register: homarr_sc_check

- name: Fail if StorageClass not found
  ansible.builtin.fail:
    msg: "SeaweedFS CSI StorageClass '{{ homarr_storage_class }}' not found. Deploy seaweedfs-csi first."
  when: homarr_sc_check.resources | length == 0

# ──────────────────────────────────────────────────────────────────
# Namespace & PVC
# ──────────────────────────────────────────────────────────────────

- name: Create Homarr namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ homarr_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/audit: baseline
          pod-security.kubernetes.io/warn: baseline

- name: Wait for namespace labels to propagate
  ansible.builtin.pause:
    seconds: 5

- name: Create Homarr data PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: homarr-data
        namespace: "{{ homarr_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ homarr_storage_class }}"
        resources:
          requests:
            storage: "{{ homarr_storage }}"

# ──────────────────────────────────────────────────────────────────
# Database (shared CloudNativePG cluster)
# ──────────────────────────────────────────────────────────────────

- name: Wait for CloudNativePG cluster to be healthy
  kubernetes.core.k8s_info:
    kind: Cluster
    name: main-db
    namespace: database
    api_version: postgresql.cnpg.io/v1
  register: homarr_cnpg_check
  until:
    - homarr_cnpg_check.resources | length > 0
    - homarr_cnpg_check.resources[0].status.phase | default("") | lower is search("healthy")
  retries: 15
  delay: 10

- name: Get Postgres Leader Pod
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: database
    label_selectors:
      - "cnpg.io/cluster = main-db"
      - "role = primary"
    field_selectors:
      - "status.phase=Running"
  register: homarr_pg_pod

- name: Set Fact for Postgres Leader Pod
  ansible.builtin.set_fact:
    homarr_pg_leader: "{{ homarr_pg_pod.resources[0].metadata.name }}"

- name: Check if Homarr DB User Exists
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ homarr_pg_leader }}" -- psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ homarr_db_user }}'"
  register: homarr_user_check

- name: Create Homarr Database User
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ homarr_pg_leader }}" -- psql -U postgres -c "CREATE USER {{ homarr_db_user }} WITH PASSWORD '{{ homarr_db_password }}'"
  no_log: true
  when: homarr_user_check.stdout | trim != '1'

- name: Update Homarr Database User Password
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ homarr_pg_leader }}" -- psql -U postgres -c "ALTER USER {{ homarr_db_user }} WITH PASSWORD '{{ homarr_db_password }}'"
  no_log: true

- name: Restart Homarr pods to pick up new password
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n "{{ homarr_namespace }}" delete pods -l app=homarr --grace-period=0 --ignore-not-found

- name: Check if Homarr Database Exists
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ homarr_pg_leader }}" -- psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ homarr_db_name }}'"
  register: homarr_db_check

- name: Create Homarr Database
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ homarr_pg_leader }}" -- psql -U postgres -c "CREATE DATABASE {{ homarr_db_name }} OWNER {{ homarr_db_user }}"
  when: homarr_db_check.stdout | trim != '1'

- name: Grant All Privileges to Homarr User
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ homarr_pg_leader }}" -- psql -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE {{ homarr_db_name }} TO {{ homarr_db_user }}"

- name: Alter Schema Owner
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ homarr_pg_leader }}" -- psql -U postgres -d "{{ homarr_db_name }}" -c "ALTER SCHEMA public OWNER TO {{ homarr_db_user }}"

- name: Grant All on Schema Public
  ansible.builtin.shell:
    cmd: |
      kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" exec -n database "{{ homarr_pg_leader }}" -- psql -U postgres -d "{{ homarr_db_name }}" -c "GRANT ALL ON SCHEMA public TO {{ homarr_db_user }}"

# ──────────────────────────────────────────────────────────────────
# Secrets (1Password)
# ──────────────────────────────────────────────────────────────────

- name: Create OnePasswordItem for Homarr encryption key
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: "{{ homarr_encryption_key_secret_name }}"
        namespace: "{{ homarr_namespace }}"
      spec:
        itemPath: "{{ homarr_encryption_key_ref }}"

- name: Create OnePasswordItem for Homarr DB password
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: homarr-db-password
        namespace: "{{ homarr_namespace }}"
      spec:
        itemPath: "{{ homarr_db_password_ref }}"

- name: Create OnePasswordItem for shared Redis credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: redis-credentials
        namespace: "{{ homarr_namespace }}"
      spec:
        itemPath: "{{ homarr_redis_credentials_ref }}"

- name: Wait for OnePasswordItem secrets to sync
  kubernetes.core.k8s_info:
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ homarr_namespace }}"
  register: homarr_secret_check
  until:
    - homarr_secret_check.resources | length > 0
    - homarr_secret_check.resources[0].data is defined
  retries: 15
  delay: 5
  loop:
    - "{{ homarr_encryption_key_secret_name }}"
    - homarr-db-password
    - redis-credentials

# ──────────────────────────────────────────────────────────────────
# ConfigMap
# ──────────────────────────────────────────────────────────────────

- name: Deploy Homarr ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: homarr-config
        namespace: "{{ homarr_namespace }}"
      data:
        TZ: "{{ homarr_timezone | default('America/Los_Angeles') }}"
        BASE_URL: "https://{{ homarr_domain }}"
        NEXTAUTH_URL: "https://{{ homarr_domain }}"
        AUTH_PROVIDERS: "oidc"
        AUTH_OIDC_ISSUER: "{{ homarr_authentik_host }}/application/o/homarr/"
        AUTH_OIDC_CLIENT_NAME: "Authentik"
        AUTH_OIDC_SCOPE_OVERWRITE: "openid email profile groups"
        AUTH_OIDC_GROUPS_ATTRIBUTE: "groups"
        AUTH_OIDC_AUTO_LOGIN: "true"
        AUTH_LOGOUT_REDIRECT_URL: "{{ homarr_authentik_host }}/application/o/homarr/end-session/"
        LOG_LEVEL: "info"
        PUID: "0"
        PGID: "0"
        DB_DRIVER: "node-postgres"
        DB_DIALECT: "postgresql"
        DB_HOST: "{{ homarr_db_host }}"
        DB_PORT: "{{ homarr_db_port }}"
        DB_NAME: "{{ homarr_db_name }}"
        DB_USER: "{{ homarr_db_user }}"
        REDIS_IS_EXTERNAL: "true"
        REDIS_HOST: "redis.redis.svc.cluster.local"
        REDIS_PORT: "6379"

# ──────────────────────────────────────────────────────────────────
# Authentik blueprint (run BEFORE deploy so OIDC secret exists)
# ──────────────────────────────────────────────────────────────────

- name: Append homarr blueprint to authentik-blueprints
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: authentik-blueprints
        namespace: identity
      data:
        blueprint-homarr.yaml: "{{ lookup('template', 'blueprint-homarr.yaml.j2') | indent(4) }}"

- name: Wait for ConfigMap propagation and apply blueprint
  ansible.builtin.shell:
    cmd: |
      for i in $(seq 1 12); do
        kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n identity exec deploy/authentik-server -- sh -c "test -f /blueprints/custom/blueprint-homarr.yaml" 2>/dev/null && break
        sleep 10
      done && kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n identity exec deploy/authentik-server -- ak apply_blueprint /blueprints/custom/blueprint-homarr.yaml 2>&1
  register: homarr_blueprint_result
  changed_when: "'created' in homarr_blueprint_result.stdout or 'patched' in homarr_blueprint_result.stdout"

- name: Fetch Authentik auto-generated OIDC client ID and secret
  ansible.builtin.shell:
    cmd: |
      for i in 1 2 3 4 5; do
        RESULT=$(kubectl --kubeconfig "{{ lookup('env', 'KUBECONFIG', default='/etc/rancher/k3s/k3s.yaml') }}" -n identity exec deploy/authentik-server -- python3 -c "
      import django, os
      os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'authentik.root.settings')
      django.setup()
      from authentik.providers.oauth2.models import OAuth2Provider
      from authentik.core.models import Application
      app = Application.objects.filter(slug='homarr').first()
      if app and app.provider:
          p = OAuth2Provider.objects.filter(pk=app.provider.pk).first()
          if p:
              print(f'{p.client_id},{p.client_secret}')
              exit(0)
      exit(1)
      " 2>/dev/null)
        if [ -n "$RESULT" ]; then
          echo "$RESULT"
          exit 0
        fi
        sleep 10
      done
      exit 1
  register: homarr_oidc_result
  changed_when: false
  no_log: true
  run_once: true
  until: homarr_oidc_result is not failed

- name: Create OIDC credentials Secret from auto-generated values
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ homarr_oidc_creds_secret_name }}"
        namespace: "{{ homarr_namespace }}"
      type: Opaque
      stringData:
        client_id: "{{ homarr_oidc_result.stdout.split(',')[0] | trim }}"
        client_secret: "{{ homarr_oidc_result.stdout.split(',')[1] | trim }}"

# ──────────────────────────────────────────────────────────────────
# Deployment
# ──────────────────────────────────────────────────────────────────

- name: Deploy Homarr
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: homarr
        namespace: "{{ homarr_namespace }}"
        labels:
          app: homarr
      spec:
        replicas: 1
        revisionHistoryLimit: 2
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: homarr
        template:
          metadata:
            labels:
              app: homarr
          spec:
            securityContext:
              runAsUser: 0
              fsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            initContainers:
              - name: init-nginx
                image: "busybox"
                command:
                  - sh
                  - -c
                  - |
                    mkdir -p /nginx-lib/logs /nginx-lib/tmp /nginx-cache /nginx-log /nginx-run
                    chmod -R 2770 /nginx-lib /nginx-cache /nginx-log /nginx-run
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                    add:
                      - CHOWN
                      - SETUID
                      - SETGID
                  runAsUser: 0
                volumeMounts:
                  - name: nginx-lib
                    mountPath: /nginx-lib
                  - name: nginx-cache
                    mountPath: /nginx-cache
                  - name: nginx-log
                    mountPath: /nginx-log
                  - name: nginx-run
                    mountPath: /nginx-run
            containers:
              - name: homarr
                image: "{{ homarr_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - name: http
                    containerPort: "{{ homarr_port }}"
                    protocol: TCP
                envFrom:
                  - configMapRef:
                      name: homarr-config
                env:
                  - name: REDIS_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: redis-credentials
                        key: password
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: homarr-db-password
                        key: password
                  - name: SECRET_ENCRYPTION_KEY
                    valueFrom:
                      secretKeyRef:
                        name: "{{ homarr_encryption_key_secret_name }}"
                        key: secret_encryption_key
                  - name: AUTH_OIDC_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: "{{ homarr_oidc_creds_secret_name }}"
                        key: client_id
                  - name: AUTH_OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: "{{ homarr_oidc_creds_secret_name }}"
                        key: client_secret
                readinessProbe:
                  tcpSocket:
                    port: "{{ homarr_port }}"
                  initialDelaySeconds: 15
                  periodSeconds: 10
                livenessProbe:
                  tcpSocket:
                    port: "{{ homarr_port }}"
                  initialDelaySeconds: 30
                  periodSeconds: 15
                resources:
                  requests:
                    cpu: 200m
                    memory: 512Mi
                  limits:
                    cpu: 1
                    memory: 1Gi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                    add:
                      - CHOWN
                      - SETUID
                      - SETGID
                volumeMounts:
                  - name: data
                    mountPath: /appdata
                  - name: nginx-lib
                    mountPath: /var/lib/nginx
                  - name: nginx-cache
                    mountPath: /var/cache/nginx
                  - name: nginx-log
                    mountPath: /var/log/nginx
                  - name: nginx-run
                    mountPath: /run/nginx
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: homarr-data
              - name: nginx-lib
                emptyDir: {}
              - name: nginx-cache
                emptyDir: {}
              - name: nginx-log
                emptyDir: {}
              - name: nginx-run
                emptyDir: {}

# ──────────────────────────────────────────────────────────────────
# Service
# ──────────────────────────────────────────────────────────────────

- name: Create Homarr Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: homarr
        namespace: "{{ homarr_namespace }}"
        labels:
          app: homarr
      spec:
        type: ClusterIP
        ports:
          - name: http
            port: "{{ homarr_port }}"
            targetPort: "{{ homarr_port }}"
            protocol: TCP
        selector:
          app: homarr

# ──────────────────────────────────────────────────────────────────
# IngressRoute
# ──────────────────────────────────────────────────────────────────

- name: Deploy Homarr IngressRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: homarr
        namespace: "{{ homarr_namespace }}"
      spec:
        entryPoints:
          - websecure
        routes:
          - match: "Host(`{{ homarr_domain }}`)"
            kind: Rule
            priority: 100
            services:
              - name: homarr
                port: "{{ homarr_port }}"
        tls:
          secretName: wildcard-{{ lookup('env', 'TF_VAR_domain') | replace('.', '-') }}-tls

# ──────────────────────────────────────────────────────────────────
# Wait for ready
# ──────────────────────────────────────────────────────────────────

- name: Wait for Homarr deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: homarr
    namespace: "{{ homarr_namespace }}"
  register: homarr_deploy_check
  until:
    - homarr_deploy_check.resources | length > 0
    - homarr_deploy_check.resources[0].status.availableReplicas is defined
    - homarr_deploy_check.resources[0].status.availableReplicas | int > 0
  retries: 30
  delay: 10

# ──────────────────────────────────────────────────────────────────
# Network policies (docs/PLAN.md H2.1)
# ──────────────────────────────────────────────────────────────────

- name: Apply network policies
  kubernetes.core.k8s:
    state: present
    template: networkpolicy.yaml.j2

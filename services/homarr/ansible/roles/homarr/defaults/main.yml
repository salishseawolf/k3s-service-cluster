---
homarr_namespace: homarr
homarr_domain: "dashboard.{{ lookup('env', 'TF_VAR_domain') }}"
homarr_image: "ghcr.io/homarr-labs/homarr:v{{ homarr_version }}"
homarr_version: "1.66.1"
homarr_port: 7575
homarr_storage: 5Gi
homarr_storage_class: seaweedfs-storage

# Authentik
homarr_authentik_host: "https://auth.{{ lookup('env', 'TF_VAR_domain') }}"

# 1Password references
homarr_encryption_key_ref: "vaults/K3s Service Cluster/items/Homarr Encryption Key"

# Secret names
homarr_encryption_key_secret_name: homarr-encryption-key
homarr_oidc_creds_secret_name: homarr-oidc-creds

homarr_timezone: America/Los_Angeles

# Database (shared CloudNativePG cluster)
homarr_db_host: "main-db-rw.database.svc.cluster.local"
homarr_db_name: homarr
homarr_db_user: homarr_user
homarr_db_port: "5432"

# 1Password references
homarr_db_password_ref: "vaults/K3s Service Cluster/items/Homarr DB Password"

homarr_db_password: "{{ lookup('env', 'HOMARR_DB_PASSWORD') }}"

homarr_db_password_secret_name: homarr-db-password

homarr_redis_credentials_ref: "vaults/K3s Service Cluster/items/Redis"

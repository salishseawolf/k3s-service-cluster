# Credential inversion: pre-generated in 1P, referenced by BOTH the Authentik
# blueprint (via !Env in identity) and this app. No extraction, ever.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: homarr-oidc-creds
  namespace: homarr
spec:
  itemPath: "vaults/K3s Service Cluster/items/Homarr Secrets"

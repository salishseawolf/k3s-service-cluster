apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homarr
  namespace: 'homarr'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`dashboard.{{ .Values.domain }}`)
    kind: Rule
    priority: 100
    middlewares:
    - name: authentik-forward-auth
      namespace: identity
    services:
    - name: homarr
      port: '7575'
  tls:
    secretName: wildcard-{{ .Values.domain | replace "." "-" }}-tls
